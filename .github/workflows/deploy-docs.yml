name: Deploy Methodology Docs

on:
  push:
    branches: [main]
    paths:
      - 'methodology/**'
      - 'resources/**'
      - 'requirements.txt'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so git-revision-date-localized can read commit dates

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install dependencies
        # MkDocs is retired as the live methodology site (now served from
        # fastr-analytics.org built by FASTR-Analytics/site). The MkDocs
        # build kept here only deploys a redirect page to GitHub Pages so
        # any link to the old URL bounces to the new site. These deps live
        # inline rather than in requirements.txt so collaborator setups
        # aren't bloated with MkDocs they'll never use.
        run: |
          pip install \
            'mkdocs>=1.5.0' \
            'mkdocs-material>=9.0.0' \
            'mkdocs-bibtex>=2.11.0' \
            'mkdocs-minify-plugin>=0.7.0' \
            'mkdocs-static-i18n>=1.0.0' \
            'mkdocs-exclude>=1.0.2' \
            'mkdocs-git-revision-date-localized-plugin>=1.2.0'
          pip install -r requirements.txt
          pip install -e methodology/plugins/

      - name: Build documentation
        run: mkdocs build -f methodology/mkdocs.yml

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
