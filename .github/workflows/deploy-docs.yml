name: Deploy Methodology Docs

on:
  push:
    branches: [main]
    paths:
      - 'methodology/**'
      - 'resources/**'
      - 'requirements.txt'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e methodology/plugins/

      - name: Install Playwright Chromium
        run: playwright install chromium

      - name: Patch mkdocs-exporter for compatibility
        run: |
          PKG_DIR=$(python -c "import mkdocs_exporter; import os; print(os.path.dirname(mkdocs_exporter.__file__))")

          # Fix 1: asyncio event loop mismatch when i18n plugin triggers nested builds
          sed -i 's/^\(\s*\)while self.tasks:/\1asyncio.set_event_loop(self.loop)\n\1while self.tasks:/' \
            "$PKG_DIR/formats/pdf/plugin.py"

          # Fix 2: strip iframes before PDF rendering to prevent network timeouts
          # (Scribe embeds poll third-party services endlessly, blocking networkidle)
          sed -i 's/preprocessor.preprocess(page.html)/preprocessor.preprocess(page.html)\n    preprocessor.remove("iframe")/' \
            "$PKG_DIR/formats/pdf/renderer.py"

      - name: Build documentation
        run: mkdocs build -f methodology/mkdocs.yml

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
