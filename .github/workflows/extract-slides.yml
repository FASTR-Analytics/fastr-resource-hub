name: Extract Slides

# Triggers whenever methodology source content (or the extraction script
# itself) is changed on main. Re-extracts slides into core_content/ for all
# three languages so methodology and core_content never drift, and nobody
# has to remember to run tools/00_extract_slides.py locally before pushing.
# Does NOT trigger on core_content/** or core_content_{fr,pt}/** so the
# bot's own commits don't loop.
on:
  push:
    branches: [main]
    paths:
      - 'methodology/**/*.md'
      - 'modules.yaml'
      - 'tools/00_extract_slides.py'
      - '.github/workflows/extract-slides.yml'
  workflow_dispatch:

permissions:
  contents: write   # to commit regenerated slides back to main

concurrency:
  group: extract-slides
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install pyyaml

      - name: Re-extract slides (EN + FR + PT)
        run: python3 tools/00_extract_slides.py --lang en --lang fr --lang pt

      - name: Commit + push regenerated slides
        run: |
          if [ -z "$(git status --porcelain core_content/ core_content_fr/ core_content_pt/)" ]; then
            echo "No slide changes — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core_content/ core_content_fr/ core_content_pt/
          git commit -m "core_content: auto-extract slides from methodology [skip ci]

          Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

          # Retry with rebase if humans pushed to main during the build.
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt). Rebasing onto fresh main."
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Could not push regenerated slides after 5 attempts."
          exit 1
