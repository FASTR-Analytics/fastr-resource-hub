name: Platform drift check

# Weekly (Monday 06:00 UTC) sweep of FASTR-Analytics/platform and
# FASTR-Analytics/modules. When new CHANGELOG entries or commits appear on
# either upstream repo, opens a labelled, assigned triage issue here listing
# the repo content each change is likely to touch, then runs a Claude Code
# triage job that comments on the issue with the files that actually need an
# edit, applies them on a drift/issue-N branch and opens a pull request for a
# human to merge (or closes the issue when nothing is affected). PDFs and
# extracted slides are rebuilt by the other workflows once the PR lands on
# main. See tools/check_platform_drift.py and .github/drift_triage_prompt.md.
#
# The triage job needs the ANTHROPIC_API_KEY repository secret; without it
# the job is skipped and the issue is still opened. Opening the pull request
# needs the optional DRIFT_PR_TOKEN secret (a fine-grained PAT), because the
# organization does not let GITHUB_TOKEN create pull requests; without it the
# job pushes the drift/issue-N branch and posts a compare link instead.
#
# Also runnable on-demand via "Run workflow" in the Actions tab.

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Re-run the Claude triage on an existing drift issue (skips the upstream check)"
        required: false
        default: ""

permissions:
  contents: write        # state file on main; drift/issue-N branches
  issues: write          # open / comment on / close the drift issue
  pull-requests: write   # the triage job's fix PR

concurrency:
  group: platform-drift-check
  cancel-in-progress: false

jobs:
  check:
    if: github.event.inputs.issue_number == ''
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.drift.outputs.issue_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run drift check
        id: drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/check_platform_drift.py

      - name: Commit updated state file
        run: |
          if [ -z "$(git status --porcelain .github/platform_watch_state.json)" ]; then
            echo "State unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/platform_watch_state.json
          git commit -m "platform-drift: update last-seen state [skip ci]

          Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

          # Retry with rebase if humans pushed to main during the run.
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt). Rebasing onto fresh main."
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Could not push state file after 5 attempts."
          exit 1

  triage:
    needs: check
    if: always() && (needs.check.outputs.issue_number != '' || github.event.inputs.issue_number != '')
    runs-on: ubuntu-latest
    env:
      TRIAGE_ISSUE: ${{ github.event.inputs.issue_number || needs.check.outputs.issue_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python (for validate_content.py)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml

      - name: Gate on API key
        id: gate
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "::warning::ANTHROPIC_API_KEY secret not set — skipping Claude triage."; fi

      - name: Claude triage
        if: steps.gate.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          ISSUE_NUMBER: ${{ env.TRIAGE_ISSUE }}
          # The organization forbids GITHUB_TOKEN from opening pull requests.
          # DRIFT_PR_TOKEN is an optional fine-grained PAT (contents + pull
          # requests: write on this repo); when set, gh uses it for
          # `gh pr create`. When unset the job pushes the branch and posts
          # the compare link on the issue instead.
          GH_TOKEN: ${{ secrets.DRIFT_PR_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Triage issue #${{ env.TRIAGE_ISSUE }} in ${{ github.repository }} following the instructions in .github/drift_triage_prompt.md (read that file first). Fetch the issue body once with `gh issue view ${{ env.TRIAGE_ISSUE }} --json body -q .body`. You have a hard budget of about 60 tool calls: batch your greps (one Grep with alternation per area), do not list directories or open screenshots, and post the comment before the budget runs out even if some entries are left unchecked (say so in "Not affected").
          claude_args: |
            --model claude-sonnet-5
            --max-turns 120
            --allowedTools "Read,Grep,Glob,Edit,MultiEdit,Write,Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue close:*),Bash(gh pr create:*),Bash(gh api repos/FASTR-Analytics/*),Bash(gh search code:*),Bash(git log:*),Bash(git grep:*),Bash(git status:*),Bash(git diff:*),Bash(git checkout -b drift/*),Bash(git add:*),Bash(git commit:*),Bash(git push -u origin drift/*),Bash(git config user.*),Bash(python3 tools/validate_content.py:*)"
