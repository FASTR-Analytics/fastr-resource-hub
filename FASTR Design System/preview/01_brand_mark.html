<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; font-family:'Inter',sans-serif; background:#fff; }
  .wrap { padding:18px 22px; display:flex; align-items:stretch; gap:14px; height:152px; box-sizing:border-box; }
  .tile { flex:1; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:14px; box-sizing:border-box; position:relative; }
  .tile img { max-width:90%; max-height:78%; object-fit:contain; display:block; }
  .light { background:#fff; border:1px solid #DEE2E6; }
  .dark  { background:#09544F; }
  .gff   { background:#0C716B; }
  .lbl { position:absolute; left:10px; bottom:6px; font-size:10px; color:#7F8C8D; font-family:'Inter',sans-serif; letter-spacing:.04em;}
  .dark .lbl, .gff .lbl { color:rgba(255,255,255,.7);}
  .lock { position:absolute; top:8px; right:10px; font-size:9px; font-weight:700; letter-spacing:.12em; color:#A6630F; background:rgba(247,148,29,.18); padding:2px 7px; border-radius:9999px; text-transform:uppercase;}
</style></head>
<body>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap">
  <div class="wrap">
    <div class="tile light">
      <span class="lock">Locked</span>
      <img src="../assets/logos/FASTR_Primary_01_FullName.png" alt="FASTR primary logo">
      <span class="lbl">FASTR · primary</span>
    </div>
    <div class="tile dark">
      <img src="../assets/logos/FASTR_White_Horiz.png" alt="FASTR white horizontal">
      <span class="lbl">FASTR · white horizontal</span>
    </div>
    <div class="tile gff">
      <img src="../assets/logos/GFF_Logo_Horizontal_White_En.png" alt="GFF parent logo">
      <span class="lbl">GFF parent lock-up</span>
    </div>
  </div>
</body></html>
