<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; font-family:'Poppins',sans-serif; background:#fff; }
  .wrap { padding:24px; }
  .row { display:flex; gap:10px; }
  .sw { flex:1; height:88px; border-radius:6px; padding:10px 12px; box-sizing:border-box; color:#fff; display:flex; flex-direction:column; justify-content:space-between; font-size:11px; }
  .sw .name { font-weight:600; font-size:12px; letter-spacing:.01em; }
  .sw .hex  { font-family:'Monaco',monospace; opacity:.85; font-size:11px; letter-spacing:.02em; }
  .sw.lite { color:#09544F; }
</style></head>
<body>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap">
  <div class="wrap">
    <div class="row">
      <div class="sw" style="background:#09544F"><span class="name">Deep green</span><span class="hex">#09544F</span></div>
      <div class="sw" style="background:#0C716B"><span class="name">Dark green</span><span class="hex">#0C716B</span></div>
      <div class="sw" style="background:#1F9A9C"><span class="name">Green</span><span class="hex">#1F9A9C</span></div>
      <div class="sw lite" style="background:#CAE6E9"><span class="name">Light blue</span><span class="hex">#CAE6E9</span></div>
      <div class="sw lite" style="background:#D0CB17"><span class="name">Lime</span><span class="hex">#D0CB17</span></div>
    </div>
  </div>
</body></html>
