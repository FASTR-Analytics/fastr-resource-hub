<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; font-family:'Poppins',sans-serif; background:#fff; }
  .wrap { padding:24px; }
  .row { display:flex; gap:10px; }
  .sw { flex:1; height:88px; border-radius:6px; padding:10px 12px; box-sizing:border-box; color:#fff; display:flex; flex-direction:column; justify-content:space-between; font-size:11px; }
  .sw .name { font-weight:600; font-size:12px; }
  .sw .hex  { font-family:'Monaco',monospace; opacity:.85; font-size:11px; }
</style></head>
<body>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap">
  <div class="wrap">
    <div class="row">
      <div class="sw" style="background:#21568C"><span class="name">Navy</span><span class="hex">#21568C</span></div>
      <div class="sw" style="background:#1A90C0"><span class="name">Blue</span><span class="hex">#1A90C0</span></div>
      <div class="sw" style="background:#D8A822"><span class="name">Gold</span><span class="hex">#D8A822</span></div>
      <div class="sw" style="background:#7A1F6E"><span class="name">Purple</span><span class="hex">#7A1F6E</span></div>
      <div class="sw" style="background:#BD5091"><span class="name">Orchid</span><span class="hex">#BD5091</span></div>
      <div class="sw" style="background:#FF6462"><span class="name">Coral</span><span class="hex">#FF6462</span></div>
    </div>
  </div>
</body></html>
