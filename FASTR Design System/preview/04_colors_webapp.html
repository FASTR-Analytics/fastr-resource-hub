<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; font-family:'Inter',sans-serif; background:#fff; }
  .wrap { padding:24px; }
  .row { display:flex; gap:10px; }
  .sw { flex:1; height:88px; border-radius:6px; padding:10px 12px; box-sizing:border-box; color:#fff; display:flex; flex-direction:column; justify-content:space-between; font-size:11px; }
  .sw .name { font-weight:600; font-size:12px; }
  .sw .hex  { font-family:'Monaco',monospace; opacity:.85; font-size:11px; }
  .lite { color:#1B365D !important; }
  .lite .hex { opacity:.7; }
  .head { font-size:11px; font-weight:600; color:#64748B; letter-spacing:.06em; text-transform:uppercase; margin-bottom:10px; }
</style></head>
<body>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap">
  <div class="wrap">
    <div class="head">Deck Builder web app palette</div>
    <div class="row">
      <div class="sw" style="background:#1B365D"><span class="name">Primary</span><span class="hex">#1B365D</span></div>
      <div class="sw" style="background:#122544"><span class="name">Primary dark</span><span class="hex">#122544</span></div>
      <div class="sw" style="background:#00A9CE"><span class="name">Secondary</span><span class="hex">#00A9CE</span></div>
      <div class="sw" style="background:#F7941D"><span class="name">Accent</span><span class="hex">#F7941D</span></div>
      <div class="sw lite" style="background:#E8F4F8"><span class="name">Light</span><span class="hex">#E8F4F8</span></div>
    </div>
  </div>
</body></html>
