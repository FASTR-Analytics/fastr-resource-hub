<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; font-family:'Inter',sans-serif; background:#fff; }
  .wrap { padding:20px 24px; }
  .row { display:flex; gap:8px; }
  .sw { flex:1; height:64px; border-radius:6px; box-sizing:border-box; display:flex; flex-direction:column; justify-content:flex-end; padding:8px 10px; font-size:10px; color:#0F172A; border:1px solid #E5E7EB; }
  .sw.dark { color:#fff; border-color:transparent; }
  .name { font-weight:600; font-family:'Monaco',monospace; font-size:10px; }
  .lbl { font-size:9px; opacity:.6; letter-spacing:.04em; text-transform:uppercase; margin-top:2px;}
</style></head>
<body>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap">
  <div class="wrap">
    <div class="row">
      <div class="sw" style="background:#FFFFFF"><span class="name">#FFFFFF</span><span class="lbl">bg-1</span></div>
      <div class="sw" style="background:#F8F9FA"><span class="name">#F8F9FA</span><span class="lbl">bg-2</span></div>
      <div class="sw" style="background:#F8FAFC"><span class="name">#F8FAFC</span><span class="lbl">bg-app</span></div>
      <div class="sw" style="background:#E9ECEF"><span class="name">#E9ECEF</span><span class="lbl">bg-3</span></div>
      <div class="sw" style="background:#DEE2E6"><span class="name">#DEE2E6</span><span class="lbl">border-1</span></div>
      <div class="sw" style="background:#95A5A6;color:#fff"><span class="name">#95A5A6</span><span class="lbl">fg-3</span></div>
      <div class="sw dark" style="background:#7F8C8D"><span class="name">#7F8C8D</span><span class="lbl">fg-2</span></div>
      <div class="sw dark" style="background:#2C3E50"><span class="name">#2C3E50</span><span class="lbl">fg-1</span></div>
    </div>
  </div>
</body></html>
