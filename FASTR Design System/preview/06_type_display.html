<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; font-family:'Poppins',sans-serif; background:#fff; color:#2C3E50; }
  .wrap { padding:20px 24px; display:grid; grid-template-columns:80px 1fr 90px; row-gap:8px; column-gap:18px; align-items:baseline;}
  .label { font-size:10px; color:#7F8C8D; font-family:'Monaco',monospace; letter-spacing:.04em; text-transform:uppercase; }
  .specimen { line-height:1; }
  .meta { font-size:10px; color:#95A5A6; font-family:'Monaco',monospace; text-align:right;}
  h1 { margin:0; font-size:44px; font-weight:700; color:#09544F; border-bottom:4px solid #D0CB17; padding-bottom:.25em; letter-spacing:-.01em;}
  h2 { margin:0; font-size:28px; font-weight:600; color:#0C716B; padding-left:.4em; border-left:4px solid #1F9A9C;}
  h3 { margin:0; font-size:22px; font-weight:600; color:#7A1F6E; padding-left:.4em; border-left:4px solid #BD5091;}
  .body { font-size:16px; line-height:1.4; }
</style></head>
<body>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
  <div class="wrap">
    <div class="label">H1</div><div class="specimen"><h1>Poppins Bold</h1></div><div class="meta">44 / 700</div>
    <div class="label">H2</div><div class="specimen"><h2>Poppins SemiBold</h2></div><div class="meta">28 / 600</div>
    <div class="label">H3</div><div class="specimen"><h3>Poppins SemiBold</h3></div><div class="meta">22 / 600</div>
  </div>
</body></html>
