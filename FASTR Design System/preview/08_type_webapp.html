<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; font-family:'Inter',sans-serif; background:#fff; color:#0F172A; padding:20px 24px;}
  .row { display:grid; grid-template-columns:80px 1fr 90px; column-gap:18px; align-items:baseline; margin-bottom:10px;}
  .label { font-size:10px; color:#64748B; font-family:'Monaco',monospace; letter-spacing:.04em; text-transform:uppercase; }
  .meta { font-size:10px; color:#94A3B8; font-family:'Monaco',monospace; text-align:right;}
  h1 { margin:0; font-size:24px; font-weight:700; color:#1B365D; letter-spacing:-.01em;}
  h2 { margin:0; font-size:18px; font-weight:600; color:#1B365D;}
  p.body { margin:0; font-size:15px; line-height:1.5;}
  p.cap  { margin:0; font-size:12px; color:#64748B; font-weight:500;}
</style></head>
<body>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <div class="row"><div class="label">Inter / H1</div><div><h1>Build your workshop deck</h1></div><div class="meta">24 / 700</div></div>
  <div class="row"><div class="label">Inter / H2</div><div><h2>Content library</h2></div><div class="meta">18 / 600</div></div>
  <div class="row"><div class="label">Inter / body</div><div><p class="body">Drag slides from the library into your workshop. The schedule recalculates automatically.</p></div><div class="meta">15 / 400</div></div>
  <div class="row"><div class="label">Inter / cap</div><div><p class="cap">12 slides · 45–60 min · Module 4</p></div><div class="meta">12 / 500</div></div>
</body></html>
