<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; font-family:'Inter',sans-serif; background:#fff; color:#0F172A; padding:18px 22px; }
  .grid { display:grid; grid-template-columns:repeat(8,1fr); gap:8px; align-items:end; }
  .col { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .bar { background:#1F9A9C; border-radius:3px; width:100%; }
  .nm { font-family:'Monaco',monospace; font-size:10px; color:#64748B;}
  .px { font-family:'Monaco',monospace; font-size:10px; color:#1F9A9C; font-weight:600;}
  h4 { margin:0 0 12px; font-size:11px; color:#64748B; letter-spacing:.08em; text-transform:uppercase;}
</style></head>
<body>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap">
  <h4 style="padding:0 4px">4-pt spacing scale</h4>
  <div class="grid">
    <div class="col"><div class="bar" style="height:4px"></div><div class="nm">space-1</div><div class="px">4</div></div>
    <div class="col"><div class="bar" style="height:8px"></div><div class="nm">space-2</div><div class="px">8</div></div>
    <div class="col"><div class="bar" style="height:12px"></div><div class="nm">space-3</div><div class="px">12</div></div>
    <div class="col"><div class="bar" style="height:16px"></div><div class="nm">space-4</div><div class="px">16</div></div>
    <div class="col"><div class="bar" style="height:24px"></div><div class="nm">space-5</div><div class="px">24</div></div>
    <div class="col"><div class="bar" style="height:32px"></div><div class="nm">space-6</div><div class="px">32</div></div>
    <div class="col"><div class="bar" style="height:48px"></div><div class="nm">space-7</div><div class="px">48</div></div>
    <div class="col"><div class="bar" style="height:64px"></div><div class="nm">space-8</div><div class="px">64</div></div>
  </div>
</body></html>
