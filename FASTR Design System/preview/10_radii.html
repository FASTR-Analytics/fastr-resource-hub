<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; font-family:'Inter',sans-serif; background:#fff; color:#0F172A; padding:18px 22px;}
  .row { display:flex; gap:14px; align-items:flex-end; }
  .sample { width:74px; height:74px; background:#CAE6E9; border:1px solid #1F9A9C; }
  .nm { font-family:'Monaco',monospace; font-size:10px; color:#64748B; margin-top:6px;}
  .px { font-family:'Monaco',monospace; font-size:10px; color:#1F9A9C; font-weight:600;}
  .cell { display:flex; flex-direction:column; align-items:center; }
  h4 { margin:0 0 14px; font-size:11px; color:#64748B; letter-spacing:.08em; text-transform:uppercase;}
</style></head>
<body>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap">
  <h4>Corner radii</h4>
  <div class="row">
    <div class="cell"><div class="sample" style="border-radius:0"></div><div class="nm">none</div><div class="px">0</div></div>
    <div class="cell"><div class="sample" style="border-radius:4px"></div><div class="nm">xs</div><div class="px">4</div></div>
    <div class="cell"><div class="sample" style="border-radius:6px"></div><div class="nm">sm</div><div class="px">6</div></div>
    <div class="cell"><div class="sample" style="border-radius:8px"></div><div class="nm">md</div><div class="px">8</div></div>
    <div class="cell"><div class="sample" style="border-radius:12px"></div><div class="nm">lg</div><div class="px">12</div></div>
    <div class="cell"><div class="sample" style="border-radius:16px"></div><div class="nm">xl · cards</div><div class="px">16</div></div>
    <div class="cell"><div class="sample" style="border-radius:9999px"></div><div class="nm">pill</div><div class="px">∞</div></div>
  </div>
</body></html>
