<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; font-family:'Inter',sans-serif; background:#F8FAFC; color:#0F172A; padding:20px 24px;}
  .row { display:flex; gap:18px;}
  .card { flex:1; height:108px; background:#fff; padding:14px 16px; box-sizing:border-box; display:flex; flex-direction:column; justify-content:space-between;}
  .lbl { font-family:'Monaco',monospace; font-size:10px; color:#64748B; }
  .nm  { font-size:13px; font-weight:600; color:#1B365D;}
  .s1 { box-shadow: 0 1px 2px 0 rgba(15,23,42,.05); border:1px solid #E5E7EB; border-radius:12px;}
  .s2 { box-shadow: 0 1px 2px rgba(15,23,42,.05), 0 0 0 1px rgba(0,0,0,.05); border-radius:16px;}
  .s3 { box-shadow: 0 4px 12px rgba(15,23,42,.08); border-radius:16px;}
  .s4 { box-shadow: 0 12px 32px rgba(15,23,42,.12); border-radius:16px;}
</style></head>
<body>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap">
  <div class="row">
    <div class="card s1"><span class="nm">shadow-sm</span><span class="lbl">border + tiny</span></div>
    <div class="card s2"><span class="nm">shadow-card</span><span class="lbl">card + ring · default</span></div>
    <div class="card s3"><span class="nm">shadow-md</span><span class="lbl">hover / lift</span></div>
    <div class="card s4"><span class="nm">shadow-lg</span><span class="lbl">menus, modals</span></div>
  </div>
</body></html>
