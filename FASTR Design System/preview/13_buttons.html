<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; font-family:'Inter',sans-serif; background:#fff; padding:18px 22px; color:#0F172A;}
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  button { font-family:inherit; font-size:13px; font-weight:600; border-radius:8px; padding:8px 14px; cursor:pointer; transition:.15s;}
  .primary  { background:#1B365D; color:#fff; border:1px solid #1B365D;}
  .primary:hover { background:#122544;}
  .secondary{ background:#fff; color:#1B365D; border:1px solid #E5E7EB;}
  .secondary:hover { background:#F8FAFC;}
  .accent { background:#F7941D; color:#fff; border:1px solid #F7941D;}
  .accent:hover { background:#D87E12;}
  .ghost { background:transparent; color:#1B365D; border:1px solid transparent;}
  .ghost:hover { background:#E8F4F8;}
  .danger { background:#fff; color:#B91C1C; border:1px solid #FECACA;}
  .pill { border-radius:9999px; padding:6px 12px; font-size:12px; }
  .info-pill { background:#E8F4F8; color:#1B365D; border:none;}
  h4 { margin:0 0 12px; font-size:11px; color:#64748B; letter-spacing:.08em; text-transform:uppercase;}
</style></head>
<body>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap">
  <h4>Buttons · Web app</h4>
  <div class="row">
    <button class="primary">Build deck</button>
    <button class="secondary">Cancel</button>
    <button class="accent">Export PPTX</button>
    <button class="ghost">Skip</button>
    <button class="danger">Remove slide</button>
    <button class="primary pill">+ Add module</button>
    <button class="info-pill pill">Module 4 · 45 min</button>
  </div>
</body></html>
