<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; font-family:'Inter',sans-serif; background:#F8FAFC; padding:16px 20px; color:#0F172A;}
  .row { display:flex; gap:14px;}
  .field { flex:1; }
  label { display:block; font-size:11px; font-weight:600; color:#475569; margin-bottom:6px;}
  input, select, textarea { width:100%; box-sizing:border-box; font-family:inherit; font-size:13px; padding:8px 10px; border-radius:8px; border:1px solid #CBD5E1; background:#fff; color:#0F172A; outline:none; transition:.15s;}
  input:focus, select:focus { border-color:#00A9CE; box-shadow:0 0 0 3px rgba(0,169,206,.18);}
  .helper { font-size:11px; color:#64748B; margin-top:4px;}
  .seg { display:flex; border:1px solid #CBD5E1; border-radius:8px; overflow:hidden; background:#fff;}
  .seg button { flex:1; padding:7px 0; font-size:12px; font-weight:600; border:none; background:transparent; color:#475569; cursor:pointer;}
  .seg button.on { background:#1B365D; color:#fff;}
</style></head>
<body>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <div class="row">
    <div class="field">
      <label>Workshop title</label>
      <input type="text" value="FASTR Rwanda 2026">
      <div class="helper">Used on the cover slide.</div>
    </div>
    <div class="field">
      <label>Audience</label>
      <select><option>Ministry of Health analysts</option></select>
    </div>
    <div class="field">
      <label>Variant</label>
      <div class="seg"><button class="on">Full</button><button>Condensed</button></div>
    </div>
  </div>
</body></html>
