<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; font-family:'Inter',sans-serif; background:#fff; }
  .wrap { padding:14px 18px; display:flex; gap:12px; height:200px; box-sizing:border-box; }
  .tile { flex:1; border-radius:8px; overflow:hidden; position:relative; background:#09544F; }
  .tile img { width:100%; height:100%; object-fit:cover; object-position:center; display:block; }
  .lbl { position:absolute; left:10px; bottom:8px; font-size:10px; color:rgba(255,255,255,.85); letter-spacing:.04em; background:rgba(0,0,0,.25); padding:3px 8px; border-radius:9999px;}
  .lock { position:absolute; top:8px; right:10px; font-size:9px; font-weight:700; letter-spacing:.12em; color:#A6630F; background:rgba(255,255,255,.92); padding:2px 7px; border-radius:9999px; text-transform:uppercase;}
</style></head>
<body>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap">
  <div class="wrap">
    <div class="tile">
      <img src="../assets/backgrounds/cover_slide.png" alt="Cover slide template">
      <span class="lock">Locked</span>
      <span class="lbl">Cover · as-shipped</span>
    </div>
    <div class="tile">
      <img src="../assets/backgrounds/section_slide.png" alt="Section divider template">
      <span class="lock">Locked</span>
      <span class="lbl">Section divider · as-shipped</span>
    </div>
  </div>
</body></html>
