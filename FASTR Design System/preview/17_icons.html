<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; font-family:'Inter',sans-serif; padding:14px 22px; background:#fff;}
  h4 { margin:0 0 10px; font-size:11px; color:#7F8C8D; letter-spacing:.08em; text-transform:uppercase;}
  .row { display:flex; gap:18px; align-items:flex-start; flex-wrap:nowrap;}
  .icon { display:flex; flex-direction:column; align-items:center; gap:6px; width:88px;}
  .glyph {
    width:54px; height:54px;
    background-color:#0C716B;
    -webkit-mask-size: contain; mask-size: contain;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center;
  }
  .icon span { font-size:10px; color:#7F8C8D;}
  .note { margin-top:10px; font-size:10px; color:#95A5A6; font-style:italic;}
</style></head>
<body>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap">
  <h4>Workshop activity icons · line set, tinted to brand teal</h4>
  <div class="row">
    <div class="icon"><div class="glyph" style="-webkit-mask-image:url('../assets/icons/communication.png'); mask-image:url('../assets/icons/communication.png');"></div><span>Discussion</span></div>
    <div class="icon"><div class="glyph" style="-webkit-mask-image:url('../assets/icons/raise-hand.png'); mask-image:url('../assets/icons/raise-hand.png');"></div><span>Question</span></div>
    <div class="icon"><div class="glyph" style="-webkit-mask-image:url('../assets/icons/thought.png'); mask-image:url('../assets/icons/thought.png');"></div><span>Reflect</span></div>
    <div class="icon"><div class="glyph" style="-webkit-mask-image:url('../assets/icons/debrief.png'); mask-image:url('../assets/icons/debrief.png');"></div><span>Debrief</span></div>
    <div class="icon"><div class="glyph" style="-webkit-mask-image:url('../assets/icons/post-it.png'); mask-image:url('../assets/icons/post-it.png');"></div><span>Sticky note</span></div>
  </div>
  <div class="note">All glyphs rendered as CSS masks · single colour, single stroke weight, one consistent style.</div>
</body></html>
