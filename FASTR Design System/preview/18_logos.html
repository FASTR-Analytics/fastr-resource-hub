<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; font-family:'Poppins',sans-serif; background:#fff; padding:18px 22px;}
  .row { display:flex; gap:18px; align-items:center;}
  .logo { flex:1; display:flex; align-items:center; justify-content:center; height:120px; border-radius:8px;}
  .logo img { max-height:90%; max-width:90%; object-fit:contain;}
  .light { background:#fff; border:1px solid #DEE2E6;}
  .dark  { background:#09544F;}
  .teal  { background:#0C716B;}
  .lbl { text-align:center; font-size:10px; color:#7F8C8D; margin-top:6px; font-family:'Inter',sans-serif;}
  .cell { flex:1; display:flex; flex-direction:column;}
</style></head>
<body>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap">
  <div class="row">
    <div class="cell"><div class="logo light"><img src="../assets/logos/FASTR_Primary_01_FullName.png"></div><div class="lbl">Primary · on light</div></div>
    <div class="cell"><div class="logo dark"><img src="../assets/logos/FASTR_White_Horiz.png"></div><div class="lbl">White horizontal · on dark</div></div>
    <div class="cell"><div class="logo teal"><img src="../assets/logos/GFF_Logo_Horizontal_White_En.png"></div><div class="lbl">GFF parent · on teal</div></div>
  </div>
</body></html>
