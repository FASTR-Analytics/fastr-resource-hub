<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
  html,body { margin:0; height:100%; background:#1a1a1a; overflow:hidden; font-family:'Poppins',sans-serif;}
  .stage { width:100vw; height:100vh; display:flex; align-items:center; justify-content:center;}
  .slide { width:1280px; height:720px; background:#fff; padding:60px 80px; box-sizing:border-box; position:relative; transform-origin:center; color:#2C3E50; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;}
  h1 { font-size:54px; font-weight:700; color:#09544F; margin:0 0 14px; padding-bottom:.25em; border-bottom:4px solid #D0CB17;}
  .sub { font-size:24px; color:#2C3E50; max-width:880px; line-height:1.45;}
  .actions { display:flex; gap:18px; margin-top:48px;}
  .pill { padding:14px 26px; border-radius:9999px; font-size:18px; font-weight:600; border:2px solid #0C716B; color:#0C716B;}
  .pill.solid { background:#0C716B; color:#fff;}
  .meta { position:absolute; bottom:36px; left:0; right:0; display:flex; justify-content:center; gap:36px; font-size:14px; color:#7F8C8D;}
  .meta b { color:#0C716B;}
  .fastr { position:absolute; bottom:30px; right:80px; height:26px; opacity:.6;}
  .gff { position:absolute; bottom:30px; left:80px; height:26px; opacity:.6;}
</style></head><body>
<div class="stage"><div class="slide">
  <h1>Thank you</h1>
  <div class="sub">Slides, methodology, and the data-quality scripts are on the Resource Hub. Reach out any time &mdash; we read every question.</div>
  <div class="actions">
    <span class="pill solid">fastr@gff.org</span>
    <span class="pill">data.gffportal.org/key-theme/FASTR</span>
  </div>
  <div class="meta"><span><b>Twitter / X</b> · @gff_global</span><span><b>LinkedIn</b> · /company/gff</span></div>
  <img src="../assets/logos/FASTR_Primary_01_FullName.png" class="fastr" style="height:34px;">
</div></div>
<script>function fit(){const s=document.querySelector('.slide');const k=Math.min(innerWidth/1280,innerHeight/720);s.style.transform=`scale(${k})`}addEventListener('resize',fit);fit();</script>
</body></html>
