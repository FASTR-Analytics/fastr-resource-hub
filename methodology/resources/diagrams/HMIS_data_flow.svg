<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="420" viewBox="0 0 200 420">
  <defs>
    <style>
      .box { rx: 8; ry: 8; }
      .text-main { font-family: 'Roboto', Arial, sans-serif; font-size: 13px; font-weight: 500; fill: white; text-anchor: middle; }
      .text-small { font-family: 'Roboto', Arial, sans-serif; font-size: 11px; fill: white; text-anchor: middle; }
      .arrow { fill: #0c716b; }
    </style>
  </defs>

  <!-- HMIS Data (top) -->
  <rect class="box" x="25" y="10" width="150" height="50" fill="#1990c0"/>
  <text class="text-main" x="100" y="40">HMIS Data</text>

  <!-- Arrow 1 -->
  <polygon class="arrow" points="100,70 90,60 90,68 90,68 110,68 110,60"/>
  <rect fill="#0c716b" x="95" y="68" width="10" height="12"/>

  <!-- Assess Data Quality -->
  <rect class="box" x="25" y="85" width="150" height="60" fill="#1ea29c"/>
  <text class="text-main" x="100" y="110">Assess</text>
  <text class="text-small" x="100" y="125">Data Quality</text>

  <!-- Arrow 2 -->
  <polygon class="arrow" points="100,155 90,145 90,153 110,153 110,145"/>
  <rect fill="#0c716b" x="95" y="153" width="10" height="12"/>

  <!-- Adjust for DQ -->
  <rect class="box" x="25" y="170" width="150" height="60" fill="#1ea29c"/>
  <text class="text-main" x="100" y="195">Adjust</text>
  <text class="text-small" x="100" y="210">for Data Quality</text>

  <!-- Arrow 3 -->
  <polygon class="arrow" points="100,240 90,230 90,238 110,238 110,230"/>
  <rect fill="#0c716b" x="95" y="238" width="10" height="12"/>

  <!-- Analyze Trends -->
  <rect class="box" x="25" y="255" width="150" height="60" fill="#1ea29c"/>
  <text class="text-main" x="100" y="280">Analyze</text>
  <text class="text-small" x="100" y="295">Service Trends</text>

  <!-- Arrow 4 -->
  <polygon class="arrow" points="100,325 90,315 90,323 110,323 110,315"/>
  <rect fill="#0c716b" x="95" y="323" width="10" height="12"/>

  <!-- Actionable Evidence (bottom) -->
  <rect class="box" x="25" y="340" width="150" height="60" fill="#0c716b"/>
  <text class="text-main" x="100" y="365">Actionable</text>
  <text class="text-small" x="100" y="380">Evidence</text>
</svg>
