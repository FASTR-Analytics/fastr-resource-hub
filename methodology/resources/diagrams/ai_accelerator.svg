<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320">
  <defs>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1F9A9C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0C716B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" fill="#f8fafa"/>

  <!-- Dividing line -->
  <line x1="50" y1="135" x2="750" y2="135" stroke="#09544F" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.3"/>

  <!-- Zone labels on left -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="70" height="24" rx="4" fill="#09544F"/>
    <text x="35" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="white">DECIDES</text>
  </g>

  <g transform="translate(50, 200)">
    <rect x="0" y="0" width="70" height="24" rx="4" fill="#1F9A9C"/>
    <text x="35" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="white">SUPPORTS</text>
  </g>

  <!-- Human decision maker - centered at x=400 -->
  <g transform="translate(400, 20)">
    <circle cx="0" cy="18" r="20" fill="#09544F"/>
    <path d="M-32 58 Q-32 35 0 35 Q32 35 32 58 Z" fill="#09544F"/>
    <text x="0" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#09544F">Human Decision Maker</text>
    <text x="0" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#0C716B">Judgement · Accountability · Action</text>
  </g>

  <!-- Arrow from AI to Human -->
  <line x1="400" y1="168" x2="400" y2="145" stroke="#D0CB17" stroke-width="3"/>
  <polygon points="400,138 394,150 406,150" fill="#D0CB17"/>

  <!-- AI Assistant - centered at x=400 -->
  <g transform="translate(400, 195)">
    <rect x="-80" y="-20" width="160" height="40" rx="20" fill="url(#aiGradient)" stroke="#09544F" stroke-width="2"/>
    <text x="0" y="-2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="white">FASTR AI Assistant</text>
    <text x="0" y="12" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#CAE6E9">Grounded in evidence</text>
  </g>

  <!-- Three capabilities -->
  <g transform="translate(200, 275)">
    <rect x="-55" y="-20" width="110" height="40" rx="6" fill="#CAE6E9" stroke="#1A90C0" stroke-width="2"/>
    <text x="0" y="-4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#21568C">Interpretation</text>
    <text x="0" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#21568C">Explains patterns</text>
  </g>
  <line x1="200" y1="250" x2="335" y2="220" stroke="#1A90C0" stroke-width="2"/>

  <g transform="translate(400, 275)">
    <rect x="-55" y="-20" width="110" height="40" rx="6" fill="#fdf6e3" stroke="#D8A822" stroke-width="2"/>
    <text x="0" y="-4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#09544F">Querying</text>
    <text x="0" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#0C716B">Finds information</text>
  </g>
  <line x1="400" y1="250" x2="400" y2="220" stroke="#D8A822" stroke-width="2"/>

  <g transform="translate(600, 275)">
    <rect x="-55" y="-20" width="110" height="40" rx="6" fill="#f9e8f4" stroke="#BD5091" stroke-width="2"/>
    <text x="0" y="-4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#7A1F6E">Outputs</text>
    <text x="0" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#7A1F6E">Generates drafts</text>
  </g>
  <line x1="600" y1="250" x2="465" y2="220" stroke="#BD5091" stroke-width="2"/>

</svg>
