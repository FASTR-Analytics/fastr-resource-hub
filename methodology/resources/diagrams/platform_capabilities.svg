<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="420" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#09544F">FASTR Analytics Platform</text>
  <text x="480" y="65" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#7f8c8d">Key Capabilities</text>

  <!-- Connecting line -->
  <line x1="96" y1="160" x2="720" y2="160" stroke="#CAE6E9" stroke-width="3" stroke-dasharray="8,4"/>

  <!-- Flow arrows -->
  <g fill="#1F9A9C">
    <polygon points="210,155 220,160 210,165"/>
    <polygon points="366,155 376,160 366,165"/>
    <polygon points="522,155 532,160 522,165"/>
    <polygon points="678,155 688,160 678,165"/>
  </g>

  <!-- 1. Data Management -->
  <g transform="translate(51, 95)">
    <circle cx="45" cy="65" r="44" fill="#E8F4F3" filter="url(#shadow)"/>
    <!-- Database icon -->
    <g transform="translate(45, 65)" fill="none" stroke="#0C716B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="0" cy="-16" rx="18" ry="6"/>
      <path d="M -18 -16 L -18 16 C -18 20 -9 23 0 23 C 9 23 18 20 18 16 L 18 -16"/>
      <path d="M -18 0 C -18 4 -9 7 0 7 C 9 7 18 4 18 0" opacity="0.6"/>
    </g>
  </g>
  <text x="96" y="220" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#09544F">Data</text>
  <text x="96" y="233" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#09544F">Management</text>
  <text x="96" y="250" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#7f8c8d">Import facilities</text>
  <text x="96" y="262" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#7f8c8d">&amp; indicators</text>

  <!-- 2. Data Analysis -->
  <g transform="translate(207, 95)">
    <circle cx="45" cy="65" r="44" fill="#E8F4F3" filter="url(#shadow)"/>
    <!-- Code/Module icon -->
    <g transform="translate(45, 65)" fill="none" stroke="#0C716B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="-14,-12 -22,0 -14,12"/>
      <polyline points="14,-12 22,0 14,12"/>
      <line x1="6" y1="-16" x2="-6" y2="16"/>
    </g>
  </g>
  <text x="252" y="220" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#09544F">Data</text>
  <text x="252" y="233" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#09544F">Analysis</text>
  <text x="252" y="250" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#7f8c8d">Configure &amp; run</text>
  <text x="252" y="262" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#7f8c8d">statistical modules</text>

  <!-- 3. Visualization -->
  <g transform="translate(363, 95)">
    <circle cx="45" cy="65" r="44" fill="#E8F4F3" filter="url(#shadow)"/>
    <!-- Mountain/Chart icon -->
    <g transform="translate(45, 65)" fill="none" stroke="#0C716B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="-20,14 -7,-4 4,7 20,-14"/>
      <circle cx="20" cy="-14" r="3" fill="#0C716B"/>
    </g>
  </g>
  <text x="408" y="227" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#09544F">Visualization</text>
  <text x="408" y="250" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#7f8c8d">Charts, maps</text>
  <text x="408" y="262" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#7f8c8d">&amp; tables</text>

  <!-- 4. Reporting -->
  <g transform="translate(519, 95)">
    <circle cx="45" cy="65" r="44" fill="#E8F4F3" filter="url(#shadow)"/>
    <!-- Clipboard/Report icon -->
    <g transform="translate(45, 65)" fill="none" stroke="#0C716B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-14" y="-20" width="28" height="36" rx="3"/>
      <rect x="-6" y="-24" width="12" height="6" rx="2"/>
      <line x1="-8" y1="-4" x2="8" y2="-4"/>
      <line x1="-8" y1="4" x2="8" y2="4"/>
      <line x1="-8" y1="12" x2="3" y2="12"/>
    </g>
  </g>
  <text x="564" y="227" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#09544F">Reporting</text>
  <text x="564" y="250" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#7f8c8d">Export to PPTX</text>
  <text x="564" y="262" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#7f8c8d">&amp; PDF</text>

  <!-- 5. Collaboration -->
  <g transform="translate(675, 95)">
    <circle cx="45" cy="65" r="44" fill="#E8F4F3" filter="url(#shadow)"/>
    <!-- People icon -->
    <g transform="translate(45, 65)" fill="none" stroke="#0C716B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="-9" r="6"/>
      <path d="M -10 14 C -10 6 -6 2 0 2 C 6 2 10 6 10 14"/>
      <circle cx="-16" cy="-5" r="4.5" opacity="0.5"/>
      <path d="M -24 11 C -24 6 -21 3 -16 3 C -11 3 -8 6 -8 11" opacity="0.5"/>
      <circle cx="16" cy="-5" r="4.5" opacity="0.5"/>
      <path d="M 8 11 C 8 6 11 3 16 3 C 21 3 24 6 24 11" opacity="0.5"/>
    </g>
  </g>
  <text x="720" y="227" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#09544F">Collaboration</text>
  <text x="720" y="250" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#7f8c8d">Project-based</text>
  <text x="720" y="262" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#7f8c8d">team access</text>

  <!-- AI Assistant - spanning under Analysis, Visualization, Reporting -->
  <!-- Bracket connecting to supported capabilities -->
  <path d="M 252 275 L 252 295 L 408 310 L 564 295 L 564 275"
        fill="none" stroke="#CAE6E9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AI Assistant circle and icon -->
  <g transform="translate(363, 305)">
    <circle cx="45" cy="45" r="38" fill="#E8F4F3" filter="url(#shadow)"/>
    <!-- Sparkle/AI icon -->
    <g transform="translate(45, 45)" fill="none" stroke="#0C716B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0 -16 L 0 16 M -16 0 L 16 0"/>
      <path d="M -10 -10 L 10 10 M 10 -10 L -10 10"/>
      <circle cx="0" cy="-16" r="2" fill="#0C716B"/>
      <circle cx="0" cy="16" r="2" fill="#0C716B"/>
      <circle cx="-16" cy="0" r="2" fill="#0C716B"/>
      <circle cx="16" cy="0" r="2" fill="#0C716B"/>
      <circle cx="0" cy="0" r="3" fill="#0C716B"/>
    </g>
  </g>
  <text x="408" y="400" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#09544F">AI Assistant</text>
  <text x="510" y="350" text-anchor="start" font-family="Inter, sans-serif" font-size="9" fill="#7f8c8d" font-style="italic">Helps analyze &amp; explain your data</text>

</svg>
