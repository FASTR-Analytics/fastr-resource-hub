<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#ffffff"/>

  <!-- Instance container -->
  <rect x="40" y="50" width="520" height="300" rx="12" fill="#F8F9FA" stroke="#0C716B" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Instance label -->
  <rect x="40" y="50" width="140" height="28" rx="4" fill="#0C716B"/>
  <text x="110" y="69" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Country Instance</text>

  <!-- Project 1 - Q4 Analysis -->
  <g transform="translate(70, 100)">
    <rect width="140" height="100" rx="8" fill="#ffffff" stroke="#1F9A9C" stroke-width="2" filter="url(#shadow)"/>
    <rect width="140" height="24" rx="8" fill="#1F9A9C"/>
    <rect x="0" y="16" width="140" height="8" fill="#1F9A9C"/>
    <text x="70" y="16" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#ffffff">Q4 2025 Analysis</text>
    <!-- Folder icon -->
    <g transform="translate(70, 62)" fill="none" stroke="#0C716B" stroke-width="1.5">
      <path d="M -18 -12 L -18 12 L 18 12 L 18 -6 L 6 -6 L 3 -12 Z"/>
    </g>
    <text x="70" y="88" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#7f8c8d">Main analysis</text>
  </g>

  <!-- Project 2 - Demo -->
  <g transform="translate(230, 100)">
    <rect width="140" height="100" rx="8" fill="#ffffff" stroke="#CAE6E9" stroke-width="2" filter="url(#shadow)"/>
    <rect width="140" height="24" rx="8" fill="#CAE6E9"/>
    <rect x="0" y="16" width="140" height="8" fill="#CAE6E9"/>
    <text x="70" y="16" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">Demo Project</text>
    <!-- Play icon -->
    <g transform="translate(70, 62)" fill="none" stroke="#0C716B" stroke-width="1.5">
      <circle cx="0" cy="0" r="14"/>
      <polygon points="-4,-8 -4,8 8,0" fill="#0C716B"/>
    </g>
    <text x="70" y="88" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#7f8c8d">Training sandbox</text>
  </g>

  <!-- Project 3 - RMNCAH Team -->
  <g transform="translate(390, 100)">
    <rect width="140" height="100" rx="8" fill="#ffffff" stroke="#1F9A9C" stroke-width="2" filter="url(#shadow)"/>
    <rect width="140" height="24" rx="8" fill="#1F9A9C"/>
    <rect x="0" y="16" width="140" height="8" fill="#1F9A9C"/>
    <text x="70" y="16" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#ffffff">RMNCAH Team</text>
    <!-- People icon -->
    <g transform="translate(70, 62)" fill="none" stroke="#0C716B" stroke-width="1.5">
      <circle cx="0" cy="-6" r="5"/>
      <path d="M -8 10 C -8 4 -5 1 0 1 C 5 1 8 4 8 10"/>
      <circle cx="-12" cy="-4" r="4" opacity="0.5"/>
      <circle cx="12" cy="-4" r="4" opacity="0.5"/>
    </g>
    <text x="70" y="88" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#7f8c8d">Program team</text>
  </g>

  <!-- Project 4 - Archive -->
  <g transform="translate(150, 220)">
    <rect width="140" height="100" rx="8" fill="#ffffff" stroke="#CAE6E9" stroke-width="2" filter="url(#shadow)"/>
    <rect width="140" height="24" rx="8" fill="#CAE6E9"/>
    <rect x="0" y="16" width="140" height="8" fill="#CAE6E9"/>
    <text x="70" y="16" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">Q3 2025 Archive</text>
    <!-- Archive icon -->
    <g transform="translate(70, 62)" fill="none" stroke="#0C716B" stroke-width="1.5">
      <rect x="-14" y="-10" width="28" height="20" rx="2"/>
      <line x1="-14" y1="-4" x2="14" y2="-4"/>
      <line x1="-4" y1="2" x2="4" y2="2"/>
    </g>
    <text x="70" y="88" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#7f8c8d">Previous version</text>
  </g>

  <!-- Roles section -->
  <g transform="translate(600, 80)">
    <text x="80" y="0" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#09544F">User Roles</text>

    <!-- Admin -->
    <g transform="translate(0, 30)">
      <circle cx="20" cy="12" r="16" fill="#E8F4F3"/>
      <g transform="translate(20, 12)" fill="none" stroke="#0C716B" stroke-width="1.5">
        <circle cx="0" cy="-4" r="5"/>
        <path d="M -7 10 C -7 4 -4 1 0 1 C 4 1 7 4 7 10"/>
        <path d="M 6 -8 L 10 -8 L 10 -4" stroke-width="2"/>
      </g>
      <text x="50" y="10" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#09544F">Admin</text>
      <text x="50" y="24" font-family="Inter, sans-serif" font-size="9" fill="#7f8c8d">Full access</text>
    </g>

    <!-- Editor -->
    <g transform="translate(0, 100)">
      <circle cx="20" cy="12" r="16" fill="#E8F4F3"/>
      <g transform="translate(20, 12)" fill="none" stroke="#0C716B" stroke-width="1.5">
        <path d="M -6 8 L 8 -6 M 5 -9 L 11 -3 M -9 8 L -3 8 L -3 2"/>
      </g>
      <text x="50" y="10" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#09544F">Editor</text>
      <text x="50" y="24" font-family="Inter, sans-serif" font-size="9" fill="#7f8c8d">Create & modify</text>
    </g>

    <!-- Viewer -->
    <g transform="translate(0, 170)">
      <circle cx="20" cy="12" r="16" fill="#E8F4F3"/>
      <g transform="translate(20, 12)" fill="none" stroke="#0C716B" stroke-width="1.5">
        <circle cx="0" cy="0" r="7"/>
        <circle cx="0" cy="0" r="2" fill="#0C716B"/>
        <line x1="5" y1="5" x2="10" y2="10"/>
      </g>
      <text x="50" y="10" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#09544F">Viewer</text>
      <text x="50" y="24" font-family="Inter, sans-serif" font-size="9" fill="#7f8c8d">Read only</text>
    </g>
  </g>

  <!-- Connector lines from roles to instance -->
  <path d="M 580 130 Q 570 130 560 140" fill="none" stroke="#CAE6E9" stroke-width="1.5" stroke-dasharray="4,2"/>
  <path d="M 580 200 Q 565 200 560 200" fill="none" stroke="#CAE6E9" stroke-width="1.5" stroke-dasharray="4,2"/>
  <path d="M 580 270 Q 570 270 560 260" fill="none" stroke="#CAE6E9" stroke-width="1.5" stroke-dasharray="4,2"/>

</svg>
