<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650">
  <!-- Background -->
  <rect width="1200" height="650" fill="white"/>

  <!-- Left dark teal box -->
  <rect x="80" y="80" width="200" height="490" fill="#09544F" rx="4"/>

  <!-- Icon - document with chart and magnifying glass -->
  <g transform="translate(130, 120)" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Document outline -->
    <rect x="0" y="0" width="60" height="75" rx="4" fill="none"/>
    <!-- Document fold -->
    <path d="M42 0 L42 15 L60 15" fill="none"/>
    <!-- Chart bars inside document -->
    <path d="M12 55 L12 45" stroke-width="6" stroke-linecap="round"/>
    <path d="M26 55 L26 35" stroke-width="6" stroke-linecap="round"/>
    <path d="M40 55 L40 42" stroke-width="6" stroke-linecap="round"/>
    <!-- Lines representing text -->
    <path d="M12 25 L40 25" stroke-width="2"/>
    <!-- Magnifying glass -->
    <circle cx="70" cy="65" r="18" stroke-width="3"/>
    <path d="M83 78 L95 90" stroke-width="4"/>
  </g>

  <!-- Text in left box -->
  <text x="180" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="white">HEALTH</text>
  <text x="180" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="white">RESOURCE</text>
  <text x="180" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="white">TRACKING</text>
  <text x="180" y="405" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="white">DATA</text>

  <!-- Arrow 1 - centered to box 1 -->
  <g transform="translate(300, 150)">
    <path d="M0 0 L50 0" stroke="#1F9A9C" stroke-width="4" fill="none"/>
    <polygon points="55,0 45,-7 45,7" fill="#1F9A9C"/>
  </g>

  <!-- Arrow 2 - centered to box 2 -->
  <g transform="translate(300, 325)">
    <path d="M0 0 L50 0" stroke="#1F9A9C" stroke-width="4" fill="none"/>
    <polygon points="55,0 45,-7 45,7" fill="#1F9A9C"/>
  </g>

  <!-- Arrow 3 - centered to box 3 -->
  <g transform="translate(300, 505)">
    <path d="M0 0 L50 0" stroke="#1F9A9C" stroke-width="4" fill="none"/>
    <polygon points="55,0 45,-7 45,7" fill="#1F9A9C"/>
  </g>

  <!-- Box 1: Prioritization -->
  <rect x="370" y="80" width="750" height="145" rx="12" fill="#d9f0ef"/>
  <text x="400" y="115" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#333">Prioritization, mobilization and alignment</text>
  <circle cx="400" cy="145" r="3" fill="#333"/>
  <text x="415" y="150" font-family="system-ui, sans-serif" font-size="14" fill="#333">Are resources aligned to national priorities?</text>
  <circle cx="400" cy="173" r="3" fill="#333"/>
  <text x="415" y="178" font-family="system-ui, sans-serif" font-size="14" fill="#333">Is there adequate funding available to implement the activities in the</text>
  <text x="415" y="194" font-family="system-ui, sans-serif" font-size="14" fill="#333">annual plan?</text>
  <circle cx="400" cy="213" r="3" fill="#333"/>
  <text x="415" y="218" font-family="system-ui, sans-serif" font-size="14" fill="#333">If not, how large is the overall financing gap?</text>

  <!-- Box 2: Efficiency -->
  <rect x="370" y="245" width="750" height="160" rx="12" fill="#d9f0ef"/>
  <text x="400" y="280" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#333">Efficiency and equity</text>
  <circle cx="400" cy="310" r="3" fill="#333"/>
  <text x="415" y="315" font-family="system-ui, sans-serif" font-size="14" fill="#333">Are resources equitably and efficiently allocated to national priorities and</text>
  <text x="415" y="333" font-family="system-ui, sans-serif" font-size="14" fill="#333">for priority populations?</text>
  <circle cx="400" cy="358" r="3" fill="#333"/>
  <text x="415" y="363" font-family="system-ui, sans-serif" font-size="14" fill="#333">How does funding compare across interventions, regions, cost categories,</text>
  <text x="415" y="381" font-family="system-ui, sans-serif" font-size="14" fill="#333">years, levels of care?</text>

  <!-- Box 3: Transparency -->
  <rect x="370" y="425" width="750" height="160" rx="12" fill="#d9f0ef"/>
  <text x="400" y="460" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#333">Transparency and accountability</text>
  <circle cx="400" cy="490" r="3" fill="#333"/>
  <text x="415" y="495" font-family="system-ui, sans-serif" font-size="14" fill="#333">Who is financing and implementing what activities in the health sector, where,</text>
  <text x="415" y="513" font-family="system-ui, sans-serif" font-size="14" fill="#333">when, and with how much funding?</text>
  <circle cx="400" cy="538" r="3" fill="#333"/>
  <text x="415" y="543" font-family="system-ui, sans-serif" font-size="14" fill="#333">Were the activities and resources committed spent?</text>

</svg>
