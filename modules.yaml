modules:
- id: m0
  number: '0'
  folder: m0_introduction
  session: intro
  name:
    en: Introduction to FASTR
    fr: Introduction à FASTR
    pt: Introdução ao FASTR
  ai_context:
    description: Overview of the FASTR methodology, why rapid-cycle analytics matters
      for RMNCAH-N programs.
    topics:
    - Introduction to FASTR approach
    - RMNCAH-N service use monitoring
    - Why rapid-cycle analytics
    duration: 45-60 min
- id: m1
  number: '1'
  folder: m1_identify_questions_indicators
  session: questions
  name:
    en: Identify Questions & Indicators
    fr: Identifier les questions et indicateurs
    pt: Identificar questões e indicadores
  ai_context:
    description: How to identify priority analytical questions, develop data use cases,
      and prepare indicator frameworks.
    topics:
    - FASTR gaps and challenges
    - Development of data use case
    - Defining priority questions
    duration: 60-90 min
- id: m2
  number: '2'
  folder: m2_data_extraction
  session: extraction
  name:
    en: Data Extraction
    fr: Extraction des données
    pt: Extração de dados
  ai_context:
    description: Technical module on extracting data from DHIS2 and other health information
      systems.
    topics:
    - Why extract data
    - DHIS2 data structure
    - Data Downloader tool
    - API-based extraction
    duration: 90-120 min
- id: m3
  number: '3'
  folder: m3_fastr_analytics_platform
  session: platform
  name:
    en: FASTR Analytics Platform
    fr: Plateforme analytique FASTR
    pt: Plataforma analítica FASTR
  ai_context:
    description: Hands-on introduction to the FASTR Analytics Platform.
    topics:
    - Platform overview
    - Accessing the platform
    - Importing datasets
    - Running analysis modules
    duration: 120-180 min
- id: m3b
  number: 3b
  folder: mai_ai_assistant
  session: ai
  name:
    en: AI Assistant
    fr: Assistant IA
    pt: Assistente IA
  ai_context:
    description: How the FASTR AI Assistant works, what it can and can't do, and how to
      get useful answers from it.
    topics:
    - What the AI Assistant does
    - Asking good questions
    - Iterative conversations
    - Private vs shared spaces
    duration: 60-90 min
- id: m4
  number: '4'
  folder: m4_data_quality_assessment
  session: methods
  name:
    en: Data Quality Assessment
    fr: Évaluation de la qualité des données
    pt: Avaliação da qualidade dos dados
  ai_context:
    description: 'Systematic approach to assessing data quality: completeness, outliers,
      internal consistency.'
    topics:
    - Approach to DQA
    - Indicator completeness
    - Outlier detection
    - Internal consistency checks
    duration: 90-120 min
- id: m5
  number: '5'
  folder: m5_data_quality_adjustment
  session: methods
  name:
    en: Data Quality Adjustment
    fr: Ajustement de la qualité des données
    pt: Ajustamento da qualidade dos dados
  ai_context:
    description: Methods for adjusting data to account for quality issues before analysis.
    topics:
    - Approach to adjustment
    - Adjustment for outliers
    - Adjustment for completeness
    duration: 60-90 min
- id: m6
  number: '6'
  folder: m6_data_analysis
  session: methods
  name:
    en: Data Analysis
    fr: Analyse des données
    pt: Análise de dados
  ai_context:
    description: 'Core analytical methods: service utilization trends, coverage estimation.'
    topics:
    - Service utilization analysis
    - Year-over-year change
    - Coverage introduction
    - Interpreting outputs
    duration: 180-240 min
- id: m7a
  number: 7a
  folder: m7a_analytical_thinking
  session: communication
  name:
    en: Analytical thinking & interpretation
    fr: Pensée analytique et interprétation
    pt: Pensamento analítico e interpretação
  ai_context:
    description: How to interpret FASTR outputs critically — reading charts, checking
      against context, avoiding common pitfalls.
    topics:
    - Critical thinking checklist
    - Common interpretation pitfalls
    - Interpreting FASTR module outputs
    duration: 30-45 min
- id: m7b
  number: 7b
  folder: m7b_data_visualization
  session: communication
  name:
    en: Data visualization & communication
    fr: Visualisation et communication des données
    pt: Visualização e comunicação de dados
  ai_context:
    description: Principles for visualizing FASTR results — chart types, what to highlight,
      what to leave out.
    topics:
    - Chart types
    - Highlighting findings
    - Visual hierarchy
    duration: 30-45 min
- id: m7c
  number: 7c
  folder: m7c_understanding_audience
  session: communication
  name:
    en: Understanding your audience
    fr: Comprendre votre public
    pt: Compreender o público
  ai_context:
    description: User mapping — knowing who reads the report, what they need, and how
      they make decisions.
    topics:
    - User mapping
    - Audience needs
    duration: 20-30 min
- id: m7d
  number: 7d
  folder: m7d_storytelling_with_data
  session: communication
  name:
    en: Storytelling with data
    fr: Raconter une histoire avec les données
    pt: Contar uma história com dados
  ai_context:
    description: Turning findings into a narrative — finding statements, examples, structure.
    topics:
    - Finding statements
    - Data-to-story example
    duration: 30-45 min
- id: m7e
  number: 7e
  folder: m7e_linking_to_actions
  session: action
  name:
    en: Linking results to actions
    fr: Lier les résultats aux actions
    pt: Ligar resultados a ações
  ai_context:
    description: From finding to action — three spheres of influence, six questions, dissemination
      roadmap.
    topics:
    - Three spheres of influence
    - Six questions to turn results into actions
    - Dissemination and data use roadmap
    duration: 45-60 min
- id: m7f
  number: 7f
  folder: m7f_sustained_use_roadmap
  session: action
  name:
    en: Roadmap for sustained use
    fr: Feuille de route pour un usage durable
    pt: Roteiro para uso sustentado
  ai_context:
    description: Building a country action plan and peer-reviewing it for sustained use
      of FASTR.
    topics:
    - Building a roadmap
    - Peer review of action plans
    duration: 30-45 min
- id: m8
  number: '8'
  folder: m8_survey_hfa
  session: hfa
  name:
    en: Survey & HFA
    fr: Enquêtes et EFS
    pt: Inquérito e EES
  ai_context:
    description: Integration of survey data and health facility assessments with routine
      data.
    topics:
    - Survey data integration
    - Health facility assessments
    - Triangulating data sources
    duration: 60-90 min
- id: m9a
  number: 9a
  folder: m9a_instance_setup
  session: setup
  name:
    en: Instance Setup
    fr: Configuration de l'instance
    pt: Configuração da instância
  ai_context:
    description: Admin-track hands-on activities for setting up a FASTR platform instance
      (admin areas, importing data, installing & running modules, creating a project).
    topics:
    - Setting up admin areas
    - Importing data
    - Installing and running modules
    - Creating a project
    duration: 60-90 min
- id: m9b
  number: 9b
  folder: m9b_getting_started
  session: platform
  name:
    en: Getting Started
    fr: Prise en main
    pt: Primeiros passos
  ai_context:
    description: First-login orientation activity — sign into the platform and create
      a personal folder for the rest of the workshop.
    topics:
    - Logging in
    - Creating a personal folder
    duration: 15-20 min
- id: m9c
  number: 9c
  folder: m9c_visualizations_interpretation
  session: viz
  name:
    en: Visualizations & Interpretation
    fr: Visualisations & Interprétation
    pt: Visualizações e interpretação
  ai_context:
    description: Hands-on visualization activities — build charts manually and with the
      AI Assistant, write interpretations, spot disruptions.
    topics:
    - Create a visualization manually
    - Build a visualization with AI
    - Read a FASTR visualization
    - Write an interpretation
    - Spot a disruption
    duration: 90-120 min
- id: m9d
  number: 9d
  folder: m9d_slide_decks
  session: decks
  name:
    en: Slide Decks
    fr: Présentations
    pt: Apresentações
  ai_context:
    description: Hands-on slide-deck activities — create a deck, add visualizations
      (manually and via AI), edit and format slides, configure report settings.
    topics:
    - Create a slide deck
    - Add a visualization to a slide
    - Edit and finalize slides
    - Format report text
    - Configure report settings
    duration: 90-120 min
- id: m9e
  number: 9e
  folder: m9e_disruption_report
  session: reports
  name:
    en: Disruption Report
    fr: Rapport de perturbations
    pt: Relatório de perturbações
  ai_context:
    description: End-to-end activity — create a disruption report with the AI Assistant
      (Prompt 1), verify with Prompt 5 + team review, refine with Prompt 2/3, peer review.
    topics:
    - Create the report with the AI
    - Verify (two-pass — AI + team)
    - Writing analytical slide titles
    - Refine with Prompt 2 / Prompt 3
    - Peer review and present
    duration: 180-240 min
- id: m9f
  number: 9f
  folder: m9f_prompting_techniques
  session: prompting
  name:
    en: Prompting Techniques
    fr: Techniques de prompting
    pt: Técnicas de prompting
  ai_context:
    description: Hands-on prompting practice — building clear prompts, exploring with the
      AI Assistant, iterative vs single-prompt, using a previous report as a template,
      verifying AI output.
    topics:
    - Build a clear prompt
    - Explore with the AI Assistant
    - Iterative vs single-prompt
    - Refine a prompt
    - Use a PDF as template
    - Verify the output
    duration: 90-120 min
- id: m9g
  number: 9g
  folder: m9g_fastr_quiz
  session: tools
  name:
    en: FASTR Quiz
    fr: Quiz FASTR
    pt: Quiz FASTR
  ai_context:
    description: Team-based quiz activity to consolidate FASTR concepts at the end of a
      workshop. Five questions, team answer sheet.
    topics:
    - Team answer sheet
    duration: 30-45 min
# Webinar content lives on disk (core_content/mw_webinar/) but the webinar
