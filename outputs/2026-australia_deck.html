<h2 id="introduction-to-fastr">Introduction to FASTR</h2>
<div class="columns">
<div>
<p>The Global Financing Facility (GFF) supports country-led efforts to strengthen the use of timely data for decision-making, with the goal of improving primary healthcare (PHC) performance and RMNCAH-N outcomes.</p>
<p><strong>Frequent Assessments and Health System Tools for Resilience (FASTR)</strong> is the GFF's rapid-cycle analytics framework for monitoring health system performance using high-frequency data.</p>
<p>FASTR brings together four complementary technical approaches:</p>
<ol>
<li>Routine HMIS data analysis</li>
<li>Health facility phone surveys</li>
<li>High-frequency household phone surveys</li>
<li>Follow-on, problem-driven analyses</li>
</ol>
</div>
<div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-scope-41hwkKaW="" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="6" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="rmncah-n-service-use-monitoring">RMNCAH-N service use monitoring</h2>
<div class="split">
<div class="text">
<p>Rapid-cycle approaches using routine HMIS data can:</p>
<ul>
<li><strong>Evaluate HMIS data quality</strong> at national and sub-national levels</li>
<li><strong>Measure monthly changes</strong> in health service utilization</li>
<li><strong>Compare coverage trends</strong> with country targets</li>
</ul>
</div>
<div class="image">
<p><img src="../resources/diagrams/HMIS_data_flow.svg" alt="HMIS data flow" /></p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="7" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="why-rapid-cycle-analytics">Why rapid-cycle analytics?</h2>
<div class="columns">
<div>
<p>Routine health information systems are a critical source of data, but they are often underused due to concerns about data quality and long delays between data collection and analysis. Traditional household and facility surveys, while essential, are resource-intensive and infrequent.</p>
<p>FASTR's rapid-cycle analytics address this gap by providing:</p>
<ul>
<li>Timely insights aligned with country decision cycles</li>
<li>Continuous learning rather than one-off assessments</li>
<li>Direct feedback loops between data, analysis, and action</li>
</ul>
</div>
<div>
<p><img src="../resources/diagrams/GFF-Rapid-Cycle-Analytics-Data-Use_Figure-1.svg" alt="FASTR rapid-cycle analytics framework" /></p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="8" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="focus-of-the-analysis">Focus of the analysis</h2>
<div class="columns">
<div>
<h3 id="core-indicators">Core indicators</h3>
<p>FASTR prioritizes a core set of RMNCAH-N indicators that:</p>
<ul>
<li>Represent key service delivery contacts across the continuum of care</li>
<li>Have relatively high reporting completeness and volumes</li>
<li>Serve as proxies for broader service delivery performance</li>
</ul>
<p><small><em>The indicator set can be expanded to reflect country-specific priorities.</em></small></p>
</div>
<div>
<h3 id="core-data-quality-metrics">Core data quality metrics</h3>
<p>Analysis is anchored in a standardized set of data quality metrics:</p>
<ul>
<li>Reporting completeness</li>
<li>Extreme value (outlier) detection</li>
<li>Consistency across related indicators</li>
</ul>
<p><small><em>These metrics are summarized into an overall data quality score.</em></small></p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="9" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="introduction-to-fastr-gaps-and-challenges">Introduction to FASTR: gaps and challenges</h2>
<p><em>Content to be developed</em></p>
<p>This section will cover:</p>
<ul>
<li>Identifying gaps and challenges that FASTR is well suited to support</li>
<li>How FASTR serves as an entry point to reduce fragmentation</li>
<li>Starting the conversation with government stakeholders</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="10" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="development-of-a-data-use-case">Development of a data use case</h2>
<p><em>Content to be developed</em></p>
<p>This section will cover:</p>
<ul>
<li>Co-creation workshop approach with MoH and stakeholders</li>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="11" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="what-makes-a-good-indicator-for-fastr-analysis">What makes a good indicator for FASTR analysis?</h2>
<ul>
<li><strong>Relevance</strong>: Does this indicator align with our priority questions and objectives?</li>
<li><strong>Volume</strong>: Is this indicator collected at a high volume, improving robustness of analysis?</li>
<li><strong>Completeness</strong>: Does the indicator have a high completeness rate across reporting facilities?</li>
<li><strong>Frequency</strong>: Is the indicator reported frequently enough (e.g., monthly) to support rapid-cycle analysis?</li>
<li><strong>Type</strong>: Is this indicator a count of services delivered?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="12" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="preparing-for-data-extraction">Preparing for data extraction</h2>
<p><em>Content to be developed</em></p>
<p>This section will cover:</p>
<ul>
<li>Pre-extraction checklist</li>
<li>Understanding your DHIS2 configuration</li>
<li>Mapping indicators to data elements</li>
<li>Planning your extraction timeline</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="13" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="why-extract-data-from-dhis2">Why extract data from DHIS2?</h2>
<h3 id="data-quality-adjustment">Data quality adjustment</h3>
<p>The FASTR approach focuses on data quality adjustments to expand the analyses countries can do with DHIS2 data and to generate more robust estimates.</p>
<p>The FASTR methodology includes specific approaches to:</p>
<ul>
<li>Identify and adjust for outliers</li>
<li>Adjust for incomplete reporting</li>
<li>Apply consistent data quality metrics</li>
</ul>
<p>These adjustments require processing that cannot be done within DHIS2's native analytics.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="14" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="why-extract-data-from-dhis2-1">Why extract data from DHIS2?</h2>
<h3 id="analysis-complexity">Analysis complexity</h3>
<p>The FASTR approach uses more advanced statistical methods, such as regression analysis, which are not available in DHIS2. While DHIS2 can plot trends over time using raw data, FASTR can go further by:</p>
<ul>
<li>Identifying significant increases or decreases in service volume</li>
<li>Adjusting for data quality issues</li>
<li>Accounting for expected seasonal variations</li>
<li>Comparing key periods, such as before and after a reform</li>
</ul>
<p>The choice between DHIS2 and the FASTR approach should be guided by the specific purpose of your analysis.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="15" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="data-format-and-granularity">Data format and granularity</h2>
<p>Data should be downloaded for each <strong>indicator of interest</strong>, at <strong>facility level</strong>, and <strong>monthly</strong> for the <strong>period of interest</strong>.</p>
<ul>
<li>Data should be saved in <strong>long format</strong> meaning each row represents a single observation or measurement</li>
<li>Data should be saved in <strong>.csv format</strong> and can be saved in either a single .csv file or multiple .csv files</li>
</ul>
<h3 id="why-monthly-facility-level-data">Why monthly facility level data?</h3>
<p>We want to use the most granular data we have access to in order to make more fine tuned assessments for data quality. Using monthly facility level data allows us to conduct the most robust analysis.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="16" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="key-variables">Key variables</h2>
<p>The data extracted should include the following required elements:</p>
<table>
<thead>
<tr>
<th>Element</th>
<th>Description</th>
</tr>
</thead>
<tbody>
<tr>
<td>Org units</td>
<td>Organizational unit identifier</td>
</tr>
<tr>
<td>Period</td>
<td>Time period of the data</td>
</tr>
<tr>
<td>Indicator name</td>
<td>Name of the indicator</td>
</tr>
<tr>
<td>Total/count</td>
<td>The aggregated value</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="17" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="how-much-data">How much data?</h2>
<h3 id="initial-fastr-analysis">Initial FASTR analysis</h3>
<ul>
<li>Download approximately <strong>five years</strong> of historical data</li>
<li>Exact period depends on data availability and consistency in indicator definitions</li>
</ul>
<h3 id="routine-update-to-fastr-analysis">Routine update to FASTR analysis</h3>
<ul>
<li>Download new data covering the most recent months not previously included (usually <strong>three months</strong> for quarterly implementation)</li>
<li>Include the <strong>three preceding months</strong> as recent data is often subject to changes due to late reporting or data quality adjustments</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="18" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="data-extraction-tools">Data extraction tools</h2>
<p>We offer two tools for bulk DHIS2 data extraction:</p>
<p><strong>API Script</strong> (Google Colab)</p>
<ul>
<li>Input login credentials, specify timeframes, indicators, and administrative levels</li>
<li>Download data as a .csv file</li>
</ul>
<p><strong>Data Downloader</strong></p>
<ul>
<li>More intuitive, streamlined interface</li>
<li>Recommended for most users</li>
</ul>
<p>Both tools enable efficient data extraction, and we provide training resources to support their use.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="19" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">

<h2 id="introduction-to-the-fastr-analytics-platform">Introduction to the FASTR Analytics Platform</h2>
<p>The FASTR analytics platform is a web-based tool for data quality assessment, adjustment, and analysis of routine health data.</p>
<p><strong>Key features:</strong></p>
<ul>
<li>Upload and analyze data from DHIS2 and other sources</li>
<li>Built-in statistical methods for data quality adjustment</li>
<li>User-friendly interface for running analyses</li>
<li>Flexible visualization and export options</li>
</ul>
<p><strong>In this session, we will provide a conceptual walkthrough of the platform and its capabilities.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="29" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="live-demo-platform-access--roles">Live Demo: Platform Access &amp; Roles</h2>
<p><img src="../resources/icons/demo.svg" alt="demo" style="height:40px;" /> <strong>In this demo, we will:</strong></p>
<ul>
<li>Navigate to the FASTR platform</li>
<li>Explore user roles: Administrator, Editor, Viewer</li>
<li>Review user management and permissions</li>
<li>Understand the workflow for uploading data and making analytical decisions</li>
</ul>
<p><em>Facilitator will demonstrate in the live platform</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="30" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="activity-setting-up-admin-areas">Activity: Setting Up Admin Areas</h2>
<p><img src="../resources/icons/hands_on.svg" alt="hands-on" style="height:40px;" /> <strong>In this hands-on session, we will configure:</strong></p>
<ul>
<li>Admin areas (regions, districts)</li>
<li>Facility structure</li>
<li>Indicator definitions</li>

<h2 id="data-quality-assessment---module-1">Data quality assessment - Module 1</h2>
<p>Evaluating the reliability of routine health information system data</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="38" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="rationale-for-data-quality-assessment">Rationale for data quality assessment</h2>
<p><strong>Challenge:</strong> Routine health facility data may contain quality limitations:</p>
<ul>
<li>Reported values may fall outside plausible ranges</li>
<li>Reporting gaps affect data completeness</li>
<li>Inconsistencies exist between related indicators</li>
</ul>
<p><strong>Implications:</strong> Data quality limitations affect decision-making</p>
<ul>
<li>Inaccurate assessments of service delivery trends</li>
<li>Misidentification of areas requiring intervention</li>
<li>Suboptimal resource allocation</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="39" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="objectives-of-data-quality-assessment">Objectives of data quality assessment</h2>
<p><strong>Objective 1: Enable analytical adjustment</strong></p>
<p>Systematic data quality assessment supports the application of targeted adjustments, enhancing the utility of HMIS data for evidence-based decision-making.</p>
<p><strong>Objective 2: Monitor data quality trends</strong></p>
<p>Data quality assessment enables ongoing monitoring to:</p>
<ul>
<li>Inform indicator selection based on quality profiles across the HMIS</li>
<li>Guide targeted data quality interventions and supportive supervision in areas with weaker data quality</li>
<li>Evaluate the effectiveness of data quality improvement initiatives over time</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="40" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="core-dimensions-of-data-quality">Core dimensions of data quality</h2>
<p><strong>1. Completeness</strong><br />
Are health facilities submitting reports consistently?</p>
<p><strong>2. Outlier prevalence</strong><br />
Are reported values within plausible ranges?</p>
<p><strong>3. Internal consistency</strong><br />
Do related indicators demonstrate expected relationships?</p>
<p>These three dimensions provide a comprehensive assessment of data reliability for analytical purposes.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="41" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="indicator-completeness">Indicator completeness</h2>
<div style="display: flex; gap: 1.5em; align-items: flex-start;">
<div style="flex: 1;">
<p><strong>What it measures:</strong> The extent to which facilities report data on selected core indicators</p>
<p><strong>Why it matters:</strong></p>
<ul>
<li>Higher completeness improves data reliability</li>
<li>Stability over time strengthens trend analysis</li>
</ul>
<p><strong>Key distinction:</strong><br />
Indicator completeness ≠ reporting completeness. This metric examines specific data elements, not just whether the monthly form was submitted.</p>
</div>
<div style="flex: 2;">
<p><img src="../resources/diagrams/completeness_illustration.svg" alt="Completeness Illustration" /></p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="42" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="definition-of-indicator-completeness">Definition of indicator completeness</h2>
<p>For the FASTR analysis, completeness is defined as:</p>
<p><strong>The percentage of reporting facilities each month out of the total number of facilities expected to report.</strong></p>
<ul>
<li>A facility is deemed to be &quot;reporting&quot; if there is a non-missing, non-zero value recorded for the indicator and month</li>
<li>A facility is expected to report if it has reported any volume for that indicator anytime within a year</li>
<li>Facilities that do not report for six or more consecutive months at the beginning or end of their reporting period are classified as <strong>inactive</strong> rather than incomplete. This prevents penalizing facilities that have not yet begun reporting or have permanently ceased operations</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="43" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="notes-on-completeness">Notes on completeness</h2>
<ul>
<li>
<p>A high level of completeness does not necessarily indicate that the HMIS is representative of all service delivery in the country as some services may not be delivered in facilities, or some facilities may not report</p>
</li>
<li>
<p>For countries where the DHIS2 system does not store 0's, indicator completeness may be underestimated if there are many low-volume facilities for a given indicator</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="44" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="completeness-percent-of-monthly-values-that-are-complete">Completeness: Percent of monthly values that are complete</h2>
<p style="font-size: 0.9em; margin-bottom: 0.5rem;">For a given indicator in a given time period, the percent of monthly values that are complete:</p>
<p style="font-size: 0.9em;"><strong>% complete = # monthly values that are complete / total N of monthly values</strong></p>
<p><img src="../resources/default_outputs/Default_2._Proportion_of_completed_records.png" alt="Indicator Completeness" style="height:340px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="45" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="outliers">Outliers</h2>
<p>The presence of outliers examines whether a data point in a series of values is extreme (either abnormally high or low) in relation to others in the series.</p>
<p>Outliers can be the result of changes in programmatic activities (such as an intensified campaign) or can be data quality problems.</p>
<p>For the FASTR analysis, we identify outliers which are suspiciously high values compared to the usual volume of services reported by the facility (e.g., low values are not identified as outliers in the FASTR analysis).</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="46" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="outlier-illustration">Outlier illustration</h2>
<p>Region A displays an anomalous spike in February that substantially exceeds values reported by other regions — indicative of a data entry error or reporting issue.</p>
<p><img src="../resources/diagrams/outlier_impact.svg" alt="Outlier Impact" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="47" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="outlier-detection-methodology">Outlier detection methodology</h2>
<p>Outliers are identified by assessing the within-facility variation in monthly reporting for each indicator.</p>
<p>An outlier is defined as:</p>
<p>A value greater than <strong>10 times the median absolute deviation (MAD)</strong> from the monthly median value for the indicator in each time period, <strong>OR</strong> a value for which the proportional contribution in volume for a facility, indicator, and time period is <strong>greater than 80%</strong></p>
<p><strong>AND</strong> for which:</p>
<ul>
<li>The volume is <strong>greater than or equal to the median</strong></li>
<li>The volume is <strong>not missing</strong></li>
<li>The volume is <strong>greater than 100</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="48" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="outliers-percent-of-monthly-values-that-are-outliers">Outliers: Percent of monthly values that are outliers</h2>
<p>For a given indicator in a given time period, the percent of monthly values that are outliers:</p>
<p><strong>% outliers = # monthly values that are outliers / total N of monthly values</strong></p>
<p><img src="../resources/default_outputs/Default_1._Proportion_of_outliers.png" alt="Outliers" style="height:340px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="49" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="consistency-between-related-indicators">Consistency between related indicators</h2>
<p>Program indicators with a predictable relationship are examined to determine whether the expected relationship exists between them. In other words, this process examines whether the observed relationship between the indicators, as shown in the reported data, is that which is expected.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="50" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="indicator-pairs-assessed">Indicator pairs assessed</h2>
<div class="columns">
<div>
<table>
<thead>
<tr>
<th>Indicator pair</th>
<th>Expected relationship</th>
</tr>
</thead>
<tbody>
<tr>
<td>ANC1 / ANC4</td>
<td>Ratio should be ≥ 0.95</td>
</tr>
<tr>
<td>Penta1 / Penta3</td>
<td>Ratio should be ≥ 0.95</td>
</tr>
<tr>
<td>BCG / Facility delivery</td>
<td>Within 30% (≥0.7 and ≤1.3)</td>
</tr>
</tbody>
</table>
<p>These pairs have expected relationships. We expect ANC1 &gt; ANC4 since not all women complete four visits.</p>
<p>BCG is a birth dose vaccine so we expect similar numbers to facility deliveries, with a 30% tolerance for variability.</p>
</div>
<div>
<p><img src="../resources/diagrams/consistency_illustration.svg" alt="Consistency illustration" style="height:280px;" /></p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="51" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="why-assess-consistency-at-district-level">Why assess consistency at district level?</h2>
<div style="display: flex; gap: 1.5em; align-items: flex-start;">
<div style="flex: 1;">
<p>Patients often access different services at different facilities within a district:</p>
<ul>
<li>A woman may attend <strong>ANC1</strong> at a nearby health post, but travel to a health centre for <strong>ANC4</strong></li>
<li>A child may receive <strong>Penta1</strong> at a local clinic, but complete <strong>Penta3</strong> at a district hospital</li>
</ul>
<p>Checking consistency at the facility level would miss these patterns. Aggregating to district level captures the complete picture of service utilization within a geographic area.</p>
</div>
<div style="flex: 2;">
<p><img src="../resources/diagrams/district_consistency.svg" alt="District consistency" /></p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="52" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="internal-consistency-fastr-output">Internal consistency: FASTR output</h2>
<p><img src="../resources/default_outputs/Default_4._Proportion_of_sub-national_areas_meeting_consistency_criteria.png" alt="Internal Consistency" style="height:420px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="53" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="data-quality-summary-score">Data quality summary score</h2>
<p>A composite measure of data quality provides an overall view of how well a dataset meets quality standards.</p>
<p>By integrating multiple dimensions of data quality into a single score, it simplifies the interpretation of detailed information from several measures. This allows health systems to quickly assess the reliability of data, making it easier to identify trends and issues at a glance.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="54" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="definition-of-adequate-data-quality">Definition of adequate data quality</h2>
<p>For the FASTR analysis, we defined adequate data quality as:</p>
<ul>
<li>No missing indicator data for OPD, Penta1, and ANC1, where available, <strong>AND</strong></li>
<li>No outliers for OPD, Penta1, and ANC1, where available, <strong>AND</strong></li>
<li>Consistent reporting between Penta1/Penta3 and ANC1/ANC4</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="55" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="overall-dqa-score-percent-of-monthly-values-meeting-all-criteria">Overall DQA score: Percent of monthly values meeting all criteria</h2>
<p>For a given indicator in a given time period, the percent of monthly values meeting all DQA criteria:</p>
<p><strong>% adequate quality = # monthly values meeting all criteria / total N of monthly values</strong></p>
<p><img src="../resources/default_outputs/Default_5._Overall_DQA_score.png" alt="Overall DQA Score" style="height:340px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="56" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="mean-dqa-score-how-close-are-we-to-adequate-quality">Mean DQA score: How close are we to adequate quality?</h2>
<p>The mean DQA score shows how close a facility's data is to meeting all quality criteria. A score of <strong>100% means the data passes</strong> all DQA checks—no missing values, no outliers, and consistent reporting.</p>
<p><strong>Mean DQA = (completeness &amp; outlier score + consistency score) / 2</strong></p>
<p><img src="../resources/default_outputs/Default_6._Mean_DQA_score.png" alt="Mean DQA Score" style="height:320px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="57" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="data-quality-adjustment---module-2">Data quality adjustment - Module 2</h2>
<p>Correcting outliers and imputing missing values to improve data reliability</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="58" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="rationale-for-data-quality-adjustment">Rationale for data quality adjustment</h2>
<p>Routine HMIS data contain two common limitations that can distort analytical results:</p>
<table>
<thead>
<tr>
<th>Issue</th>
<th>Impact on analysis</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Outliers</strong></td>
<td>Extreme values create artificial spikes in service volumes</td>
</tr>
<tr>
<td><strong>Incomplete reporting</strong></td>
<td>Missing data creates artificial declines that do not reflect actual service delivery</td>
</tr>
</tbody>
</table>
<p>FASTR addresses these limitations by replacing problematic values with estimates derived from each facility's historical reporting patterns.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="59" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="adjustment-scenarios">Adjustment scenarios</h2>
<p>To support transparency and sensitivity analysis, FASTR produces four parallel datasets:</p>
<table>
<thead>
<tr>
<th>Scenario</th>
<th>Description</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Unadjusted</strong></td>
<td>Original reported values</td>
</tr>
<tr>
<td><strong>Outliers adjusted</strong></td>
<td>Extreme values replaced</td>
</tr>
<tr>
<td><strong>Completeness adjusted</strong></td>
<td>Missing values imputed</td>
</tr>
<tr>
<td><strong>Both adjusted</strong></td>
<td>All corrections applied</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="60" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="indicators-excluded-from-adjustment">Indicators excluded from adjustment</h2>
<p>Certain indicators are excluded from the adjustment process:</p>
<ul>
<li><strong>Mortality indicators</strong> (maternal deaths, neonatal deaths, under-5 deaths): These represent discrete events where smoothing or imputation is not appropriate</li>
<li><strong>Low-volume indicators</strong>: Indicators that never exceed 100 reported events in any month are excluded from adjustment</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="61" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="outlier-adjustment-methodology">Outlier adjustment methodology</h2>
<p>Outlier values are replaced using facility-specific historical data. The adjustment follows a hierarchical approach:</p>
<table>
<thead>
<tr>
<th>Priority</th>
<th>Method</th>
<th>Application</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>Centered 6-month average</td>
<td>3 months before + 3 months after the outlier</td>
</tr>
<tr>
<td>2</td>
<td>Forward 6-month average</td>
<td>When insufficient preceding data (e.g., start of series)</td>
</tr>
<tr>
<td>3</td>
<td>Backward 6-month average</td>
<td>When insufficient following data (e.g., end of series)</td>
</tr>
<tr>
<td>4</td>
<td>Same month, previous year</td>
<td>When rolling averages unavailable; useful for seasonal indicators</td>
</tr>
<tr>
<td>5</td>
<td>Facility historical mean</td>
<td>Mean of all valid values for this indicator at this facility</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="62" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="outlier-adjustment-fastr-output">Outlier adjustment: FASTR output</h2>
<p><img src="../resources/default_outputs/Default_1._Percent_change_in_volume_due_to_outlier_adjustment.png" alt="Percent change in volume due to outlier adjustment." style="height:380px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="63" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="completeness-adjustment-methodology">Completeness adjustment methodology</h2>
<p>For months identified as incomplete or missing, values are imputed using the same 6-month rolling average approach applied to outlier adjustment.</p>
<table>
<thead>
<tr>
<th>Priority</th>
<th>Method</th>
<th>Application</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>Centered 6-month average</td>
<td>When sufficient data exists before and after the gap</td>
</tr>
<tr>
<td>2</td>
<td>Forward 6-month average</td>
<td>For gaps at the start of the time series</td>
</tr>
<tr>
<td>3</td>
<td>Backward 6-month average</td>
<td>For gaps at the end of the time series</td>
</tr>
<tr>
<td>4</td>
<td>Facility historical mean</td>
<td>Mean of all valid values for this indicator at this facility</td>
</tr>
</tbody>
</table>
<p>This approach prevents temporary reporting gaps from creating artificial declines in service volumes.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="64" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="completeness-adjustment-fastr-output">Completeness adjustment: FASTR output</h2>
<p><img src="../resources/default_outputs/Default_2._Percent_change_in_volume_due_to_completeness_adjustment.png" alt="Percent change in volume due to completeness adjustment." style="height:380px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="65" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h1 id="see-you-tomorrow-1">See You Tomorrow!</h1>
<p><strong>Day 2 Complete</strong></p>
<p>We resume tomorrow at <strong>09:00</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="66" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h1 id="day-3">Day 3</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="67" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="service-utilization-analysis---module-3">Service utilization analysis - Module 3</h2>
<p>Detecting and quantifying changes in health service delivery over time</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="68" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="objectives">Objectives</h2>
<p><strong>1. Measure changes in service volume</strong></p>
<p>Year-over-year comparison of service volumes identifies increases or decreases across regions and indicators.</p>
<p><strong>2. Detect and quantify disruptions</strong></p>
<p>Statistical comparison of observed volumes against expected levels—derived from historical trends and seasonal patterns—enables identification and quantification of service shortfalls or surpluses.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="69" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="service-utilization-over-time">Service utilization over time</h2>
<p><img src="../resources/default_outputs/Module3_5_Number_of_services_reported.png" alt="Service utilization over time" style="height:420px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="70" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="year-over-year-change">Year-over-year change</h2>
<p><strong>Year-over-year percent change</strong> quantifies shifts in service delivery between consecutive years.</p>
<p>For each indicator and region, total volume in the current year is compared to the previous year:</p>
<p><strong>Percent change</strong> = (Current year − Previous year) ÷ Previous year × 100</p>
<p>Changes exceeding <strong>±10%</strong> are flagged for review.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="71" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="output-change-in-service-volume">Output: Change in service volume</h2>
<div style="display: flex; gap: 1.5em; align-items: flex-start;">
<div style="flex: 1.2;">
<p><img src="../resources/default_outputs/Module3_1_Change_in_service_volume.png" alt="Change in service volume" style="height:340px;" /></p>
</div>
<div style="flex: 1;">
<h3 id="interpretation">Interpretation</h3>
<p><strong>Bars</strong> show annual service volumes by region. <strong>Percentages</strong> indicate year-over-year change.</p>
<p><strong>Key considerations:</strong></p>
<ul>
<li>Which regions exhibit the largest changes?</li>
<li>Are changes consistent across regions or geographically concentrated?</li>
<li>Do patterns vary by indicator?</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="72" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="disruption-detection">Disruption detection</h2>
<p>Our approach to service disruptions and surpluses utilizes an interrupted time series regression with facility-level fixed effects. Previous large and unexpected changes in historical data are removed. Unexpected volume changes are estimated by comparing observed volume to expected volume based on historical trends and seasonality.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="73" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="disruptions-and-surpluses">Disruptions and surpluses</h2>
<div style="display: flex; gap: 1.5em; align-items: flex-start;">
<div style="flex: 1;">
<p><strong>Disruptions</strong> are flagged when volumes fall below anticipated levels, signaling potential barriers to access, resource shortages, or system failures.</p>
<p><strong>Surpluses</strong> occur when volumes exceed expectations, which may indicate increased demand, over-reporting, or changes in service delivery.</p>
</div>
<div style="flex: 2;">
<p><img src="../resources/diagrams/disruption_chart.png" alt="Disruption and surplus example" style="height:300px;" /></p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="74" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="how-it-works">How it works</h2>
<p><strong>Using past data to set expectations:</strong> We look at the past few years of data to understand the typical pattern for each month, accounting for regular seasonal changes.</p>
<p><strong>Spotting unusual changes:</strong> We compare current service volumes to expectations. If we see volumes much higher or lower than expected, we flag it as an unusual change.</p>
<p><strong>Handling past disruptions:</strong> We adjust historical data by removing previous big, unexpected changes so one-off events don't skew our understanding of what's &quot;normal.&quot;</p>
<p><strong>Detecting disruptions over time:</strong> We look at trends to see if there are clear shifts in health service use over several months.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="75" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="comparison-to-dhis2">Comparison to DHIS2</h2>
<p>Extension of service utilization analysis, using more complex statistical approaches not available in DHIS2.</p>
<p>Using a regression framework, we are able to:</p>
<ul>
<li>Account for seasonality</li>
<li>Exclude unusual changes to ensure one-off events aren't influencing normal trends</li>
<li>Use historical data as a baseline for context</li>
<li>Detect disruptions and recovery patterns</li>
<li>Quantify changes with a robust methodology as compared to just observing simple fluctuations in a trend line</li>
</ul>
<p>This improves the ability to interpret and compare utilization data across national and sub-national areas without needing population denominators.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="76" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="output-actual-vs-expected-national">Output: Actual vs expected (national)</h2>
<p><img src="../resources/default_outputs/Module3_2_Actual_vs_expected_national.png" alt="Actual vs expected national" style="height:380px;" /></p>
<p style="font-size: 0.8em; color: #666;">National-level comparison of observed service volumes against expected values derived from historical trends and seasonal patterns.
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="77" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="output-actual-vs-expected-subnational">Output: Actual vs expected (subnational)</h2>
<p><img src="../resources/default_outputs/Module3_3_Actual_vs_expected_subnational.png" alt="Actual vs expected subnational" style="height:380px;" /></p>
<p style="font-size: 0.8em; color: #666;">Subnational disaggregation enables identification of geographic areas where disruptions are concentrated.
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="78" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="service-coverage-estimates---module-4">Service coverage estimates - Module 4</h2>
<p>Estimating the percentage of the target population that received a given health service</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="79" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="our-approach-to-service-coverage-analysis">Our approach to service coverage analysis</h2>
<p>Our approach derives and validates population denominators, significantly improving coverage estimates reported from HMIS systems.</p>
<p>In countries with accurate data, this approach helps identify subnational inequities and updates outdated estimates, while in countries with less precise data, the trends still provide valuable insights into performance.</p>
<p>We use these estimates to track recent trends and subnational disparities in the coverage of selected health services.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="80" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="two-part-analytical-process">Two-part analytical process</h2>
<p>The coverage estimation module operates in two sequential parts:</p>
<table>
<thead>
<tr>
<th>Part</th>
<th>Components</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Part 1: Denominator calculation</strong></td>
<td>Calculate target populations using multiple methods; compare against survey benchmarks; select optimal denominator for each indicator</td>
</tr>
<tr>
<td><strong>Part 2: Coverage estimation</strong></td>
<td>Apply denominator selections; project survey estimates forward using HMIS trends; generate final coverage estimates</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="81" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="what-is-service-coverage">What is service coverage?</h2>
<p><strong>Service coverage</strong> represents the proportion of the target population that received a specified health service.</p>
<p><img src="../resources/diagrams/coverage_equation.svg" alt="Coverage equation" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="82" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="denominators-by-service-type">Denominators by service type</h2>
<p>Each health indicator corresponds to a specific target population:</p>
<table>
<thead>
<tr>
<th>Service</th>
<th>Target population (denominator)</th>
</tr>
</thead>
<tbody>
<tr>
<td>ANC1, ANC4</td>
<td>Pregnant women</td>
</tr>
<tr>
<td>Institutional delivery</td>
<td>Live births</td>
</tr>
<tr>
<td>BCG</td>
<td>Live births</td>
</tr>
<tr>
<td>Penta1, Penta3</td>
<td>Infants surviving beyond neonatal period</td>
</tr>
<tr>
<td>Measles1, Measles2</td>
<td>Infants surviving beyond infancy</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="83" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="83" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="demographic-cascade">Demographic cascade</h2>
<p>Sequential demographic adjustments transform one target population estimate into another. Starting from pregnancies, demographic factors are applied to derive subsequent denominators:</p>
<p><img src="../resources/diagrams/denominator_cascade.svg" alt="Denominator cascade flowchart" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="84" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="denominator-cascade-illustration">Denominator cascade: Illustration</h2>
<p style="font-size: 0.85em;">Starting from ANC1 service counts, demographic adjustment factors are applied sequentially to derive denominators for other services:</p>
<p><img src="../resources/diagrams/denominator_cascade_example.svg" alt="Denominator cascade example" style="height:380px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="85" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="forward-and-backward-derivation">Forward and backward derivation</h2>
<p>From any entry point, the cascade derives denominators in both directions:</p>
<table>
<thead>
<tr>
<th>Direction</th>
<th>Method</th>
<th>Example from Penta1</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Forward</strong></td>
<td>Apply mortality/attrition rates</td>
<td>DPT-eligible → Measles1-eligible → Measles2-eligible</td>
</tr>
<tr>
<td><strong>Backward</strong></td>
<td>Reverse mortality rates (add deaths back)</td>
<td>DPT-eligible → Live births → Births → Deliveries → Pregnancies</td>
</tr>
</tbody>
</table>
<p>Backward derivation enables estimation of upstream populations from downstream service counts.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="86" data-marpit-scope-GJTQZ8dQ="" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="86" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="denominators-by-entry-point">Denominators by entry point</h2>

<p>Each HMIS indicator serves as an entry point. The module derives all target populations via forward and backward cascades:</p>
<table>
<thead>
<tr>
<th>Entry point</th>
<th>Base calculation</th>
<th>Forward derivation</th>
<th>Backward derivation</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>ANC1</strong></td>
<td>ANC1 ÷ coverage → Pregnancies</td>
<td>Deliveries → Live births → DPT-eligible → Measles-eligible</td>
<td>—</td>
</tr>
<tr>
<td><strong>Deliveries</strong></td>
<td>Deliveries ÷ coverage → Deliveries</td>
<td>Live births → DPT-eligible → Measles-eligible</td>
<td>Pregnancies</td>
</tr>
<tr>
<td><strong>BCG</strong></td>
<td>BCG ÷ coverage → Live births</td>
<td>DPT-eligible → Measles-eligible</td>
<td>Deliveries → Pregnancies</td>
</tr>
<tr>
<td><strong>Penta1</strong></td>
<td>Penta1 ÷ coverage → DPT-eligible</td>
<td>Measles1-eligible → Measles2-eligible</td>
<td>Live births → Births → Deliveries → Pregnancies</td>
</tr>
<tr>
<td><strong>UN WPP</strong></td>
<td>Crude birth rate × population → Pregnancies, live births; Under-1 pop → DPT, measles</td>
<td>Applies mortality rates for measles denominators</td>
<td>—</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="87" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="87" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">

<h2 id="coverage-projection-methodology">Coverage projection methodology</h2>
<p>The module projects the most recent survey value forward using trends observed in HMIS-derived coverage:</p>
<p><img src="../resources/diagrams/coverage_projection.svg" alt="Coverage projection method" /></p>
<p>Year-over-year changes (deltas) in HMIS coverage are calculated and applied to the last survey value. This approach preserves the survey baseline while incorporating observed service delivery trends.</p>
</section>

<h2 id="analytical-thinking--interpretation">Analytical thinking &amp; interpretation</h2>
<p>Interpretation connects <strong>data patterns</strong> to <strong>programmatic meaning</strong>.</p>
<p>For every FASTR output, ask three questions:</p>
<ol>
<li><strong>What does it show?</strong> — Describe the pattern accurately</li>
<li><strong>Why might that be?</strong> — Consider multiple explanations</li>
<li><strong>What should we do?</strong> — Identify next steps or actions</li>
</ol>
<p><small><em>Moving from numbers to insights requires context, critical thinking, and programmatic knowledge.</em></small></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="95" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="95" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="moving-from-data-to-key-messages">Moving from data to key messages</h2>
<h3 id="what-is-a-result">What is a result?</h3>
<p>Results are what the analysis found (data quality scores, coverage estimations, service utilization numbers). They are often many in number, complex, hard to understand 'at a glance', and lacking interpretation.</p>
<h3 id="what-is-a-key-takeaway">What is a key takeaway?</h3>
<p>Key takeaways are what the results are telling us — why the results matter, the 'so what'. They should be few in number, simple and clear, easy to remember, and actionable.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="96" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="96" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="dissemination-and-data-use-roadmap">Dissemination and data use roadmap</h2>
<p>A data use roadmap is a strategic plan that outlines how data will be utilized, shared, and disseminated effectively.</p>
<h3 id="why-is-it-important">Why is it important?</h3>
<ul>
<li>Establishes metrics to evaluate the success of data use</li>
<li>Identifies key stakeholders, target audiences, and dissemination platforms</li>
<li>Outlines steps needed to achieve data dissemination goals</li>
<li>Anticipates potential challenges and develops strategies to solve for them</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="97" data-paginate="true" data-theme="bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp" lang="en-AU" data-marpit-pagination="97" style="--paginate:true;--theme:bj50dl2vp2yuwbxl1rhqmfuery9jaso8orodu030yp;" data-marpit-pagination-total="100">
<h2 id="presenting-reports-and-group-feedback">Presenting reports and group feedback</h2>
