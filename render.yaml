services:
  - type: web
    name: fastr-deck-builder
    runtime: node
    plan: free
    buildCommand: cd web-app && npm install && cd client && npm install && cd .. && npm run build
    startCommand: cd web-app && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /data/workshops.db
      - key: TEAM_PASSWORD
        sync: false  # Set manually in Render dashboard
      - key: SESSION_SECRET
        generateValue: true  # Render generates a random secret
      - key: ANTHROPIC_API_KEY
        sync: false  # Set manually for AI features (optional)
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
