<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1F9A9C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0C716B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#f8fafa"/>

  <!-- Dividing line -->
  <line x1="50" y1="170" x2="750" y2="170" stroke="#09544F" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.3"/>

  <!-- Zone labels on left, vertically centered in their zones -->
  <g transform="translate(50, 90)">
    <rect x="0" y="0" width="80" height="28" rx="4" fill="#09544F"/>
    <text x="40" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white">DECIDES</text>
  </g>

  <g transform="translate(50, 255)">
    <rect x="0" y="0" width="80" height="28" rx="4" fill="#1F9A9C"/>
    <text x="40" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white">SUPPORTS</text>
  </g>

  <!-- Human decision maker - centered at x=400 -->
  <g transform="translate(400, 30)">
    <!-- User icon silhouette -->
    <circle cx="0" cy="20" r="24" fill="#09544F"/>
    <path d="M-40 70 Q-40 40 0 40 Q40 40 40 70 Z" fill="#09544F"/>
    <text x="0" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#09544F">Human Decision Maker</text>
    <text x="0" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#0C716B">Judgement · Accountability · Action</text>
  </g>

  <!-- Arrow from AI to Human -->
  <line x1="400" y1="210" x2="400" y2="180" stroke="#D0CB17" stroke-width="4"/>
  <polygon points="400,170 392,185 408,185" fill="#D0CB17"/>

  <!-- AI Assistant - centered at x=400 -->
  <g transform="translate(400, 245)">
    <rect x="-90" y="-25" width="180" height="50" rx="25" fill="url(#aiGradient)" stroke="#09544F" stroke-width="2"/>
    <text x="0" y="-3" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="white">FASTR AI Assistant</text>
    <text x="0" y="13" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#CAE6E9">Grounded in evidence</text>
  </g>

  <!-- Three capabilities - all at y=345, evenly spaced at x=200, 400, 600 -->

  <!-- Left: Interpretation at x=200 -->
  <g transform="translate(200, 345)">
    <rect x="-65" y="-25" width="130" height="50" rx="8" fill="#CAE6E9" stroke="#1A90C0" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#21568C">Interpretation</text>
    <text x="0" y="12" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#21568C">Explains patterns</text>
  </g>
  <line x1="200" y1="315" x2="330" y2="270" stroke="#1A90C0" stroke-width="2"/>

  <!-- Center: Querying at x=400 -->
  <g transform="translate(400, 345)">
    <rect x="-65" y="-25" width="130" height="50" rx="8" fill="#fdf6e3" stroke="#D8A822" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#09544F">Querying</text>
    <text x="0" y="12" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#0C716B">Finds information</text>
  </g>
  <line x1="400" y1="315" x2="400" y2="275" stroke="#D8A822" stroke-width="2"/>

  <!-- Right: Outputs at x=600 -->
  <g transform="translate(600, 345)">
    <rect x="-65" y="-25" width="130" height="50" rx="8" fill="#f9e8f4" stroke="#BD5091" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#7A1F6E">Outputs</text>
    <text x="0" y="12" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7A1F6E">Generates drafts</text>
  </g>
  <line x1="600" y1="315" x2="470" y2="270" stroke="#BD5091" stroke-width="2"/>

</svg>