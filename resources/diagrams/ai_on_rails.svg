<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340">
  <defs>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1F9A9C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0C716B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="340" fill="#f8fafa"/>

  <!-- Center: AI Assistant -->
  <g transform="translate(340, 95)">
    <circle cx="60" cy="50" r="60" fill="url(#aiGradient)" stroke="#09544F" stroke-width="2"/>
    <text x="60" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="white">FASTR</text>
    <text x="60" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="white">AI Assistant</text>
  </g>

  <!-- Tool 1: Analysis Results (top left) - using lime -->
  <g transform="translate(70, 40)">
    <rect x="0" y="0" width="140" height="70" rx="8" fill="#f7f7e6" stroke="#D0CB17" stroke-width="2"/>
    <text x="70" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#09544F">Your Results</text>
    <text x="70" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#0C716B">DQA scores</text>
    <text x="70" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#0C716B">Coverage estimates</text>
    <text x="70" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#0C716B">Disruption flags</text>
  </g>
  <line x1="210" y1="75" x2="340" y2="120" stroke="#D0CB17" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Tool 2: Visualizations (top right) - using blue -->
  <g transform="translate(590, 40)">
    <rect x="0" y="0" width="140" height="70" rx="8" fill="#CAE6E9" stroke="#1A90C0" stroke-width="2"/>
    <text x="70" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#21568C">Your Charts</text>
    <text x="70" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#21568C">Time series</text>
    <text x="70" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#21568C">Bar charts</text>
    <text x="70" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#21568C">Data tables</text>
  </g>
  <line x1="590" y1="75" x2="460" y2="120" stroke="#1A90C0" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Tool 3: R Code & Methods (bottom left) - using gold -->
  <g transform="translate(70, 180)">
    <rect x="0" y="0" width="140" height="70" rx="8" fill="#fdf6e3" stroke="#D8A822" stroke-width="2"/>
    <text x="70" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#09544F">The Code</text>
    <text x="70" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#0C716B">R scripts used</text>
    <text x="70" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#0C716B">Formulas applied</text>
    <text x="70" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#0C716B">Parameters set</text>
  </g>
  <line x1="210" y1="215" x2="340" y2="170" stroke="#D8A822" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Tool 4: Documentation (bottom right) - using orchid/purple -->
  <g transform="translate(590, 180)">
    <rect x="0" y="0" width="140" height="70" rx="8" fill="#f9e8f4" stroke="#BD5091" stroke-width="2"/>
    <text x="70" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#7A1F6E">The Methods</text>
    <text x="70" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7A1F6E">Indicator definitions</text>
    <text x="70" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7A1F6E">Methodology guides</text>
    <text x="70" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7A1F6E">Interpretation tips</text>
  </g>
  <line x1="590" y1="215" x2="460" y2="170" stroke="#BD5091" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Example question -->
  <g transform="translate(265, 265)">
    <rect x="0" y="0" width="270" height="32" rx="16" fill="#CAE6E9" stroke="#1F9A9C" stroke-width="1.5"/>
    <text x="135" y="13" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#09544F" font-style="italic">"Which states show ANC4 disruptions this quarter?"</text>
    <text x="135" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#0C716B">→ AI queries disruption flags and returns the list</text>
  </g>

  <!-- Bottom comparison -->
  <g transform="translate(85, 305)">
    <rect x="0" y="0" width="280" height="30" rx="6" fill="#ffe5e5" stroke="#FF6462" stroke-width="1.5"/>
    <text x="140" y="13" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#cc3330">Generic AI</text>
    <text x="140" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#cc3330">Makes up plausible-sounding answers</text>
  </g>

  <g transform="translate(435, 305)">
    <rect x="0" y="0" width="280" height="30" rx="6" fill="#e6f5f5" stroke="#1F9A9C" stroke-width="1.5"/>
    <text x="140" y="13" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#09544F">FASTR AI</text>
    <text x="140" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#09544F">Checks the source before answering</text>
  </g>

</svg>
