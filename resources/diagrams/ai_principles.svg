<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340">
  <!-- Background -->
  <rect width="800" height="340" fill="#f8fafa"/>

  <!-- Principle 1: Open & Transparent -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="360" height="140" rx="12" fill="#CAE6E9" stroke="#1A90C0" stroke-width="2"/>

    <!-- Small eye icon -->
    <g transform="translate(20, 20)">
      <ellipse cx="14" cy="14" rx="12" ry="8" fill="none" stroke="#1A90C0" stroke-width="2"/>
      <circle cx="14" cy="14" r="4" fill="#1A90C0"/>
    </g>

    <text x="52" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#21568C">Methods are open, transparent,</text>
    <text x="52" y="46" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#21568C">and auditable</text>

    <text x="20" y="72" font-family="system-ui, sans-serif" font-size="10" fill="#0C716B">Coupling AI with deterministic, stable, human-created</text>
    <text x="20" y="86" font-family="system-ui, sans-serif" font-size="10" fill="#0C716B">analysis scripts, with explicit assumptions and documented</text>
    <text x="20" y="100" font-family="system-ui, sans-serif" font-size="10" fill="#0C716B">methodology, ensures results are reliable, trustworthy,</text>
    <text x="20" y="114" font-family="system-ui, sans-serif" font-size="10" fill="#0C716B">and can be cited.</text>
  </g>

  <!-- Principle 2: Country Data Systems -->
  <g transform="translate(410, 20)">
    <rect x="0" y="0" width="360" height="140" rx="12" fill="#f7f7e6" stroke="#D0CB17" stroke-width="2"/>

    <!-- Small shield icon -->
    <g transform="translate(20, 16)">
      <path d="M14 4 L26 8 L26 18 Q26 26 14 32 Q2 26 2 18 L2 8 Z" fill="none" stroke="#D8A822" stroke-width="2"/>
      <path d="M10 17 L13 20 L20 13" fill="none" stroke="#D8A822" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="52" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#09544F">Built on country data systems</text>
    <text x="52" y="46" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#09544F">&amp; data protections</text>

    <text x="20" y="72" font-family="system-ui, sans-serif" font-size="10" fill="#0C716B">National data instance can be hosted on remote (or in</text>
    <text x="20" y="86" font-family="system-ui, sans-serif" font-size="10" fill="#0C716B">the future, on country servers); DHIS2 import functionality</text>
    <text x="20" y="100" font-family="system-ui, sans-serif" font-size="10" fill="#0C716B">requires existing access; roles-based access and</text>
    <text x="20" y="114" font-family="system-ui, sans-serif" font-size="10" fill="#0C716B">permissions governed by MoH admin users.</text>
  </g>

  <!-- Principle 3: Equity & Sustainability -->
  <g transform="translate(30, 180)">
    <rect x="0" y="0" width="360" height="140" rx="12" fill="#f9e8f4" stroke="#BD5091" stroke-width="2"/>

    <!-- Small scales icon -->
    <g transform="translate(20, 16)">
      <line x1="14" y1="6" x2="14" y2="28" stroke="#BD5091" stroke-width="2"/>
      <line x1="4" y1="12" x2="24" y2="12" stroke="#BD5091" stroke-width="2"/>
      <circle cx="14" cy="6" r="3" fill="#BD5091"/>
      <path d="M4 12 L1 22 L7 22 Z" fill="none" stroke="#BD5091" stroke-width="1.5"/>
      <path d="M24 12 L21 22 L27 22 Z" fill="none" stroke="#BD5091" stroke-width="1.5"/>
      <rect x="9" y="28" width="10" height="3" rx="1" fill="#BD5091"/>
    </g>

    <text x="52" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#7A1F6E">Promoting equity and</text>
    <text x="52" y="46" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#7A1F6E">sustainability by design</text>

    <text x="20" y="72" font-family="system-ui, sans-serif" font-size="10" fill="#0C716B">The FASTR platform lowers barriers to advanced analytics</text>
    <text x="20" y="86" font-family="system-ui, sans-serif" font-size="10" fill="#0C716B">by removing dependence on licensed software, reducing</text>
    <text x="20" y="100" font-family="system-ui, sans-serif" font-size="10" fill="#0C716B">dependence on specific technical skills, and building</text>
    <text x="20" y="114" font-family="system-ui, sans-serif" font-size="10" fill="#0C716B">platforms on open-source technologies.</text>
  </g>

  <!-- Principle 4: AI as Accelerator -->
  <g transform="translate(410, 180)">
    <rect x="0" y="0" width="360" height="140" rx="12" fill="#e6f5f5" stroke="#1F9A9C" stroke-width="2"/>

    <!-- Small lightning bolt icon -->
    <g transform="translate(20, 14)">
      <path d="M18 2 L8 16 L14 16 L10 30 L22 14 L15 14 Z" fill="#1F9A9C"/>
    </g>

    <text x="52" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#09544F">AI is an accelerator and enabler,</text>
    <text x="52" y="46" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#09544F">not a decision maker</text>

    <text x="20" y="72" font-family="system-ui, sans-serif" font-size="10" fill="#0C716B">AI supports interpretation, querying the data and</text>
    <text x="20" y="86" font-family="system-ui, sans-serif" font-size="10" fill="#0C716B">generating outputs – it does not replace human</text>
    <text x="20" y="100" font-family="system-ui, sans-serif" font-size="10" fill="#0C716B">judgement or decision making.</text>
  </g>

</svg>