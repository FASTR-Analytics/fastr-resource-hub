<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 295">
  <defs>
    <style>
      .box { rx: 10; stroke-width: 2; }
      .box-assess { fill: #1A90C0; stroke: #21568C; }
      .box-adjust { fill: #BD5091; stroke: #7A1F6E; }
      .box-util { fill: #1F9A9C; stroke: #0C716B; }
      .box-coverage { fill: #D8A822; stroke: #09544F; }
      .text-white { font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
      .text-dark { font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; fill: #09544F; text-anchor: middle; }
      .text-sub { font-family: Inter, sans-serif; font-size: 10.5px; fill: #ffffff; text-anchor: middle; opacity: 0.9; }
      .text-sub-dark { font-family: Inter, sans-serif; font-size: 10.5px; fill: #09544F; text-anchor: middle; opacity: 0.8; }
      .module-label { font-family: Inter, sans-serif; font-size: 9px; fill: #888; text-anchor: middle; font-style: italic; }
      .arrow { stroke: #1F9A9C; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-label { font-family: Inter, sans-serif; font-size: 9.5px; fill: #555; text-anchor: middle; font-style: italic; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1F9A9C"/>
    </marker>
  </defs>

  <!-- Step 1: Data Quality Assessment -->
  <rect class="box box-assess" x="200" y="10" width="400" height="55"/>
  <text class="text-white" x="400" y="31">Data Quality Assessment</text>
  <text class="text-sub" x="400" y="49">Completeness, outliers, consistency</text>
  <text class="module-label" x="400" y="78">Module 1</text>

  <!-- Arrow down -->
  <line class="arrow" x1="400" y1="65" x2="400" y2="95"/>

  <!-- Step 2: Data Quality Adjustment -->
  <rect class="box box-adjust" x="200" y="100" width="400" height="55"/>
  <text class="text-white" x="400" y="121">Data Quality Adjustment</text>
  <text class="text-sub" x="400" y="139">Outlier replacement, completeness correction</text>
  <text class="module-label" x="400" y="168">Module 2</text>

  <!-- Arrows splitting left and right -->
  <path class="arrow" d="M 400 155 L 400 190 L 200 190 L 200 215"/>
  <path class="arrow" d="M 400 155 L 400 190 L 600 190 L 600 215"/>

  <!-- Label between arrows -->
  <text class="arrow-label" x="400" y="207">Adjusted and non-adjusted data</text>

  <!-- Step 3a: Service Utilization -->
  <rect class="box box-util" x="20" y="220" width="360" height="55"/>
  <text class="text-white" x="200" y="241">Service Utilization</text>
  <text class="text-white" x="200" y="258">&amp; Disruption Detection</text>
  <text class="text-sub" x="200" y="271">Volumes, trends, significant deviations</text>
  <text class="module-label" x="200" y="288">Module 3</text>

  <!-- Step 3b: Coverage Estimation -->
  <rect class="box box-coverage" x="420" y="220" width="360" height="55"/>
  <text class="text-dark" x="600" y="241">Coverage Estimation</text>
  <text class="text-sub-dark" x="600" y="258">Denominator estimation</text>
  <text class="text-sub-dark" x="600" y="271">&amp; coverage calculation</text>
  <text class="module-label" x="600" y="288">Module 4</text>
</svg>
