<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260">

  <!-- Card 1: Line chart -->
  <g transform="translate(15, 15)">
    <rect x="0" y="0" width="160" height="220" rx="10" fill="#E8F4F3"/>
    <!-- Icon area -->
    <rect x="0" y="0" width="160" height="70" rx="10" fill="#09544F"/>
    <rect x="0" y="40" width="160" height="30" fill="#09544F"/>
    <!-- Mini line chart icon -->
    <polyline points="30,50 55,30 80,40 105,20 130,35" stroke="#CAE6E9" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Text -->
    <text x="80" y="95" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#09544F">Line chart</text>
    <line x1="20" y1="108" x2="140" y2="108" stroke="#CAE6E9" stroke-width="1.5"/>
    <text x="80" y="130" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">How is it changing</text>
    <text x="80" y="144" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">over time?</text>
    <line x1="20" y1="158" x2="140" y2="158" stroke="#CAE6E9" stroke-width="1"/>
    <text x="80" y="178" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">Trends, seasonal</text>
    <text x="80" y="191" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">patterns, progress</text>
    <text x="80" y="204" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">toward targets</text>
  </g>

  <!-- Card 2: Bar chart -->
  <g transform="translate(185, 15)">
    <rect x="0" y="0" width="160" height="220" rx="10" fill="#E8F4F3"/>
    <rect x="0" y="0" width="160" height="70" rx="10" fill="#0C716B"/>
    <rect x="0" y="40" width="160" height="30" fill="#0C716B"/>
    <!-- Mini bar chart icon -->
    <rect x="35" y="45" width="18" height="20" rx="2" fill="#CAE6E9"/>
    <rect x="60" y="30" width="18" height="35" rx="2" fill="#CAE6E9"/>
    <rect x="85" y="38" width="18" height="27" rx="2" fill="#CAE6E9"/>
    <rect x="110" y="25" width="18" height="40" rx="2" fill="#CAE6E9"/>
    <!-- Text -->
    <text x="80" y="95" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#09544F">Bar chart</text>
    <line x1="20" y1="108" x2="140" y2="108" stroke="#CAE6E9" stroke-width="1.5"/>
    <text x="80" y="130" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">Which area is doing</text>
    <text x="80" y="144" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">best or worst?</text>
    <line x1="20" y1="158" x2="140" y2="158" stroke="#CAE6E9" stroke-width="1"/>
    <text x="80" y="178" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">Comparing regions,</text>
    <text x="80" y="191" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">facilities, or</text>
    <text x="80" y="204" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">indicators side by side</text>
  </g>

  <!-- Card 3: Table -->
  <g transform="translate(355, 15)">
    <rect x="0" y="0" width="160" height="220" rx="10" fill="#E8F4F3"/>
    <rect x="0" y="0" width="160" height="70" rx="10" fill="#1F9A9C"/>
    <rect x="0" y="40" width="160" height="30" fill="#1F9A9C"/>
    <!-- Mini table icon -->
    <rect x="35" y="22" width="90" height="42" rx="3" fill="none" stroke="#CAE6E9" stroke-width="1.5"/>
    <line x1="35" y1="35" x2="125" y2="35" stroke="#CAE6E9" stroke-width="1"/>
    <line x1="35" y1="48" x2="125" y2="48" stroke="#CAE6E9" stroke-width="1"/>
    <line x1="70" y1="22" x2="70" y2="64" stroke="#CAE6E9" stroke-width="1"/>
    <line x1="100" y1="22" x2="100" y2="64" stroke="#CAE6E9" stroke-width="1"/>
    <!-- Text -->
    <text x="80" y="95" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#09544F">Table</text>
    <line x1="20" y1="108" x2="140" y2="108" stroke="#CAE6E9" stroke-width="1.5"/>
    <text x="80" y="130" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">What are the exact</text>
    <text x="80" y="144" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">numbers?</text>
    <line x1="20" y1="158" x2="140" y2="158" stroke="#CAE6E9" stroke-width="1"/>
    <text x="80" y="178" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">Precise values,</text>
    <text x="80" y="191" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">reference data,</text>
    <text x="80" y="204" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">detailed breakdowns</text>
  </g>

  <!-- Card 4: Heatmap -->
  <g transform="translate(525, 15)">
    <rect x="0" y="0" width="160" height="220" rx="10" fill="#E8F4F3"/>
    <rect x="0" y="0" width="160" height="70" rx="10" fill="#09544F"/>
    <rect x="0" y="40" width="160" height="30" fill="#09544F"/>
    <!-- Mini heatmap icon -->
    <rect x="35" y="22" width="20" height="14" rx="2" fill="#C53030" opacity="0.7"/>
    <rect x="58" y="22" width="20" height="14" rx="2" fill="#1F9A9C"/>
    <rect x="81" y="22" width="20" height="14" rx="2" fill="#09544F"/>
    <rect x="104" y="22" width="20" height="14" rx="2" fill="#1F9A9C"/>
    <rect x="35" y="40" width="20" height="14" rx="2" fill="#1F9A9C"/>
    <rect x="58" y="40" width="20" height="14" rx="2" fill="#09544F"/>
    <rect x="81" y="40" width="20" height="14" rx="2" fill="#C53030" opacity="0.7"/>
    <rect x="104" y="40" width="20" height="14" rx="2" fill="#CAE6E9"/>
    <!-- Text -->
    <text x="80" y="95" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#09544F">Heatmap</text>
    <line x1="20" y1="108" x2="140" y2="108" stroke="#CAE6E9" stroke-width="1.5"/>
    <text x="80" y="130" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">Where is the pattern</text>
    <text x="80" y="144" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">across many items?</text>
    <line x1="20" y1="158" x2="140" y2="158" stroke="#CAE6E9" stroke-width="1"/>
    <text x="80" y="178" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">Multiple indicators</text>
    <text x="80" y="191" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">across regions,</text>
    <text x="80" y="204" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">spotting outliers fast</text>
  </g>

  <!-- Bottom note -->
  <text x="350" y="252" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#777" font-style="italic">Start with the question you want to answer, then pick the chart that answers it best</text>

</svg>
