t. Gives each facility</text><text x="890" y="304" text-anchor="middle" font-size="13" font-weight="400" fill="#1F2A2E">its own expected volume, with the season and the trend.</text><rect x="60" y="390" width="1080" height="48" rx="24" fill="#E8F4F3"/><text x="600" y="419" text-anchor="middle" font-size="14" font-weight="600" fill="#0A544F">Why two questions? A low total can come from facilities going silent, from facilities delivering less, or both. Only the second is a service disruption.</text></svg>