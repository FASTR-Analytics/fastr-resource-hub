<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 420">
  <defs>
    <style>
      .title { font-family: Inter, sans-serif; font-size: 16px; font-weight: 700; fill: #09544F; }
      .facility-label { font-family: Inter, sans-serif; font-size: 12px; fill: #333; font-weight: 600; }
      .service-label { font-family: Inter, sans-serif; font-size: 11px; fill: #666; }
      .indicator-label { font-family: Inter, sans-serif; font-size: 14px; fill: #fff; font-weight: 600; }
      .district-label { font-family: Inter, sans-serif; font-size: 14px; fill: #09544F; font-weight: 700; }
      .note-text { font-family: Inter, sans-serif; font-size: 12px; fill: #555; font-style: italic; }
      .relation-text { font-family: Inter, sans-serif; font-size: 12px; fill: #666; }
      .district-boundary { fill: #e8f4f3; stroke: #09544F; stroke-width: 2; stroke-dasharray: 8,4; }
      .facility { fill: #fff; stroke: #1A90C0; stroke-width: 2; }
      .person-path { fill: none; stroke-width: 2.5; stroke-dasharray: 6,4; }
    </style>
    <!-- Person icon -->
    <symbol id="person" viewBox="0 0 24 24">
      <circle cx="12" cy="6" r="4" fill="currentColor"/>
      <path d="M12 12c-4 0-8 2-8 6v2h16v-2c0-4-4-6-8-6z" fill="currentColor"/>
    </symbol>
    <!-- Hospital/Facility icon -->
    <symbol id="facility-icon" viewBox="0 0 40 40">
      <rect x="5" y="12" width="30" height="24" rx="2" fill="#1A90C0"/>
      <rect x="15" y="8" width="10" height="8" fill="#1A90C0"/>
      <rect x="17" y="4" width="6" height="6" fill="#c0392b"/>
      <rect x="19" y="6" width="2" height="4" fill="#fff"/>
      <rect x="17" y="8" width="6" height="2" fill="#fff"/>
      <rect x="10" y="18" width="6" height="6" fill="#fff" opacity="0.8"/>
      <rect x="17" y="18" width="6" height="6" fill="#fff" opacity="0.8"/>
      <rect x="24" y="18" width="6" height="6" fill="#fff" opacity="0.8"/>
      <rect x="15" y="28" width="10" height="8" fill="#fff" opacity="0.9"/>
    </symbol>
  </defs>

  <!-- District boundary -->
  <path class="district-boundary" d="M50,60
    Q120,40 250,55
    Q380,30 480,70
    Q520,90 520,150
    Q530,250 500,320
    Q460,380 350,390
    Q200,400 100,350
    Q40,300 35,200
    Q30,100 50,60 Z"/>

  <text class="district-label" x="280" y="85">District / Region</text>

  <!-- Facility A (top left) -->
  <g transform="translate(100, 130)">
    <rect class="facility" x="0" y="0" width="100" height="70" rx="8"/>
    <use href="#facility-icon" x="30" y="5" width="40" height="40"/>
    <text class="facility-label" x="50" y="58" text-anchor="middle">Facility A</text>
  </g>

  <!-- Facility B (top right) -->
  <g transform="translate(350, 110)">
    <rect class="facility" x="0" y="0" width="100" height="70" rx="8"/>
    <use href="#facility-icon" x="30" y="5" width="40" height="40"/>
    <text class="facility-label" x="50" y="58" text-anchor="middle">Facility B</text>
  </g>

  <!-- Facility C (bottom center) -->
  <g transform="translate(200, 270)">
    <rect class="facility" x="0" y="0" width="100" height="70" rx="8"/>
    <use href="#facility-icon" x="30" y="5" width="40" height="40"/>
    <text class="facility-label" x="50" y="58" text-anchor="middle">Facility C</text>
  </g>

  <!-- Patient journey 1: ANC1 at A → ANC4 at B (green) -->
  <path class="person-path" stroke="#27ae60" d="M200,165 Q280,120 350,145"/>
  <circle cx="200" cy="165" r="10" fill="#27ae60"/>
  <text class="service-label" x="200" y="150" text-anchor="middle" fill="#27ae60" font-weight="600">ANC1</text>
  <circle cx="350" cy="145" r="10" fill="#27ae60"/>
  <text class="service-label" x="350" y="130" text-anchor="middle" fill="#27ae60" font-weight="600">ANC4</text>

  <!-- Patient journey 2: Penta1 at C → Penta3 at B (orange) -->
  <path class="person-path" stroke="#e67e22" d="M300,305 Q380,280 400,180"/>
  <circle cx="300" cy="305" r="10" fill="#e67e22"/>
  <text class="service-label" x="315" y="320" text-anchor="start" fill="#e67e22" font-weight="600">Penta1</text>
  <circle cx="400" cy="180" r="10" fill="#e67e22"/>
  <text class="service-label" x="415" y="178" text-anchor="start" fill="#e67e22" font-weight="600">Penta3</text>

  <!-- Small person icons on paths -->
  <use href="#person" x="255" y="125" width="24" height="24" fill="#27ae60"/>
  <use href="#person" x="340" y="235" width="24" height="24" fill="#e67e22"/>

</svg>
