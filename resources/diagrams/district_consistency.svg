<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" font-family="Inter, sans-serif">
  <defs>
    <style>
      .big-title { font-size: 16px; font-weight: 700; fill: #09544F; }
      .subtitle { font-size: 11.5px; fill: #666; }
      .panel-title { font-size: 15px; font-weight: 700; }
      .reason { font-size: 10.5px; font-style: italic; fill: #777; }
      .val { font-size: 13px; font-weight: 700; fill: #09544F; }
      .axlab { font-size: 12px; font-weight: 600; fill: #555; }
      .rule { font-size: 12px; font-weight: 600; }
    </style>
  </defs>

  <!-- the rule being checked -->
  <text class="big-title" x="360" y="24" text-anchor="middle">The rule: Penta1 &#8805; Penta3</text>
  <text class="subtitle" x="360" y="43" text-anchor="middle">More children get the 1st vaccine dose than the 3rd (some drop out before finishing)</text>

  <!-- ===== LEFT: one clinic (rule can't be judged here) ===== -->
  <rect x="24" y="60" width="300" height="288" rx="12" fill="#F1F5F9"/>
  <text class="panel-title" x="174" y="88" text-anchor="middle" fill="#475569">One clinic</text>
  <text class="reason" x="174" y="106" text-anchor="middle">some children had their 1st dose elsewhere</text>

  <line x1="70" y1="300" x2="290" y2="300" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="108" y="256" width="50" height="44" rx="3" fill="#1F9A9C"/>
  <text class="val" x="133" y="248" text-anchor="middle">18</text>
  <text class="axlab" x="133" y="320" text-anchor="middle">Penta1</text>
  <rect x="196" y="156" width="50" height="144" rx="3" fill="#1F9A9C"/>
  <text class="val" x="221" y="148" text-anchor="middle">55</text>
  <text class="axlab" x="221" y="320" text-anchor="middle">Penta3</text>

  <text class="rule" x="174" y="340" text-anchor="middle" fill="#94731A">Penta3 looks higher &#8212; can't judge here</text>
  <circle cx="296" cy="82" r="15" fill="#94A3B8"/>
  <text x="296" y="83" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#fff">?</text>

  <!-- ===== arrow: add up the district ===== -->
  <line x1="334" y1="200" x2="382" y2="200" stroke="#0C716B" stroke-width="4"/>
  <polygon points="382,193 396,200 382,207" fill="#0C716B"/>
  <text x="365" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#0C716B">add up</text>
  <text x="365" y="225" text-anchor="middle" font-size="11" font-weight="600" fill="#666">every clinic</text>

  <!-- ===== RIGHT: whole district (rule holds) ===== -->
  <rect x="404" y="60" width="300" height="288" rx="12" fill="#E8F4F3"/>
  <text class="panel-title" x="554" y="88" text-anchor="middle" fill="#09544F">Whole district</text>
  <text class="reason" x="554" y="106" text-anchor="middle">movement between clinics evens out</text>

  <line x1="450" y1="300" x2="670" y2="300" stroke="#CAE6E9" stroke-width="2"/>
  <rect x="488" y="156" width="50" height="144" rx="3" fill="#1F9A9C"/>
  <text class="val" x="513" y="148" text-anchor="middle">520</text>
  <text class="axlab" x="513" y="320" text-anchor="middle">Penta1</text>
  <rect x="576" y="190" width="50" height="110" rx="3" fill="#1F9A9C"/>
  <text class="val" x="601" y="182" text-anchor="middle">410</text>
  <text class="axlab" x="601" y="320" text-anchor="middle">Penta3</text>

  <text class="rule" x="554" y="340" text-anchor="middle" fill="#0C716B">Penta1 &#8805; Penta3 &#8212; as expected</text>
  <circle cx="676" cy="82" r="15" fill="#0C716B"/>
  <polyline points="669,82 674,88 683,76" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
