<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Card 1: Discernment -->
  <g transform="translate(15, 20)">
    <rect x="0" y="0" width="155" height="260" rx="10" fill="#E8F4F3" filter="url(#shadow)"/>
    <circle cx="78" cy="40" r="22" fill="#09544F"/>
    <text x="78" y="35" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" fill="#fff" dominant-baseline="central">&#x1F50D;</text>
    <text x="78" y="82" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#09544F">Discernment</text>
    <line x1="20" y1="95" x2="135" y2="95" stroke="#CAE6E9" stroke-width="1.5"/>
    <text x="78" y="115" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">Do I know what a good</text>
    <text x="78" y="129" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">result looks like?</text>
    <text x="78" y="155" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">Know what a correct</text>
    <text x="78" y="168" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">answer looks like</text>
    <text x="78" y="181" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">before you ask — and why</text>
    <line x1="20" y1="198" x2="135" y2="198" stroke="#CAE6E9" stroke-width="1"/>
    <text x="78" y="218" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#777" font-style="italic">"Does this ANC1</text>
    <text x="78" y="230" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#777" font-style="italic">trend match what</text>
    <text x="78" y="242" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#777" font-style="italic">I see in the chart?"</text>
  </g>

  <!-- Card 2: Description -->
  <g transform="translate(185, 20)">
    <rect x="0" y="0" width="155" height="260" rx="10" fill="#E8F4F3" filter="url(#shadow)"/>
    <circle cx="78" cy="40" r="22" fill="#0C716B"/>
    <text x="78" y="35" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" fill="#fff" dominant-baseline="central">&#x1F4AC;</text>
    <text x="78" y="82" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#09544F">Description</text>
    <line x1="20" y1="95" x2="135" y2="95" stroke="#CAE6E9" stroke-width="1.5"/>
    <text x="78" y="115" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">Can I explain what</text>
    <text x="78" y="129" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">I need?</text>
    <text x="78" y="155" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">Be specific: what,</text>
    <text x="78" y="168" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">where, when, for whom</text>
    <text x="78" y="181" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">— the more detail, the better</text>
    <line x1="20" y1="198" x2="135" y2="198" stroke="#CAE6E9" stroke-width="1"/>
    <text x="78" y="218" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#777" font-style="italic">"Show ANC1 by</text>
    <text x="78" y="230" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#777" font-style="italic">region for the last</text>
    <text x="78" y="242" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#777" font-style="italic">12 months"</text>
  </g>

  <!-- Card 3: Delegation -->
  <g transform="translate(355, 20)">
    <rect x="0" y="0" width="155" height="260" rx="10" fill="#E8F4F3" filter="url(#shadow)"/>
    <circle cx="78" cy="40" r="22" fill="#1F9A9C"/>
    <text x="78" y="35" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" fill="#fff" dominant-baseline="central">&#x1F4CB;</text>
    <text x="78" y="82" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#09544F">Delegation</text>
    <line x1="20" y1="95" x2="135" y2="95" stroke="#CAE6E9" stroke-width="1.5"/>
    <text x="78" y="115" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">Am I giving the AI</text>
    <text x="78" y="129" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">the right task?</text>
    <text x="78" y="155" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">Break big tasks into</text>
    <text x="78" y="168" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">steps — ask one thing,</text>
    <text x="78" y="181" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">review it, then move on</text>
    <line x1="20" y1="198" x2="135" y2="198" stroke="#CAE6E9" stroke-width="1"/>
    <text x="78" y="218" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#777" font-style="italic">"First show the data,</text>
    <text x="78" y="230" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#777" font-style="italic">then interpret,</text>
    <text x="78" y="242" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#777" font-style="italic">then build slides"</text>
  </g>

  <!-- Card 4: Diligence -->
  <g transform="translate(525, 20)">
    <rect x="0" y="0" width="155" height="260" rx="10" fill="#E8F4F3" filter="url(#shadow)"/>
    <circle cx="78" cy="40" r="22" fill="#09544F"/>
    <text x="78" y="35" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" fill="#fff" dominant-baseline="central">&#x2714;</text>
    <text x="78" y="82" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#09544F">Diligence</text>
    <line x1="20" y1="95" x2="135" y2="95" stroke="#CAE6E9" stroke-width="1.5"/>
    <text x="78" y="115" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">Am I being</text>
    <text x="78" y="129" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">responsible?</text>
    <text x="78" y="155" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">Verify AI outputs against</text>
    <text x="78" y="168" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">the data and your expertise</text>
    <text x="78" y="181" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">— would you put your name on it?</text>
    <line x1="20" y1="198" x2="135" y2="198" stroke="#CAE6E9" stroke-width="1"/>
    <text x="78" y="218" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#777" font-style="italic">"Does this match</text>
    <text x="78" y="230" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#777" font-style="italic">what I know about</text>
    <text x="78" y="242" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#777" font-style="italic">my country?"</text>
  </g>

  <!-- Bottom note -->
  <text x="350" y="308" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#777" font-style="italic">The AI gets better as you get better at these four skills</text>

</svg>
