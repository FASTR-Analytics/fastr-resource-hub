<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Inter, sans-serif">
  <!-- Three cost blocks, utility-bill analogy -->
  <g transform="translate(40,40)">
    <rect x="0" y="0" width="270" height="240" rx="14" fill="#E8F4F3" stroke="#0C716B" stroke-width="2"/>
    <rect x="0" y="0" width="270" height="56" rx="14" fill="#09544F"/>
    <rect x="0" y="28" width="270" height="28" fill="#09544F"/>
    <text x="135" y="28" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="18" font-weight="600">Hosting</text>
    <text x="135" y="92" text-anchor="middle" dominant-baseline="central" fill="#09544F" font-size="15" font-weight="600">Like rent</text>
    <text x="135" y="126" text-anchor="middle" dominant-baseline="central" fill="#0C716B" font-size="14">A fixed monthly amount</text>
    <text x="135" y="146" text-anchor="middle" dominant-baseline="central" fill="#0C716B" font-size="14">for the country's server</text>
    <text x="135" y="196" text-anchor="middle" dominant-baseline="central" fill="#09544F" font-size="16" font-weight="700">[monthly cost — TBC]</text>
  </g>
  <g transform="translate(345,40)">
    <rect x="0" y="0" width="270" height="240" rx="14" fill="#E8F4F3" stroke="#0C716B" stroke-width="2"/>
    <rect x="0" y="0" width="270" height="56" rx="14" fill="#0C716B"/>
    <rect x="0" y="28" width="270" height="28" fill="#0C716B"/>
    <text x="135" y="28" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="18" font-weight="600">AI assistant</text>
    <text x="135" y="92" text-anchor="middle" dominant-baseline="central" fill="#09544F" font-size="15" font-weight="600">Like electricity</text>
    <text x="135" y="126" text-anchor="middle" dominant-baseline="central" fill="#0C716B" font-size="14">Metered — you pay only</text>
    <text x="135" y="146" text-anchor="middle" dominant-baseline="central" fill="#0C716B" font-size="14">for what people use</text>
    <text x="135" y="196" text-anchor="middle" dominant-baseline="central" fill="#09544F" font-size="16" font-weight="700">[monthly range — TBC]</text>
  </g>
  <g transform="translate(650,40)">
    <rect x="0" y="0" width="270" height="240" rx="14" fill="#E8F4F3" stroke="#0C716B" stroke-width="2"/>
    <rect x="0" y="0" width="270" height="56" rx="14" fill="#1F9A9C"/>
    <rect x="0" y="28" width="270" height="28" fill="#1F9A9C"/>
    <text x="135" y="28" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="18" font-weight="600">People</text>
    <text x="135" y="92" text-anchor="middle" dominant-baseline="central" fill="#09544F" font-size="15" font-weight="600">Like maintenance</text>
    <text x="135" y="126" text-anchor="middle" dominant-baseline="central" fill="#0C716B" font-size="14">Updates, monitoring,</text>
    <text x="135" y="146" text-anchor="middle" dominant-baseline="central" fill="#0C716B" font-size="14">backups, user support</text>
    <text x="135" y="196" text-anchor="middle" dominant-baseline="central" fill="#09544F" font-size="16" font-weight="700">shared team today</text>
  </g>
  <text x="480" y="322" text-anchor="middle" fill="#0C716B" font-size="16" font-style="italic">No license fee per person — adding users costs nothing extra</text>
</svg>
