<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Inter, sans-serif">
  <text x="480" y="34" text-anchor="middle" fill="#09544F" font-size="19" font-weight="600">"Is it secure?" covers five distinct questions</text>
  <!-- top row: 3 cards -->
  <g transform="translate(30,70)">
    <rect x="0" y="0" width="290" height="150" rx="12" fill="#09544F"/>
    <text x="145" y="34" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="17" font-weight="600">Confidentiality</text>
    <text x="145" y="66" text-anchor="middle" dominant-baseline="central" fill="#CAE6E9" font-size="14">Only authorized people see the data</text>
    <text x="145" y="106" text-anchor="middle" dominant-baseline="central" fill="#E8F4F3" font-size="13" font-style="italic">Who can access it?</text>
  </g>
  <g transform="translate(335,70)">
    <rect x="0" y="0" width="290" height="150" rx="12" fill="#0C716B"/>
    <text x="145" y="34" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="17" font-weight="600">Integrity</text>
    <text x="145" y="66" text-anchor="middle" dominant-baseline="central" fill="#CAE6E9" font-size="14">Figures cannot be altered unnoticed</text>
    <text x="145" y="106" text-anchor="middle" dominant-baseline="central" fill="#E8F4F3" font-size="13" font-style="italic">Can the numbers be trusted?</text>
  </g>
  <g transform="translate(640,70)">
    <rect x="0" y="0" width="290" height="150" rx="12" fill="#1F9A9C"/>
    <text x="145" y="34" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="17" font-weight="600">Availability</text>
    <text x="145" y="66" text-anchor="middle" dominant-baseline="central" fill="#E8F4F3" font-size="14">Accessible when needed</text>
    <text x="145" y="106" text-anchor="middle" dominant-baseline="central" fill="#E8F4F3" font-size="13" font-style="italic">What happens if a server fails?</text>
  </g>
  <!-- bottom row: 2 cards centered -->
  <g transform="translate(185,250)">
    <rect x="0" y="0" width="290" height="150" rx="12" fill="#0C716B"/>
    <text x="145" y="34" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="17" font-weight="600">Sovereignty</text>
    <text x="145" y="66" text-anchor="middle" dominant-baseline="central" fill="#CAE6E9" font-size="14">Remains under national control</text>
    <text x="145" y="106" text-anchor="middle" dominant-baseline="central" fill="#E8F4F3" font-size="13" font-style="italic">Who ultimately holds the data?</text>
  </g>
  <g transform="translate(490,250)">
    <rect x="0" y="0" width="290" height="150" rx="12" fill="#09544F"/>
    <text x="145" y="34" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="17" font-weight="600">Accountability</text>
    <text x="145" y="66" text-anchor="middle" dominant-baseline="central" fill="#CAE6E9" font-size="14">Every action is logged</text>
    <text x="145" y="106" text-anchor="middle" dominant-baseline="central" fill="#E8F4F3" font-size="13" font-style="italic">Who did what, and when?</text>
  </g>
</svg>
