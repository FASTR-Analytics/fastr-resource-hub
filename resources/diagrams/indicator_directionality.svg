<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340">

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#09544F">Not all changes point in the same direction</text>

  <!-- Left column: Going up is good -->
  <g transform="translate(30, 50)">
    <rect x="0" y="0" width="310" height="250" rx="12" fill="#E8F4F3"/>
    <!-- Header -->
    <rect x="0" y="0" width="310" height="44" rx="12" fill="#09544F"/>
    <rect x="0" y="20" width="310" height="24" fill="#09544F"/>
    <text x="40" y="28" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#fff">Going up is good</text>
    <text x="18" y="28" font-family="Inter, sans-serif" font-size="16" fill="#fff">&#x2191;</text>

    <!-- Items -->
    <text x="25" y="72" font-family="Inter, sans-serif" font-size="12" fill="#09544F">&#x2713;</text>
    <text x="45" y="72" font-family="Inter, sans-serif" font-size="12" fill="#333">ANC visits (ANC1, ANC4)</text>

    <text x="25" y="100" font-family="Inter, sans-serif" font-size="12" fill="#09544F">&#x2713;</text>
    <text x="45" y="100" font-family="Inter, sans-serif" font-size="12" fill="#333">Facility deliveries</text>

    <text x="25" y="128" font-family="Inter, sans-serif" font-size="12" fill="#09544F">&#x2713;</text>
    <text x="45" y="128" font-family="Inter, sans-serif" font-size="12" fill="#333">Immunizations (Penta1, BCG)</text>

    <text x="25" y="156" font-family="Inter, sans-serif" font-size="12" fill="#09544F">&#x2713;</text>
    <text x="45" y="156" font-family="Inter, sans-serif" font-size="12" fill="#333">OPD visits</text>

    <text x="25" y="184" font-family="Inter, sans-serif" font-size="12" fill="#09544F">&#x2713;</text>
    <text x="45" y="184" font-family="Inter, sans-serif" font-size="12" fill="#333">Coverage %</text>

    <text x="25" y="212" font-family="Inter, sans-serif" font-size="12" fill="#09544F">&#x2713;</text>
    <text x="45" y="212" font-family="Inter, sans-serif" font-size="12" fill="#333">Postnatal care visits</text>

    <text x="25" y="240" font-family="Inter, sans-serif" font-size="12" fill="#09544F">&#x2713;</text>
    <text x="45" y="240" font-family="Inter, sans-serif" font-size="12" fill="#333">Reporting completeness</text>
  </g>

  <!-- Right column: Going down is good -->
  <g transform="translate(360, 50)">
    <rect x="0" y="0" width="310" height="250" rx="12" fill="#FDE8E8"/>
    <!-- Header -->
    <rect x="0" y="0" width="310" height="44" rx="12" fill="#C53030"/>
    <rect x="0" y="20" width="310" height="24" fill="#C53030"/>
    <text x="40" y="28" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#fff">Going down is good</text>
    <text x="18" y="28" font-family="Inter, sans-serif" font-size="16" fill="#fff">&#x2193;</text>

    <!-- Items -->
    <text x="25" y="72" font-family="Inter, sans-serif" font-size="12" fill="#C53030">&#x2713;</text>
    <text x="45" y="72" font-family="Inter, sans-serif" font-size="12" fill="#333">Maternal deaths</text>

    <text x="25" y="100" font-family="Inter, sans-serif" font-size="12" fill="#C53030">&#x2713;</text>
    <text x="45" y="100" font-family="Inter, sans-serif" font-size="12" fill="#333">Neonatal complications</text>

    <text x="25" y="128" font-family="Inter, sans-serif" font-size="12" fill="#C53030">&#x2713;</text>
    <text x="45" y="128" font-family="Inter, sans-serif" font-size="12" fill="#333">Dropout rates</text>

    <text x="25" y="156" font-family="Inter, sans-serif" font-size="12" fill="#C53030">&#x2713;</text>
    <text x="45" y="156" font-family="Inter, sans-serif" font-size="12" fill="#333">Stockout days</text>

    <text x="25" y="184" font-family="Inter, sans-serif" font-size="12" fill="#C53030">&#x2713;</text>
    <text x="45" y="184" font-family="Inter, sans-serif" font-size="12" fill="#333">Outlier rates</text>

    <text x="25" y="212" font-family="Inter, sans-serif" font-size="12" fill="#C53030">&#x2713;</text>
    <text x="45" y="212" font-family="Inter, sans-serif" font-size="12" fill="#333">Stillbirth rates</text>

    <text x="25" y="240" font-family="Inter, sans-serif" font-size="12" fill="#C53030">&#x2713;</text>
    <text x="45" y="240" font-family="Inter, sans-serif" font-size="12" fill="#333">Case fatality rates</text>
  </g>

  <!-- Bottom note -->
  <text x="350" y="328" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#777" font-style="italic">Always ask: does more of this mean better health?</text>

</svg>
