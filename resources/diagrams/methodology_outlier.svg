<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 150" font-family="Inter, sans-serif">
  <!-- usual range band -->
  <rect x="22" y="96" width="336" height="29" rx="3" fill="#E8F4F3"/>
  <!-- baseline -->
  <line x1="22" y1="125" x2="358" y2="125" stroke="#CAE6E9" stroke-width="1.5"/>
  <!-- median / usual level (dashed) -->
  <line x1="22" y1="103" x2="358" y2="103" stroke="#1F9A9C" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- normal monthly bars -->
  <rect x="28"  y="106" width="18" height="19" rx="2" fill="#1F9A9C"/>
  <rect x="56"  y="100" width="18" height="25" rx="2" fill="#1F9A9C"/>
  <rect x="84"  y="108" width="18" height="17" rx="2" fill="#1F9A9C"/>
  <rect x="112" y="102" width="18" height="23" rx="2" fill="#1F9A9C"/>
  <rect x="140" y="104" width="18" height="21" rx="2" fill="#1F9A9C"/>
  <rect x="168" y="99"  width="18" height="26" rx="2" fill="#1F9A9C"/>

  <!-- the spike (flagged) -->
  <rect x="196" y="32" width="18" height="93" rx="2" fill="#C53030"/>
  <!-- flag marker above the spike -->
  <circle cx="205" cy="20" r="9" fill="#FDE8E8" stroke="#C53030" stroke-width="1.5"/>
  <line x1="201.5" y1="16.5" x2="208.5" y2="23.5" stroke="#C53030" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="208.5" y1="16.5" x2="201.5" y2="23.5" stroke="#C53030" stroke-width="1.6" stroke-linecap="round"/>

  <!-- normal monthly bars (after the spike) -->
  <rect x="224" y="105" width="18" height="20" rx="2" fill="#1F9A9C"/>
  <rect x="252" y="101" width="18" height="24" rx="2" fill="#1F9A9C"/>
  <rect x="280" y="107" width="18" height="18" rx="2" fill="#1F9A9C"/>
  <rect x="308" y="100" width="18" height="25" rx="2" fill="#1F9A9C"/>
  <rect x="336" y="103" width="18" height="22" rx="2" fill="#1F9A9C"/>
</svg>
