  <text x="62" y="36" dominant-baseline="central" fill="#09544F" font-size="14" font-weight="bold">Automated analysis</text>
  <text x="276" y="36" dominant-baseline="central" fill="#555" font-size="12.5">Data quality, trends, and coverage in minutes</text>

  <!-- Item 2 -->
  <circle cx="30" cy="100" r="18" fill="#09544F"/>
