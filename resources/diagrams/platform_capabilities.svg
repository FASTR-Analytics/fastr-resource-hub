<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <!-- Gradients -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#09544F"/>
      <stop offset="100%" style="stop-color:#0C716B"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#21568C"/>
      <stop offset="100%" style="stop-color:#1A90C0"/>
    </linearGradient>
    <!-- Drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#ffffff"/>

  <!-- Connecting lines (behind circles) -->
  <g stroke="#CAE6E9" stroke-width="3" fill="none">
    <!-- Flow arrows -->
    <path d="M 170 250 Q 250 200 330 250" />
    <path d="M 330 250 Q 410 300 490 250" />
    <path d="M 490 250 Q 570 200 650 250" />
    <path d="M 650 250 Q 730 300 810 250" />
  </g>

  <!-- Arrow heads -->
  <g fill="#1F9A9C">
    <polygon points="325,245 335,250 325,255" />
    <polygon points="485,245 495,250 485,255" />
    <polygon points="645,245 655,250 645,255" />
    <polygon points="805,245 815,250 805,255" />
  </g>

  <!-- 1. Data Management -->
  <g transform="translate(90, 170)" filter="url(#shadow)">
    <circle cx="70" cy="80" r="65" fill="url(#greenGrad)"/>
    <!-- Database icon -->
    <g transform="translate(70, 80)" fill="white">
      <ellipse cx="0" cy="-25" rx="25" ry="10"/>
      <path d="M -25 -25 L -25 25 Q -25 35 0 35 Q 25 35 25 25 L 25 -25" fill="none" stroke="white" stroke-width="3"/>
      <ellipse cx="0" cy="25" rx="25" ry="10" fill="none" stroke="white" stroke-width="3"/>
      <line x1="-25" y1="0" x2="25" y2="0" stroke="white" stroke-width="2" opacity="0.6"/>
    </g>
  </g>
  <text x="160" y="340" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#09544F">Data</text>
  <text x="160" y="358" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#09544F">Management</text>

  <!-- 2. Data Analysis -->
  <g transform="translate(250, 170)" filter="url(#shadow)">
    <circle cx="70" cy="80" r="65" fill="#1F9A9C"/>
    <!-- Gear/cog icon -->
    <g transform="translate(70, 80)" fill="white">
      <circle cx="0" cy="0" r="12" fill="none" stroke="white" stroke-width="3"/>
      <g stroke="white" stroke-width="6" stroke-linecap="round">
        <line x1="0" y1="-28" x2="0" y2="-18"/>
        <line x1="0" y1="18" x2="0" y2="28"/>
        <line x1="-28" y1="0" x2="-18" y2="0"/>
        <line x1="18" y1="0" x2="28" y2="0"/>
        <line x1="-20" y1="-20" x2="-13" y2="-13"/>
        <line x1="13" y1="13" x2="20" y2="20"/>
        <line x1="-20" y1="20" x2="-13" y2="13"/>
        <line x1="13" y1="-13" x2="20" y2="-20"/>
      </g>
    </g>
  </g>
  <text x="320" y="340" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#09544F">Data</text>
  <text x="320" y="358" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#09544F">Analysis</text>

  <!-- 3. Visualization -->
  <g transform="translate(410, 170)" filter="url(#shadow)">
    <circle cx="70" cy="80" r="65" fill="url(#blueGrad)"/>
    <!-- Chart icon -->
    <g transform="translate(70, 80)" fill="white">
      <rect x="-28" y="5" width="12" height="23" rx="2"/>
      <rect x="-6" y="-15" width="12" height="43" rx="2"/>
      <rect x="16" y="-5" width="12" height="33" rx="2"/>
      <line x1="-30" y1="30" x2="30" y2="30" stroke="white" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
  <text x="480" y="350" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#09544F">Visualization</text>

  <!-- 4. Reporting -->
  <g transform="translate(570, 170)" filter="url(#shadow)">
    <circle cx="70" cy="80" r="65" fill="#D0CB17"/>
    <!-- Document icon -->
    <g transform="translate(70, 80)" fill="white">
      <path d="M -18 -30 L 10 -30 L 22 -18 L 22 30 L -18 30 Z" fill="white"/>
      <path d="M 10 -30 L 10 -18 L 22 -18" fill="none" stroke="#D0CB17" stroke-width="2"/>
      <line x1="-10" y1="-10" x2="14" y2="-10" stroke="#D0CB17" stroke-width="3" stroke-linecap="round"/>
      <line x1="-10" y1="0" x2="14" y2="0" stroke="#D0CB17" stroke-width="3" stroke-linecap="round"/>
      <line x1="-10" y1="10" x2="14" y2="10" stroke="#D0CB17" stroke-width="3" stroke-linecap="round"/>
      <line x1="-10" y1="20" x2="6" y2="20" stroke="#D0CB17" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
  <text x="640" y="350" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#09544F">Reporting</text>

  <!-- 5. Collaboration -->
  <g transform="translate(730, 170)" filter="url(#shadow)">
    <circle cx="70" cy="80" r="65" fill="#BD5091"/>
    <!-- People icon -->
    <g transform="translate(70, 80)" fill="white">
      <!-- Center person -->
      <circle cx="0" cy="-18" r="10"/>
      <path d="M -15 20 Q -15 5 0 5 Q 15 5 15 20" fill="white"/>
      <!-- Left person (smaller) -->
      <circle cx="-25" cy="-10" r="8" opacity="0.8"/>
      <path d="M -35 15 Q -35 3 -25 3 Q -15 3 -15 15" opacity="0.8"/>
      <!-- Right person (smaller) -->
      <circle cx="25" cy="-10" r="8" opacity="0.8"/>
      <path d="M 15 15 Q 15 3 25 3 Q 35 3 35 15" opacity="0.8"/>
    </g>
  </g>
  <text x="800" y="350" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#09544F">Collaboration</text>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#09544F">FASTR Analytics Platform</text>
  <text x="450" y="75" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#7f8c8d">Key Capabilities</text>

  <!-- Subtitle descriptions -->
  <g font-family="Inter, sans-serif" font-size="11" fill="#7f8c8d" text-anchor="middle">
    <text x="160" y="380">Import &amp; manage</text>
    <text x="160" y="394">facility data</text>

    <text x="320" y="380">Configure &amp; run</text>
    <text x="320" y="394">statistical modules</text>

    <text x="480" y="375">Charts, maps</text>
    <text x="480" y="389">&amp; tables</text>

    <text x="640" y="375">Export to PPTX</text>
    <text x="640" y="389">&amp; PDF</text>

    <text x="800" y="375">Project-based</text>
    <text x="800" y="389">team access</text>
  </g>

  <!-- Bottom workflow label -->
  <text x="450" y="460" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#95a5a6" font-style="italic">Data flows from import through analysis to shareable outputs</text>

</svg>