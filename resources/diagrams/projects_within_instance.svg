<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380">
  <defs>
    <style>
      .card { fill: #ffffff; stroke: #1F9A9C; stroke-width: 1.5; }
      .card-head { fill: #1F9A9C; }
      .card-head-alt { fill: #0C716B; }
      .t-title { font-family: Inter, -apple-system, sans-serif; font-weight: 700; fill: #fff; text-anchor: middle; font-size: 11px; }
      .t-ind { font-family: Inter, -apple-system, sans-serif; font-size: 9px; fill: #555; }
      .t-label { font-family: Inter, -apple-system, sans-serif; font-size: 9px; fill: #0C716B; font-weight: 600; }
    </style>
  </defs>

  <!-- Country platform container -->
  <rect x="20" y="20" width="660" height="340" rx="14" fill="#F8F9FA" stroke="#09544F" stroke-width="2.5"/>
  <rect x="20" y="20" width="220" height="32" rx="8" fill="#09544F"/>
  <text x="130" y="41" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#fff">Country platform</text>

  <!-- Subtitle -->
  <text x="350" y="80" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#666">Within the platform, each project groups a set of indicators for a specific purpose</text>

  <!-- ===== Project 1: Department ===== -->
  <g transform="translate(45, 100)">
    <rect class="card" width="190" height="220" rx="10"/>
    <rect class="card-head" width="190" height="30" rx="10"/>
    <rect class="card-head" x="0" y="20" width="190" height="10"/>
    <text class="t-title" x="95" y="22">Nutrition</text>

    <!-- Type label -->
    <rect x="55" y="38" width="80" height="18" rx="9" fill="#E8F4F3"/>
    <text class="t-label" x="95" y="50" text-anchor="middle">Department</text>

    <!-- Indicators -->
    <text class="t-ind" x="20" y="78">Indicators for this project:</text>
    <circle cx="26" cy="96" r="3" fill="#1F9A9C"/>
    <text class="t-ind" x="35" y="99">Stunting prevalence</text>
    <circle cx="26" cy="114" r="3" fill="#1F9A9C"/>
    <text class="t-ind" x="35" y="117">Wasting prevalence</text>
    <circle cx="26" cy="132" r="3" fill="#1F9A9C"/>
    <text class="t-ind" x="35" y="135">Vitamin A coverage</text>
    <circle cx="26" cy="150" r="3" fill="#1F9A9C"/>
    <text class="t-ind" x="35" y="153">Low birth weight</text>
    <circle cx="26" cy="168" r="3" fill="#CAE6E9"/>
    <text class="t-ind" x="35" y="171" fill="#999">...</text>

    <!-- Team note -->
    <rect x="10" y="188" width="170" height="22" rx="4" fill="#F0FAF9"/>
    <text font-family="Inter, sans-serif" font-size="8" fill="#0C716B" x="95" y="203" text-anchor="middle">Nutrition team works here</text>
  </g>

  <!-- ===== Project 2: Product ===== -->
  <g transform="translate(255, 100)">
    <rect class="card" width="190" height="220" rx="10" stroke="#0C716B"/>
    <rect class="card-head-alt" width="190" height="30" rx="10"/>
    <rect class="card-head-alt" x="0" y="20" width="190" height="10"/>
    <text class="t-title" x="95" y="22">Quarterly bulletin</text>

    <!-- Type label -->
    <rect x="60" y="38" width="70" height="18" rx="9" fill="#E8F4F3"/>
    <text class="t-label" x="95" y="50" text-anchor="middle">Product</text>

    <!-- Indicators -->
    <text class="t-ind" x="20" y="78">Indicators for this project:</text>
    <circle cx="26" cy="96" r="3" fill="#0C716B"/>
    <text class="t-ind" x="35" y="99">ANC4+ coverage</text>
    <circle cx="26" cy="114" r="3" fill="#0C716B"/>
    <text class="t-ind" x="35" y="117">Penta3 coverage</text>
    <circle cx="26" cy="132" r="3" fill="#0C716B"/>
    <text class="t-ind" x="35" y="135">Institutional deliveries</text>
    <circle cx="26" cy="150" r="3" fill="#0C716B"/>
    <text class="t-ind" x="35" y="153">OPD visits</text>
    <circle cx="26" cy="168" r="3" fill="#CAE6E9"/>
    <text class="t-ind" x="35" y="171" fill="#999">...</text>

    <!-- Team note -->
    <rect x="10" y="188" width="170" height="22" rx="4" fill="#F0FAF9"/>
    <text font-family="Inter, sans-serif" font-size="8" fill="#0C716B" x="95" y="203" text-anchor="middle">All programs, one report</text>
  </g>

  <!-- ===== Project 3: M&amp;E ===== -->
  <g transform="translate(465, 100)">
    <rect class="card" width="190" height="220" rx="10"/>
    <rect class="card-head" width="190" height="30" rx="10"/>
    <rect class="card-head" x="0" y="20" width="190" height="10"/>
    <text class="t-title" x="95" y="22">Monitoring &amp; evaluation</text>

    <!-- Type label -->
    <rect x="50" y="38" width="90" height="18" rx="9" fill="#E8F4F3"/>
    <text class="t-label" x="95" y="50" text-anchor="middle">Tracking tool</text>

    <!-- Indicators -->
    <text class="t-ind" x="20" y="78">Indicators for this project:</text>
    <circle cx="26" cy="96" r="3" fill="#1F9A9C"/>
    <text class="t-ind" x="35" y="99">Outcome indicators</text>
    <circle cx="26" cy="114" r="3" fill="#1F9A9C"/>
    <text class="t-ind" x="35" y="117">Process indicators</text>
    <circle cx="26" cy="132" r="3" fill="#1F9A9C"/>
    <text class="t-ind" x="35" y="135">Equity markers</text>
    <circle cx="26" cy="150" r="3" fill="#1F9A9C"/>
    <text class="t-ind" x="35" y="153">Coverage indicators</text>
    <circle cx="26" cy="168" r="3" fill="#CAE6E9"/>
    <text class="t-ind" x="35" y="171" fill="#999">...</text>

    <!-- Team note -->
    <rect x="10" y="188" width="170" height="22" rx="4" fill="#F0FAF9"/>
    <text font-family="Inter, sans-serif" font-size="8" fill="#0C716B" x="95" y="203" text-anchor="middle">M&amp;E team works here</text>
  </g>

</svg>
