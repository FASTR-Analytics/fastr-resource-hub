<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 40 740 300">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Instance container -->
  <rect x="40" y="50" width="480" height="280" rx="12" fill="#F8F9FA" stroke="#0C716B" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Instance label with Admin -->
  <rect x="40" y="50" width="140" height="28" rx="4" fill="#0C716B"/>
  <text x="110" y="69" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Country Instance</text>

  <!-- Admin badge at top right of instance border -->
  <g transform="translate(400, 52)">
    <rect x="0" y="0" width="115" height="24" rx="12" fill="#0C716B"/>
    <circle cx="16" cy="12" r="9" fill="#E8F4F3"/>
    <g transform="translate(16, 12)" fill="none" stroke="#0C716B" stroke-width="1.2">
      <circle cx="0" cy="-3" r="3"/>
      <path d="M -4 6 C -4 2 -2 0 0 0 C 2 0 4 2 4 6"/>
      <path d="M 3 -5 L 6 -5 L 6 -2" stroke-width="1.5"/>
    </g>
    <text x="68" y="16" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#ffffff">Admin</text>
  </g>

  <!-- Project 1 with Editor/Viewer badges -->
  <g transform="translate(60, 100)">
    <rect width="140" height="100" rx="8" fill="#ffffff" stroke="#1F9A9C" stroke-width="2" filter="url(#shadow)"/>
    <rect width="140" height="24" rx="8" fill="#1F9A9C"/>
    <rect x="0" y="16" width="140" height="8" fill="#1F9A9C"/>
    <text x="70" y="17" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#ffffff">Q4 2025 Analysis</text>
    <g transform="translate(70, 58)" fill="none" stroke="#0C716B" stroke-width="1.5">
      <path d="M -14 -10 L -14 10 L 14 10 L 14 -4 L 4 -4 L 2 -10 Z"/>
    </g>
    <!-- Editor badge -->
    <rect x="8" y="78" width="60" height="18" rx="9" fill="#1F9A9C"/>
    <text x="38" y="90" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="#ffffff">Editor</text>
    <!-- Viewer badge -->
    <rect x="72" y="78" width="60" height="18" rx="9" fill="#CAE6E9"/>
    <text x="102" y="90" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="#09544F">Viewer</text>
  </g>

  <!-- Project 2 with Editor/Viewer badges -->
  <g transform="translate(220, 100)">
    <rect width="140" height="100" rx="8" fill="#ffffff" stroke="#CAE6E9" stroke-width="2" filter="url(#shadow)"/>
    <rect width="140" height="24" rx="8" fill="#CAE6E9"/>
    <rect x="0" y="16" width="140" height="8" fill="#CAE6E9"/>
    <text x="70" y="17" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">Demo Project</text>
    <g transform="translate(70, 58)" fill="none" stroke="#0C716B" stroke-width="1.5">
      <circle cx="0" cy="0" r="12"/>
      <polygon points="-4,-6 -4,6 6,0" fill="#0C716B"/>
    </g>
    <!-- Editor badge -->
    <rect x="8" y="78" width="60" height="18" rx="9" fill="#1F9A9C"/>
    <text x="38" y="90" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="#ffffff">Editor</text>
    <!-- Viewer badge -->
    <rect x="72" y="78" width="60" height="18" rx="9" fill="#CAE6E9"/>
    <text x="102" y="90" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="#09544F">Viewer</text>
  </g>

  <!-- Project 3 with Editor/Viewer badges -->
  <g transform="translate(380, 100)">
    <rect width="140" height="100" rx="8" fill="#ffffff" stroke="#1F9A9C" stroke-width="2" filter="url(#shadow)"/>
    <rect width="140" height="24" rx="8" fill="#1F9A9C"/>
    <rect x="0" y="16" width="140" height="8" fill="#1F9A9C"/>
    <text x="70" y="17" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#ffffff">RMNCAH Team</text>
    <g transform="translate(70, 58)" fill="none" stroke="#0C716B" stroke-width="1.5">
      <circle cx="0" cy="-4" r="5"/>
      <path d="M -6 8 C -6 3 -4 0 0 0 C 4 0 6 3 6 8"/>
    </g>
    <!-- Editor badge -->
    <rect x="8" y="78" width="60" height="18" rx="9" fill="#1F9A9C"/>
    <text x="38" y="90" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="#ffffff">Editor</text>
    <!-- Viewer badge -->
    <rect x="72" y="78" width="60" height="18" rx="9" fill="#CAE6E9"/>
    <text x="102" y="90" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="#09544F">Viewer</text>
  </g>

  <!-- Project 4 - Archive -->
  <g transform="translate(140, 220)">
    <rect width="140" height="90" rx="8" fill="#ffffff" stroke="#CAE6E9" stroke-width="2" filter="url(#shadow)"/>
    <rect width="140" height="24" rx="8" fill="#CAE6E9"/>
    <rect x="0" y="16" width="140" height="8" fill="#CAE6E9"/>
    <text x="70" y="17" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">Q3 2025 Archive</text>
    <g transform="translate(70, 54)" fill="none" stroke="#0C716B" stroke-width="1.5">
      <rect x="-12" y="-8" width="24" height="16" rx="2"/>
      <line x1="-12" y1="-2" x2="12" y2="-2"/>
      <line x1="-4" y1="4" x2="4" y2="4"/>
    </g>
  </g>

  <!-- RIGHT SIDE: Legend boxes -->

  <!-- Instance Level box -->
  <g transform="translate(570, 50)">
    <rect x="0" y="0" width="190" height="80" rx="8" fill="#E8F4F3" stroke="#0C716B" stroke-width="1.5"/>
    <text x="95" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#0C716B">Instance Level</text>
    <line x1="15" y1="32" x2="175" y2="32" stroke="#0C716B" stroke-width="0.5"/>
    <text x="95" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">Admin manages users, data,</text>
    <text x="95" y="62" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">and all projects in instance</text>
  </g>

  <!-- Horizontal line from Instance Level to instance border -->
  <line x1="520" y1="90" x2="570" y2="90" stroke="#0C716B" stroke-width="1.5"/>

  <!-- Project Level box -->
  <g transform="translate(570, 150)">
    <rect x="0" y="0" width="190" height="80" rx="8" fill="#F0FAF9" stroke="#1F9A9C" stroke-width="1.5"/>
    <text x="95" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1F9A9C">Project Level</text>
    <line x1="15" y1="32" x2="175" y2="32" stroke="#1F9A9C" stroke-width="0.5"/>
    <text x="95" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">Editors and Viewers are</text>
    <text x="95" y="62" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">assigned per project</text>
  </g>

  <!-- Line from Project Level into projects -->
  <line x1="520" y1="190" x2="570" y2="190" stroke="#1F9A9C" stroke-width="1.5"/>

</svg>
