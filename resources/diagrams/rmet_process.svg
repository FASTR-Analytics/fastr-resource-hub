<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 340">
  <!-- Background -->
  <rect width="1400" height="340" fill="white"/>

  <!-- Dashed border around phases area - taller to not touch icons -->
  <rect x="20" y="20" width="1140" height="300" fill="none" stroke="#09544F" stroke-width="1.5" stroke-dasharray="8,4" rx="4"/>

  <!-- Bottom text inside border -->
  <text x="580" y="305" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-style="italic" fill="#09544F">Continuous Stakeholder Engagement; Optimization; Institutionalization; Data Use</text>

  <!-- Phase 1 -->
  <!-- Lucide folder-open icon - positioned above circle -->
  <g transform="translate(122, 40) scale(1.5)" stroke="#09544F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2" />
  </g>
  <!-- Circle 1 -->
  <circle cx="140" cy="130" r="40" fill="#1F9A9C"/>
  <text x="140" y="144" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="600" fill="white">1</text>
  <!-- Arrow box 1 - taller -->
  <path d="M50 182 L200 182 L220 222 L200 262 L50 262 Z" fill="#e5e5e5"/>
  <text x="130" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#333">Phase 1: Assess</text>
  <text x="130" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#333">Objectives/Use Cases</text>
  <text x="130" y="242" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#333">and Landscape</text>

  <!-- Chevron 1 - centered between circle 1 (140) and circle 2 (340) = 240 -->
  <path d="M233 120 L248 130 L233 140" fill="none" stroke="#ccc" stroke-width="2.5"/>

  <!-- Phase 2 -->
  <!-- Lucide target icon -->
  <g transform="translate(322, 42) scale(1.5)" stroke="#09544F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="12" cy="12" r="10" />
    <circle cx="12" cy="12" r="6" />
    <circle cx="12" cy="12" r="2" />
  </g>
  <!-- Circle 2 -->
  <circle cx="340" cy="130" r="40" fill="#1F9A9C"/>
  <text x="340" y="144" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="600" fill="white">2</text>
  <!-- Arrow box 2 - taller -->
  <path d="M250 182 L400 182 L420 222 L400 262 L250 262 L270 222 Z" fill="#e5e5e5"/>
  <text x="335" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#333">Phase 2: Define Scope</text>
  <text x="335" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#333">to Meet Use Cases</text>

  <!-- Chevron 2 - centered between circle 2 (340) and circle 3 (540) = 440 -->
  <path d="M433 120 L448 130 L433 140" fill="none" stroke="#ccc" stroke-width="2.5"/>

  <!-- Phase 3 -->
  <!-- Lucide clipboard-list icon -->
  <g transform="translate(522, 40) scale(1.5)" stroke="#09544F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
    <path d="M12 11h4" />
    <path d="M12 16h4" />
    <path d="M8 11h.01" />
    <path d="M8 16h.01" />
  </g>
  <!-- Circle 3 -->
  <circle cx="540" cy="130" r="40" fill="#1F9A9C"/>
  <text x="540" y="144" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="600" fill="white">3</text>
  <!-- Arrow box 3 - taller -->
  <path d="M450 182 L600 182 L620 222 L600 262 L450 262 L470 222 Z" fill="#e5e5e5"/>
  <text x="535" y="206" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#333">Phase 3: Define Data</text>
  <text x="535" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#333">Elements to Meet</text>
  <text x="535" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#333">Use Cases</text>

  <!-- Chevron 3 - centered between circle 3 (540) and circle 4 (740) = 640 -->
  <path d="M633 120 L648 130 L633 140" fill="none" stroke="#ccc" stroke-width="2.5"/>

  <!-- Phase 4 -->
  <!-- Lucide settings icon (gear) -->
  <g transform="translate(722, 42) scale(1.5)" stroke="#09544F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
    <circle cx="12" cy="12" r="3" />
  </g>
  <!-- Circle 4 -->
  <circle cx="740" cy="130" r="40" fill="#1F9A9C"/>
  <text x="740" y="144" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="600" fill="white">4</text>
  <!-- Arrow box 4 - taller -->
  <path d="M650 182 L800 182 L820 222 L800 262 L650 262 L670 222 Z" fill="#e5e5e5"/>
  <text x="735" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#333">Phase 4: Complete</text>
  <text x="735" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#333">Exercise</text>

  <!-- Chevron 4 - centered between circle 4 (740) and circle 5 (940) = 840 -->
  <path d="M833 120 L848 130 L833 140" fill="none" stroke="#ccc" stroke-width="2.5"/>

  <!-- Phase 5 -->
  <!-- Combined users + speech bubble icon -->
  <g transform="translate(912, 42)" stroke="#09544F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Users icon (scaled) -->
    <g transform="scale(1.5)">
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
      <circle cx="9" cy="7" r="4" />
      <path d="M16 3.128a4 4 0 0 1 0 7.744" />
      <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
    </g>
    <!-- Speech bubble (positioned top right) -->
    <g transform="translate(32, -8) scale(1.2)">
      <rect x="0" y="0" width="16" height="12" rx="2" fill="white" stroke="#09544F" stroke-width="2"/>
      <path d="M4 12 L6 16 L8 12" fill="white" stroke="#09544F" stroke-width="2"/>
      <!-- Dots inside bubble -->
      <circle cx="5" cy="6" r="1" fill="#09544F" stroke="none"/>
      <circle cx="8" cy="6" r="1" fill="#09544F" stroke="none"/>
      <circle cx="11" cy="6" r="1" fill="#09544F" stroke="none"/>
    </g>
  </g>
  <!-- Circle 5 -->
  <circle cx="940" cy="130" r="40" fill="#1F9A9C"/>
  <text x="940" y="144" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="600" fill="white">5</text>
  <!-- Arrow box 5 - taller -->
  <path d="M850 182 L1000 182 L1020 222 L1000 262 L850 262 L870 222 Z" fill="#e5e5e5"/>
  <text x="935" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#333">Phase 5: Disseminate,</text>
  <text x="935" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#333">and data use</text>

  <!-- Goal box on right - same height as dashed box, light yellow background -->
  <g transform="translate(1185, 20)">
    <rect x="0" y="0" width="195" height="300" fill="#fdf6e3" stroke="#ccc" stroke-width="1"/>
    <text x="15" y="35" font-family="system-ui, sans-serif" font-size="15" fill="#09544F"><tspan font-weight="700" font-style="italic">Goal</tspan><tspan fill="#333">: An</tspan></text>
    <text x="15" y="62" font-family="system-ui, sans-serif" font-size="15" fill="#333">institutionalized</text>
    <text x="15" y="89" font-family="system-ui, sans-serif" font-size="15" fill="#333">'needs-based'</text>
    <text x="15" y="116" font-family="system-ui, sans-serif" font-size="15" fill="#333">health resource</text>
    <text x="15" y="143" font-family="system-ui, sans-serif" font-size="15" fill="#333">tracking system</text>
    <text x="15" y="170" font-family="system-ui, sans-serif" font-size="15" fill="#333">that generates</text>
    <text x="15" y="197" font-family="system-ui, sans-serif" font-size="15" fill="#333">the evidence</text>
    <text x="15" y="224" font-family="system-ui, sans-serif" font-size="15" fill="#333">decision-makers</text>
    <text x="15" y="251" font-family="system-ui, sans-serif" font-size="15" fill="#333">require, at the</text>
    <text x="15" y="278" font-family="system-ui, sans-serif" font-size="15" fill="#333">right time</text>
  </g>

</svg>
