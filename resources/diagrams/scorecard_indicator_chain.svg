"8" fill="#0A544F"/><rect x="440" y="34" width="150" height="10" fill="#0A544F"/><text x="515.0" y="36" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">RESULTS PACKAGE</text><text x="515.0" y="66" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2A2E">Indicator values</text><text x="515.0" y="82" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1F2A2E">evaluates every formula</text><text x="515.0" y="112" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5B6B70">step 4</text><line x1="595" y1="70" x2="625" y2="70" stroke="#0A544F" stroke-width="2"/><polyline points="616,65 625,70 616,75" fill="none" stroke="#0A544F" stroke-width="2"/><rect x="630" y="20" width="120" height="100" rx="8" fill="#FFFFFF" stroke="#0C716B" stroke-width="2"/><rect x="630" y="20" width="120" height="24" rx="8" fill="#0C716B"/><rect x="630" y="34" width="120" height="10" fill="#0C716B"/><text x="690" y="36" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">SCORECARD</text><rect x="640" y="50" width="100" height="15" rx="3" fill="#2E9E5B" opacity="0.85"/><text x="648" y="61" text-anchor="start" font-size="9.5" font-weight="600" fill="#FFFFFF">Kano</text><text x="732" y="61" text-anchor="end" font-size="9.5" font-weight="700" fill="#FFFFFF">84 %</text><rect x="640" y="68" width="100" height="15" rx="3" fill="#E8B400" opacity="0.85"/><text x="648" y="79" text-anchor="start" font-size="9.5" font-weight="600" fill="#FFFFFF">Lagos</text><text x="732" y="79" text-anchor="end" font-size="9.5" font-weight="700" fill="#FFFFFF">73 %</text><rect x="640" y="86" width="100" height="15" rx="3" fill="#C53030" opacity="0.85"/><text x="648" y="97" text-anchor="start" font-size="9.5" font-weight="600" fill="#FFFFFF">Yobe</text><text x="732" y="97" text-anchor="end" font-size="9.5" font-weight="700" fill="#FFFFFF">65 %</text><text x="690" y="112" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5B6B70">step 5 · one colored cell per state</text><text x="380" y="142" text-anchor="middle" font-size="10" font-weight="400" fill="#5B6B70">The rule (format, direction, cutoffs) lives on the calculated indicator. Every scorecard that shows it colors it the same way.</text></svg>