<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect x="10" y="12" width="300" height="150" rx="10" fill="#E8F4F3" stroke="#0A544F" stroke-width="1.5"/><text x="160" y="32" text-anchor="middle" font-size="12" font-weight="700" fill="#0A544F">THE INSTANCE</text><text x="160" y="46" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5B6B70">shared by everyone</text><rect x="25" y="58" width="130" height="88" rx="6" fill="#FFFFFF" stroke="#501E50" stroke-width="1.5"/><text x="90" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#501E50">Indicators</text><text x="90" y="92" text-anchor="middle" font-size="9.5" font-weight="400" fill="#1F2A2E">data elements, sums,</text><text x="90" y="104" text-anchor="middle" font-size="9.5" font-weight="400" fill="#1F2A2E">formulas and their rules</text><text x="90" y="124" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5B6B70">steps 1 and 3</text><rect x="165" y="58" width="130" height="88" rx="6" fill="#FFFFFF" stroke="#21568C" stroke-width="1.5"/><text x="230" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#21568C">Data</text><text x="230" y="92" text-anchor="middle" font-size="9.5" font-weight="400" fill="#1F2A2E">monthly counts copied</text><text x="230" y="104" text-anchor="middle" font-size="9.5" font-weight="400" fill="#1F2A2E">from DHIS2</text><text x="230" y="124" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5B6B70">step 2</text><line x1="315" y1="87" x2="355" y2="87" stroke="#0A544F" stroke-width="2"/><polyline points="346,82 355,87 346,92" fill="none" stroke="#0A544F" stroke-width="2"/><text x="335" y="76" text-anchor="middle" font-size="9" font-weight="400" fill="#5B6B70">generate</text><rect x="360" y="40" width="150" height="94" rx="10" fill="#FFFFFF" stroke="#0A544F" stroke-width="2"/><text x="435" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#0A544F">RESULTS PACKAGE</text><text x="435" y="78" text-anchor="middle" font-size="9.5" font-weight="400" fill="#1F2A2E">a frozen copy of the data</text><text x="435" y="90" text-anchor="middle" font-size="9.5" font-weight="400" fill="#1F2A2E">and the rules at that moment,</text><text x="435" y="102" text-anchor="middle" font-size="9.5" font-weight="400" fill="#1F2A2E">with every formula evaluated</text><text x="435" y="122" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5B6B70">step 4</text><line x1="515" y1="87" x2="555" y2="87" stroke="#0A544F" stroke-width="2"/><polyline points="546,82 555,87 546,92" fill="none" stroke="#0A544F" stroke-width="2"/><text x="535" y="76" text-anchor="middle" font-size="9" font-weight="400" fill="#5B6B70">attach or pin</text><rect x="560" y="12" width="190" height="150" rx="10" fill="#FFFFFF" stroke="#0C716B" stroke-width="1.5"/><text x="655" y="32" text-anchor="middle" font-size="12" font-weight="700" fill="#0C716B">YOUR PROJECT</text><text x="655" y="46" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5B6B70">reads one package</text><rect x="575" y="58" width="160" height="88" rx="6" fill="#E8F4F3" stroke="#0C716B" stroke-width="1.5"/><text x="655" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#0C716B">The scorecard table</text><text x="655" y="92" text-anchor="middle" font-size="9.5" font-weight="400" fill="#1F2A2E">shows the package it is on;</text><text x="655" y="104" text-anchor="middle" font-size="9.5" font-weight="400" fill="#1F2A2E">new columns and new colors</text><text x="655" y="116" text-anchor="middle" font-size="9.5" font-weight="400" fill="#1F2A2E">arrive with the next package</text><text x="655" y="136" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5B6B70">step 5</text><text x="380" y="180" text-anchor="middle" font-size="10" font-weight="400" fill="#5B6B70">A project left on an old package keeps showing old numbers. Pin the package and let projects follow it.</text></svg>