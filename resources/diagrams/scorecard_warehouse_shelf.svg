<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" font-family="Inter, sans-serif">
  <!-- Warehouse zone -->
  <rect x="8" y="8" width="330" height="174" rx="12" fill="#E8F4F3" stroke="#0C716B" stroke-width="1.5"/>
  <text x="173" y="30" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="700" fill="#09544F">THE INSTANCE — the warehouse</text>
  <text x="173" y="48" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#436b68">shared by everyone</text>

  <rect x="28" y="62" width="290" height="48" rx="8" fill="#FFFFFF" stroke="#1F9A9C" stroke-width="1.2"/>
  <text x="173" y="79" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="700" fill="#09544F">Indicators and rules</text>
  <text x="173" y="96" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#436b68">steps 1, 2, 3</text>

  <rect x="28" y="120" width="290" height="48" rx="8" fill="#FFFFFF" stroke="#1F9A9C" stroke-width="1.2"/>
  <text x="173" y="137" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="700" fill="#09544F">Numbers downloaded from DHIS2</text>
  <text x="173" y="154" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#436b68">step 4</text>

  <!-- Update data arrow -->
  <polyline points="346,95 420,95" fill="none" stroke="#09544F" stroke-width="4"/>
  <polyline points="409,84 422,95 409,106" fill="none" stroke="#09544F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="384" y="72" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="700" fill="#09544F">Update data</text>
  <text x="384" y="118" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#436b68">step 5</text>

  <!-- Project zone -->
  <rect x="430" y="8" width="322" height="174" rx="12" fill="#CAE6E9" stroke="#0C716B" stroke-width="1.5"/>
  <text x="591" y="30" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="700" fill="#09544F">YOUR PROJECT — your shelf</text>
  <text x="591" y="48" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#436b68">works on its own copy</text>

  <rect x="450" y="62" width="282" height="48" rx="8" fill="#FFFFFF" stroke="#1F9A9C" stroke-width="1.2"/>
  <text x="591" y="79" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="700" fill="#09544F">Your copy of the data and rules</text>
  <text x="591" y="96" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#436b68">refreshed only when you click</text>

  <rect x="450" y="120" width="282" height="48" rx="8" fill="#0C716B"/>
  <text x="591" y="137" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="700" fill="#FFFFFF">The scorecard</text>
  <text x="591" y="154" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#CAE6E9">re-runs after every update</text>
</svg>
