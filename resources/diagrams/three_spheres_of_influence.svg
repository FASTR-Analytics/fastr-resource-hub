<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">

  <!-- Outer sphere: Concern -->
  <circle cx="200" cy="200" r="180" fill="#F5F0F0" stroke="#E0D0D0" stroke-width="1.5"/>
  <text x="200" y="45" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#999">Sphere of Concern</text>
  <text x="200" y="60" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#aaa">Policy, financing, population</text>

  <!-- Middle sphere: Influence -->
  <circle cx="200" cy="210" r="125" fill="#EAF2F0" stroke="#CAE6E9" stroke-width="1.5"/>
  <text x="200" y="110" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#577">Sphere of Influence</text>
  <text x="200" y="125" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#899">Partners, logistics, advocacy</text>

  <!-- Inner sphere: Control -->
  <circle cx="200" cy="220" r="70" fill="#E8F4F3" stroke="#0C716B" stroke-width="2"/>
  <text x="200" y="210" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#09544F">Sphere of</text>
  <text x="200" y="226" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#09544F">Control</text>
  <text x="200" y="246" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#555">Direct actions</text>
  <text x="200" y="258" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#555">your team can take</text>

  <!-- Arrow pointing inward -->
  <text x="200" y="385" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#999" font-style="italic">Focus first on what you can control</text>
</svg>
