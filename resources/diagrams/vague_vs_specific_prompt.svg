<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340">

  <!-- Left card: Vague -->
  <g transform="translate(20, 15)">
    <rect x="0" y="0" width="200" height="270" rx="10" fill="#FDE8E8"/>
    <circle cx="100" cy="35" r="20" fill="#C53030"/>
    <text x="100" y="35" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#fff" dominant-baseline="central">&#x2717;</text>
    <text x="100" y="75" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#C53030">Vague</text>
    <line x1="20" y1="90" x2="180" y2="90" stroke="#F5C6C6" stroke-width="1.5"/>
    <text x="100" y="115" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#555" font-style="italic">"Analyze the data"</text>
    <line x1="20" y1="135" x2="180" y2="135" stroke="#F5C6C6" stroke-width="1"/>
    <text x="100" y="160" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#777">What? — not said</text>
    <text x="100" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#777">Where? — not said</text>
    <text x="100" y="200" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#777">When? — not said</text>
    <text x="100" y="220" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#777">For whom? — not said</text>
    <line x1="20" y1="237" x2="180" y2="237" stroke="#F5C6C6" stroke-width="1"/>
    <text x="100" y="258" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="600" fill="#C53030">The AI guesses</text>
  </g>

  <!-- Arrow -->
  <polyline points="235,150 255,160 235,170" fill="none" stroke="#09544F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right card: Specific -->
  <g transform="translate(270, 15)">
    <rect x="0" y="0" width="410" height="270" rx="10" fill="#E8F4F3"/>
    <circle cx="205" cy="35" r="20" fill="#09544F"/>
    <text x="205" y="35" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#fff" dominant-baseline="central">&#x2714;</text>
    <text x="205" y="75" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#09544F">Specific</text>
    <line x1="25" y1="90" x2="385" y2="90" stroke="#CAE6E9" stroke-width="1.5"/>
    <text x="205" y="115" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#555" font-style="italic">"Show ANC1 trends by region over the last</text>
    <text x="205" y="130" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#555" font-style="italic">12 months. Make a slide for my director."</text>
    <line x1="25" y1="148" x2="385" y2="148" stroke="#CAE6E9" stroke-width="1"/>
    <text x="30" y="173" font-family="Inter, sans-serif" font-size="9.5" font-weight="600" fill="#09544F">What?</text>
    <text x="80" y="173" font-family="Inter, sans-serif" font-size="9.5" fill="#555">ANC1 trends</text>
    <text x="30" y="193" font-family="Inter, sans-serif" font-size="9.5" font-weight="600" fill="#09544F">Where?</text>
    <text x="80" y="193" font-family="Inter, sans-serif" font-size="9.5" fill="#555">by region</text>
    <text x="30" y="213" font-family="Inter, sans-serif" font-size="9.5" font-weight="600" fill="#09544F">When?</text>
    <text x="80" y="213" font-family="Inter, sans-serif" font-size="9.5" fill="#555">last 12 months</text>
    <text x="30" y="233" font-family="Inter, sans-serif" font-size="9.5" font-weight="600" fill="#09544F">For whom?</text>
    <text x="100" y="233" font-family="Inter, sans-serif" font-size="9.5" fill="#555">my director → a summary slide</text>
    <line x1="25" y1="250" x2="385" y2="250" stroke="#CAE6E9" stroke-width="1"/>
    <text x="205" y="270" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="600" fill="#09544F">The AI gives you exactly what you need</text>
  </g>


</svg>
