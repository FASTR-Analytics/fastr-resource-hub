<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380">
  <style>
    .chart-title { font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #09544F; }
    .axis-label { font-family: Inter, Arial, sans-serif; font-size: 9px; fill: #888; }
    .axis-title { font-family: Inter, Arial, sans-serif; font-size: 10px; fill: #666; }
    .caption { font-family: Inter, Arial, sans-serif; font-size: 11px; fill: #555; }
    .caption-bold { font-family: Inter, Arial, sans-serif; font-size: 11px; fill: #09544F; font-weight: 600; }
    .outlier-label { font-family: Inter, Arial, sans-serif; font-size: 9px; fill: #c0392b; font-weight: 600; }
    .arrow-label { font-family: Inter, Arial, sans-serif; font-size: 24px; fill: #1F9A9C; font-weight: 700; }
  </style>

  <!-- LEFT: Before adjustment -->
  <g transform="translate(20, 25)">
    <text x="175" y="0" text-anchor="middle" class="chart-title">Before adjustment</text>

    <!-- Y-axis -->
    <text x="8" y="140" text-anchor="middle" transform="rotate(-90, 8, 140)" class="axis-title">Reported values</text>
    <line x1="40" y1="25" x2="40" y2="250" stroke="#ddd" stroke-width="1"/>
    <text x="35" y="30" text-anchor="end" class="axis-label">5000</text>
    <text x="35" y="80" text-anchor="end" class="axis-label">4000</text>
    <text x="35" y="130" text-anchor="end" class="axis-label">3000</text>
    <text x="35" y="180" text-anchor="end" class="axis-label">2000</text>
    <text x="35" y="230" text-anchor="end" class="axis-label">1000</text>
    <text x="35" y="252" text-anchor="end" class="axis-label">0</text>

    <!-- Grid lines -->
    <line x1="40" y1="80" x2="350" y2="80" stroke="#f2f2f2" stroke-width="1"/>
    <line x1="40" y1="130" x2="350" y2="130" stroke="#f2f2f2" stroke-width="1"/>
    <line x1="40" y1="180" x2="350" y2="180" stroke="#f2f2f2" stroke-width="1"/>
    <line x1="40" y1="230" x2="350" y2="230" stroke="#f2f2f2" stroke-width="1"/>

    <!-- X-axis -->
    <line x1="40" y1="250" x2="350" y2="250" stroke="#ddd" stroke-width="1"/>
    <text x="72" y="265" text-anchor="middle" class="axis-label">Jan</text>
    <text x="114" y="265" text-anchor="middle" class="axis-label">Feb</text>
    <text x="156" y="265" text-anchor="middle" class="axis-label">Mar</text>
    <text x="198" y="265" text-anchor="middle" class="axis-label">Apr</text>
    <text x="240" y="265" text-anchor="middle" class="axis-label">May</text>
    <text x="282" y="265" text-anchor="middle" class="axis-label">Jun</text>
    <text x="324" y="265" text-anchor="middle" class="axis-label">Jul</text>

    <!-- Normal trend line (values ~800-1200, y = 250 - value/5000*225) -->
    <!-- 800→214, 900→210, 1000→205, 1100→201, 950→207, 1050→203, 1100→201 -->
    <polyline points="72,214 114,210 156,205 198,201 240,207 282,203 324,201"
              fill="none" stroke="#1F9A9C" stroke-width="2.5" stroke-dasharray="4,3" opacity="0.4"/>

    <!-- Actual line with outlier spike at Apr (value=4800→35) -->
    <polyline points="72,214 114,210 156,205 198,35 240,207 282,203 324,201"
              fill="none" stroke="#1F9A9C" stroke-width="2.5"/>
    <circle cx="72" cy="214" r="3.5" fill="#1F9A9C"/>
    <circle cx="114" cy="210" r="3.5" fill="#1F9A9C"/>
    <circle cx="156" cy="205" r="3.5" fill="#1F9A9C"/>
    <circle cx="240" cy="207" r="3.5" fill="#1F9A9C"/>
    <circle cx="282" cy="203" r="3.5" fill="#1F9A9C"/>
    <circle cx="324" cy="201" r="3.5" fill="#1F9A9C"/>

    <!-- Outlier point with highlight -->
    <circle cx="198" cy="35" r="10" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="3,2"/>
    <circle cx="198" cy="35" r="4" fill="#c0392b"/>
    <text x="212" y="30" class="outlier-label">Outlier</text>
    <text x="212" y="42" class="outlier-label">(data entry error)</text>

    <!-- Caption -->
    <text x="195" y="295" text-anchor="middle" class="caption">The spike compresses the Y-axis,</text>
    <text x="195" y="310" text-anchor="middle" class="caption">hiding meaningful variation in the data.</text>
  </g>

  <!-- Arrow -->
  <text x="440" y="155" text-anchor="middle" class="arrow-label">→</text>

  <!-- RIGHT: After adjustment -->
  <g transform="translate(480, 25)">
    <text x="175" y="0" text-anchor="middle" class="chart-title">After adjustment</text>

    <!-- Y-axis -->
    <text x="8" y="140" text-anchor="middle" transform="rotate(-90, 8, 140)" class="axis-title">Reported values</text>
    <line x1="40" y1="25" x2="40" y2="250" stroke="#ddd" stroke-width="1"/>
    <text x="35" y="30" text-anchor="end" class="axis-label">1400</text>
    <text x="35" y="80" text-anchor="end" class="axis-label">1200</text>
    <text x="35" y="130" text-anchor="end" class="axis-label">1000</text>
    <text x="35" y="180" text-anchor="end" class="axis-label">800</text>
    <text x="35" y="230" text-anchor="end" class="axis-label">600</text>
    <text x="35" y="252" text-anchor="end" class="axis-label">400</text>

    <!-- Grid lines -->
    <line x1="40" y1="80" x2="350" y2="80" stroke="#f2f2f2" stroke-width="1"/>
    <line x1="40" y1="130" x2="350" y2="130" stroke="#f2f2f2" stroke-width="1"/>
    <line x1="40" y1="180" x2="350" y2="180" stroke="#f2f2f2" stroke-width="1"/>
    <line x1="40" y1="230" x2="350" y2="230" stroke="#f2f2f2" stroke-width="1"/>

    <!-- X-axis -->
    <line x1="40" y1="250" x2="350" y2="250" stroke="#ddd" stroke-width="1"/>
    <text x="72" y="265" text-anchor="middle" class="axis-label">Jan</text>
    <text x="114" y="265" text-anchor="middle" class="axis-label">Feb</text>
    <text x="156" y="265" text-anchor="middle" class="axis-label">Mar</text>
    <text x="198" y="265" text-anchor="middle" class="axis-label">Apr</text>
    <text x="240" y="265" text-anchor="middle" class="axis-label">May</text>
    <text x="282" y="265" text-anchor="middle" class="axis-label">Jun</text>
    <text x="324" y="265" text-anchor="middle" class="axis-label">Jul</text>

    <!-- Adjusted line: outlier replaced with rolling average (~1000→130) -->
    <!-- 800→180, 900→155, 1000→130, 1000→130, 950→141, 1050→119, 1100→107 -->
    <polyline points="72,180 114,155 156,130 198,130 240,141 282,119 324,107"
              fill="none" stroke="#1F9A9C" stroke-width="2.5"/>
    <circle cx="72" cy="180" r="3.5" fill="#1F9A9C"/>
    <circle cx="114" cy="155" r="3.5" fill="#1F9A9C"/>
    <circle cx="156" cy="130" r="3.5" fill="#1F9A9C"/>
    <circle cx="240" cy="141" r="3.5" fill="#1F9A9C"/>
    <circle cx="282" cy="119" r="3.5" fill="#1F9A9C"/>
    <circle cx="324" cy="107" r="3.5" fill="#1F9A9C"/>

    <!-- Adjusted point (hollow circle showing replacement) -->
    <circle cx="198" cy="130" r="5" fill="white" stroke="#1F9A9C" stroke-width="2"/>

    <!-- Caption -->
    <text x="195" y="295" text-anchor="middle" class="caption">Outlier replaced with rolling average.</text>
    <text x="195" y="310" text-anchor="middle" class="caption-bold">Underlying trend preserved.</text>
  </g>

  <!-- Bottom summary -->
  <rect x="150" y="345" width="600" height="28" rx="6" fill="#E8F4F3"/>
  <text x="450" y="364" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#09544F" font-weight="600">Adjusting outliers improves the reliability of downstream utilization and coverage estimates</text>
</svg>
