<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" font-family="'Segoe UI', Arial, sans-serif">

  <!-- Large background arrow -->
  <polygon points="40,60 780,60 880,160 780,260 40,260 40,60" fill="#0C716B" opacity="0.12"/>
  <polygon points="780,30 960,160 780,290 780,30" fill="#0C716B" opacity="0.12"/>

  <!-- Step 1 -->
  <rect x="30" y="70" width="210" height="180" rx="16" fill="#ffffff" stroke="#0C716B" stroke-width="2.5"/>
  <circle cx="135" cy="100" r="16" fill="#09544F"/>
  <text x="135" y="106" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">1</text>
  <text x="135" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#09544F">Pre-Workshop</text>
  <text x="135" y="149" text-anchor="middle" font-size="14" font-weight="bold" fill="#09544F">Webinar</text>
  <line x1="85" y1="158" x2="185" y2="158" stroke="#CAE6E9" stroke-width="1.5"/>
  <text x="135" y="176" text-anchor="middle" font-size="11" fill="#444">Participants intros,</text>
  <text x="135" y="191" text-anchor="middle" font-size="11" fill="#444">overview of the FASTR</text>
  <text x="135" y="206" text-anchor="middle" font-size="11" fill="#444">Initiative and methods.</text>

  <!-- Connector arrow 1→2 -->
  <polygon points="247,155 265,145 265,165" fill="#1F9A9C"/>
  <line x1="240" y1="155" x2="265" y2="155" stroke="#1F9A9C" stroke-width="2"/>

  <!-- Step 2 -->
  <rect x="272" y="70" width="210" height="180" rx="16" fill="#ffffff" stroke="#0C716B" stroke-width="2.5"/>
  <circle cx="377" cy="100" r="16" fill="#0C716B"/>
  <text x="377" y="106" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">2</text>
  <text x="377" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#09544F">In-Person</text>
  <text x="377" y="149" text-anchor="middle" font-size="14" font-weight="bold" fill="#09544F">Workshop</text>
  <line x1="327" y1="158" x2="427" y2="158" stroke="#CAE6E9" stroke-width="1.5"/>
  <text x="377" y="176" text-anchor="middle" font-size="11" fill="#444">Practical analysis,</text>
  <text x="377" y="191" text-anchor="middle" font-size="11" fill="#444">hands-on,</text>
  <text x="377" y="206" text-anchor="middle" font-size="11" fill="#444">peer coaching.</text>

  <!-- Connector arrow 2→3 -->
  <polygon points="489,155 507,145 507,165" fill="#1F9A9C"/>
  <line x1="482" y1="155" x2="507" y2="155" stroke="#1F9A9C" stroke-width="2"/>

  <!-- Step 3 -->
  <rect x="514" y="70" width="210" height="180" rx="16" fill="#ffffff" stroke="#0C716B" stroke-width="2.5"/>
  <circle cx="619" cy="100" r="16" fill="#1F9A9C"/>
  <text x="619" y="106" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">3</text>
  <text x="619" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#09544F">Post Workshop</text>
  <text x="619" y="149" text-anchor="middle" font-size="14" font-weight="bold" fill="#09544F">Follow-Up Support</text>
  <line x1="569" y1="158" x2="669" y2="158" stroke="#CAE6E9" stroke-width="1.5"/>
  <text x="619" y="176" text-anchor="middle" font-size="11" fill="#444">Office hours, action</text>
  <text x="619" y="191" text-anchor="middle" font-size="11" fill="#444">planning, technical</text>
  <text x="619" y="206" text-anchor="middle" font-size="11" fill="#444">support.</text>

  <!-- Connector arrow 3→4 -->
  <polygon points="731,155 749,145 749,165" fill="#1F9A9C"/>
  <line x1="724" y1="155" x2="749" y2="155" stroke="#1F9A9C" stroke-width="2"/>

  <!-- Step 4 -->
  <rect x="756" y="70" width="195" height="180" rx="16" fill="#ffffff" stroke="#0C716B" stroke-width="2.5"/>
  <circle cx="853" cy="100" r="16" fill="#1A90C0"/>
  <text x="853" y="106" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">4</text>
  <text x="853" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#09544F">Cross-Country</text>
  <text x="853" y="149" text-anchor="middle" font-size="14" font-weight="bold" fill="#09544F">Webinars</text>
  <line x1="806" y1="158" x2="903" y2="158" stroke="#CAE6E9" stroke-width="1.5"/>
  <text x="853" y="176" text-anchor="middle" font-size="11" fill="#444">Problem-solving,</text>
