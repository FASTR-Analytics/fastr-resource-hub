<text x="351.75" y="18" text-anchor="middle" font-family='Inter, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="bold" fill="#20415c" stroke="#20415c" stroke-width="0.6" paint-order="stroke">Approche d'analyse en cycle rapide FASTR :</text>
<text x="351.75" y="40" text-anchor="middle" font-family='Inter, "Helvetica Neue", Arial, sans-serif' font-size="17" font-weight="bold" fill="#20415c" stroke="#20415c" stroke-width="0.6" paint-order="stroke">Analyser, Apprendre, Renforcer, Agir</text>
<text x="256.5" y="222" text-anchor="start" font-family='Inter, "Helvetica Neue", Arial, sans-serif' font-size="16" font-weight="bold" fill="#20415c" stroke="#20415c" stroke-width="0.6" paint-order="stroke">Analyser</text>
<text x="256.5" y="242" text-anchor="start" font-family='Inter, "Helvetica Neue", Arial, sans-serif' font-size="11.5" fill="#4d4d4d">
<tspan x="256.5" dy="0">Analyser des données SSP</tspan>
<tspan x="256.5" dy="14">et SRMNIA-N opportunes</tspan>
</text>
<text x="389.1" y="387" text-anchor="start" font-family='Inter, "Helvetica Neue", Arial, sans-serif' font-size="16" font-weight="bold" fill="#20415c" stroke="#20415c" stroke-width="0.6" paint-order="stroke">Apprendre</text>
<text x="389.1" y="407" text-anchor="start" font-family='Inter, "Helvetica Neue", Arial, sans-serif' font-size="11.5" fill="#4d4d4d">
<tspan x="389.1" dy="0">Apprendre des données</tspan>
<tspan x="389.1" dy="14">pour prioriser les lacunes</tspan>
<tspan x="389.1" dy="14">des systèmes de santé</tspan>
</text>
<text x="123.5" y="387" text-anchor="start" font-family='Inter, "Helvetica Neue", Arial, sans-serif' font-size="16" font-weight="bold" fill="#20415c" stroke="#20415c" stroke-width="0.6" paint-order="stroke">Agir</text>
<text x="123.5" y="407" text-anchor="start" font-family='Inter, "Helvetica Neue", Arial, sans-serif' font-size="11.5" fill="#4d4d4d">
<tspan x="123.5" dy="0">Traduire les données en</tspan>
<tspan x="123.5" dy="14">actions pour des SSP</tspan>
<tspan x="123.5" dy="14">renforcés et de meilleurs</tspan>
<tspan x="123.5" dy="14">résultats SRMNIA-N</tspan>
</text>
<text x="256.5" y="545" text-anchor="start" font-family='Inter, "Helvetica Neue", Arial, sans-serif' font-size="16" font-weight="bold" fill="#20415c" stroke="#20415c" stroke-width="0.6" paint-order="stroke">Renforcer</text>
<text x="256.5" y="565" text-anchor="start" font-family='Inter, "Helvetica Neue", Arial, sans-serif' font-size="11.5" fill="#4d4d4d">
<tspan x="256.5" dy="0">Renforcer la capacité de</tspan>
<tspan x="256.5" dy="14">S&amp;É et la qualité des</tspan>
<tspan x="256.5" dy="14">données dans le pays</tspan>
</text>
