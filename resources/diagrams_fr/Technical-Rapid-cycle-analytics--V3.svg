<g id="french-text"><text x="200" y="195" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold" font-family="'Segoe UI', Arial, sans-serif">Utilisation</text><text x="200" y="213" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold" font-family="'Segoe UI', Arial, sans-serif">des services</text><text x="200" y="231" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold" font-family="'Segoe UI', Arial, sans-serif">SMNCAH-N</text><text x="200" y="255" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">Exploiter les données</text><text x="200" y="267" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">du SNIS pour suivre</text><text x="200" y="279" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">en routine les change-</text><text x="200" y="291" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">ments de couverture</text><text x="200" y="303" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">des services de santé</text><text x="200" y="315" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">lors de réformes, de</text><text x="200" y="327" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">chocs, ou au sein de</text><text x="200" y="339" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">populations vulnérables,</text><text x="200" y="351" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">tout en identifiant et</text><text x="200" y="363" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">résolvant les problèmes</text><text x="200" y="375" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">de qualité des données.</text><text x="377" y="195" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="'Segoe UI', Arial, sans-serif">Enquêtes</text><text x="377" y="212" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="'Segoe UI', Arial, sans-serif">téléphoniques</text><text x="377" y="229" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="'Segoe UI', Arial, sans-serif">rapides auprès des</text><text x="377" y="246" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="'Segoe UI', Arial, sans-serif">formations sanitaires</text><text x="377" y="270" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">Évaluer les lacunes dans</text><text x="377" y="282" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">la prestation des soins</text><text x="377" y="294" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">de santé primaires ;</text><text x="377" y="306" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">comprendre l'impact des</text><text x="377" y="318" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">réformes ou des chocs</text><text x="377" y="330" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">sur la performance</text><text x="377" y="342" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">des SSP.</text><text x="553" y="195" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="'Segoe UI', Arial, sans-serif">Enquêtes rapides</text><text x="553" y="212" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="'Segoe UI', Arial, sans-serif">auprès des ménages</text><text x="553" y="229" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="'Segoe UI', Arial, sans-serif">et des clients</text><text x="553" y="255" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">Générer des instantanés</text><text x="553" y="267" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">de l'utilisation des</text><text x="553" y="279" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">services de santé et</text><text x="553" y="291" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">des soins non reçus,</text><text x="553" y="303" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">ainsi que les perceptions</text><text x="553" y="315" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">de la qualité des services</text><text x="553" y="327" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">par la communauté.</text><text x="729" y="195" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="'Segoe UI', Arial, sans-serif">Approfondir avec</text><text x="729" y="212" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="'Segoe UI', Arial, sans-serif">des analyses</text><text x="729" y="229" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="'Segoe UI', Arial, sans-serif">complémentaires</text><text x="729" y="255" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">Diagnostiquer</text><text x="729" y="267" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">efficacement les</text><text x="729" y="279" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">défis sous-jacents</text><text x="729" y="291" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">et évaluer les</text><text x="729" y="303" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">contextes de</text><text x="729" y="315" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">mise en œuvre.</text><text x="465" y="398" text-anchor="middle" fill="#000000" font-size="13" font-weight="bold" font-family="'Segoe UI', Arial, sans-serif">Renforcement des capacités + appui à l'utilisation des données</text><text x="465" y="414" text-anchor="middle" fill="#000000" font-size="8.5" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">Renforcer les capacités nationales en matière de collecte, d'analyse et d'utilisation des données,</text><text x="465" y="425" text-anchor="middle" fill="#000000" font-size="8.5" font-weight="normal" font-family="'Segoe UI', Arial, sans-serif">y compris les revues de données et les boucles de rétroaction infranationales.</text></g></svg>
