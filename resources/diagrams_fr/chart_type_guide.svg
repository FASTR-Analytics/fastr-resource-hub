<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260">

  <!-- Card 1: Graphique linéaire -->
  <g transform="translate(15, 15)">
    <rect x="0" y="0" width="160" height="220" rx="10" fill="#E8F4F3"/>
    <!-- Icon area -->
    <rect x="0" y="0" width="160" height="70" rx="10" fill="#09544F"/>
    <rect x="0" y="40" width="160" height="30" fill="#09544F"/>
    <!-- Mini line chart icon -->
    <polyline points="30,50 55,30 80,40 105,20 130,35" stroke="#CAE6E9" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Text -->
    <text x="80" y="92" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#09544F">Graphique</text>
    <text x="80" y="106" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#09544F">linéaire</text>
    <line x1="20" y1="116" x2="140" y2="116" stroke="#CAE6E9" stroke-width="1.5"/>
    <text x="80" y="136" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">Comment ça évolue</text>
    <text x="80" y="150" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">dans le temps ?</text>
    <line x1="20" y1="162" x2="140" y2="162" stroke="#CAE6E9" stroke-width="1"/>
    <text x="80" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">Tendances, schémas</text>
    <text x="80" y="193" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">saisonniers, progrès</text>
    <text x="80" y="206" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">vers les objectifs</text>
  </g>

  <!-- Card 2: Diagramme en barres -->
  <g transform="translate(185, 15)">
    <rect x="0" y="0" width="160" height="220" rx="10" fill="#E8F4F3"/>
    <rect x="0" y="0" width="160" height="70" rx="10" fill="#0C716B"/>
    <rect x="0" y="40" width="160" height="30" fill="#0C716B"/>
    <!-- Mini bar chart icon -->
    <rect x="35" y="45" width="18" height="20" rx="2" fill="#CAE6E9"/>
    <rect x="60" y="30" width="18" height="35" rx="2" fill="#CAE6E9"/>
    <rect x="85" y="38" width="18" height="27" rx="2" fill="#CAE6E9"/>
    <rect x="110" y="25" width="18" height="40" rx="2" fill="#CAE6E9"/>
    <!-- Text -->
    <text x="80" y="92" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#09544F">Diagramme</text>
    <text x="80" y="106" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#09544F">en barres</text>
    <line x1="20" y1="116" x2="140" y2="116" stroke="#CAE6E9" stroke-width="1.5"/>
    <text x="80" y="136" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">Quelle zone fait</text>
    <text x="80" y="150" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">le mieux ou le moins ?</text>
    <line x1="20" y1="162" x2="140" y2="162" stroke="#CAE6E9" stroke-width="1"/>
    <text x="80" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">Comparer régions,</text>
    <text x="80" y="193" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">établissements ou</text>
    <text x="80" y="206" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">indicateurs côte à côte</text>
  </g>

  <!-- Card 3: Tableau -->
  <g transform="translate(355, 15)">
    <rect x="0" y="0" width="160" height="220" rx="10" fill="#E8F4F3"/>
    <rect x="0" y="0" width="160" height="70" rx="10" fill="#1F9A9C"/>
    <rect x="0" y="40" width="160" height="30" fill="#1F9A9C"/>
    <!-- Mini table icon -->
    <rect x="35" y="22" width="90" height="42" rx="3" fill="none" stroke="#CAE6E9" stroke-width="1.5"/>
    <line x1="35" y1="35" x2="125" y2="35" stroke="#CAE6E9" stroke-width="1"/>
    <line x1="35" y1="48" x2="125" y2="48" stroke="#CAE6E9" stroke-width="1"/>
    <line x1="70" y1="22" x2="70" y2="64" stroke="#CAE6E9" stroke-width="1"/>
    <line x1="100" y1="22" x2="100" y2="64" stroke="#CAE6E9" stroke-width="1"/>
    <!-- Text -->
    <text x="80" y="98" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#09544F">Tableau</text>
    <line x1="20" y1="116" x2="140" y2="116" stroke="#CAE6E9" stroke-width="1.5"/>
    <text x="80" y="136" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">Quels sont les</text>
    <text x="80" y="150" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">chiffres exacts ?</text>
    <line x1="20" y1="162" x2="140" y2="162" stroke="#CAE6E9" stroke-width="1"/>
    <text x="80" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">Valeurs précises,</text>
    <text x="80" y="193" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">données de référence,</text>
    <text x="80" y="206" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">ventilations détaillées</text>
  </g>

  <!-- Card 4: Heatmap -->
  <g transform="translate(525, 15)">
    <rect x="0" y="0" width="160" height="220" rx="10" fill="#E8F4F3"/>
    <rect x="0" y="0" width="160" height="70" rx="10" fill="#09544F"/>
    <rect x="0" y="40" width="160" height="30" fill="#09544F"/>
    <!-- Mini heatmap icon -->
    <rect x="35" y="22" width="20" height="14" rx="2" fill="#C53030" opacity="0.7"/>
    <rect x="58" y="22" width="20" height="14" rx="2" fill="#1F9A9C"/>
    <rect x="81" y="22" width="20" height="14" rx="2" fill="#09544F"/>
    <rect x="104" y="22" width="20" height="14" rx="2" fill="#1F9A9C"/>
    <rect x="35" y="40" width="20" height="14" rx="2" fill="#1F9A9C"/>
    <rect x="58" y="40" width="20" height="14" rx="2" fill="#09544F"/>
    <rect x="81" y="40" width="20" height="14" rx="2" fill="#C53030" opacity="0.7"/>
    <rect x="104" y="40" width="20" height="14" rx="2" fill="#CAE6E9"/>
    <!-- Text -->
    <text x="80" y="98" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#09544F">Heatmap</text>
    <line x1="20" y1="116" x2="140" y2="116" stroke="#CAE6E9" stroke-width="1.5"/>
    <text x="80" y="136" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">Où est la tendance</text>
    <text x="80" y="150" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">parmi plusieurs ?</text>
    <line x1="20" y1="162" x2="140" y2="162" stroke="#CAE6E9" stroke-width="1"/>
    <text x="80" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">Plusieurs indicateurs</text>
    <text x="80" y="193" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">par région, repérer</text>
    <text x="80" y="206" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">rapidement les anomalies</text>
  </g>

  <!-- Bottom note -->
  <text x="350" y="252" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#777" font-style="italic">Commencez par la question à laquelle vous voulez répondre, puis choisissez le graphique adapté</text>

</svg>
