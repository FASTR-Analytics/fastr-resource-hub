<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"><text x="140" y="60" text-anchor="middle" font-size="18" font-weight="600" fill="#4A5654">Il y a dix ans</text><rect x="60" y="150" width="70" height="50" fill="#FFFFFF" stroke="#0A544F" stroke-width="2.5"/><polygon points="54,150 95.0,116 136,150" fill="#0C716B"/><rect x="86.0" y="174" width="18" height="26" fill="#0A544F"/><rect x="140" y="150" width="70" height="50" fill="#FFFFFF" stroke="#0A544F" stroke-width="2.5"/><polygon points="134,150 175.0,116 216,150" fill="#0C716B"/><rect x="166.0" y="174" width="18" height="26" fill="#0A544F"/><rect x="220" y="150" width="70" height="50" fill="#FFFFFF" stroke="#0A544F" stroke-width="2.5"/><polygon points="214,150 255.0,116 296,150" fill="#0C716B"/><rect x="246.0" y="174" width="18" height="26" fill="#0A544F"/><text x="165" y="240" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1F1E">Le recensement compte tout le monde</text><text x="165" y="290" text-anchor="middle" font-size="24" font-weight="700" fill="#0A544F">100 000 habitants</text><line x1="330" y1="190" x2="420" y2="190" stroke="#0A544F" stroke-width="3" stroke-linecap="round"/><polyline points="408,197 420,190 408,183" fill="none" stroke="#0A544F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="610" y="60" text-anchor="middle" font-size="18" font-weight="600" fill="#4A5654">Chaque année depuis</text><rect x="460" y="120" width="92" height="150" rx="8" fill="#E8F4F3" stroke="#0A544F" stroke-width="1.5"/><text x="506" y="150" text-anchor="middle" font-size="15" font-weight="400" fill="#4A5654">+1 an</text><text x="506" y="205" text-anchor="middle" font-size="18" font-weight="700" fill="#0A544F">× 1,03</text><text x="506" y="245" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">103 000</text><rect x="570" y="120" width="92" height="150" rx="8" fill="#E8F4F3" stroke="#0A544F" stroke-width="1.5"/><text x="616" y="150" text-anchor="middle" font-size="15" font-weight="400" fill="#4A5654">+2 ans</text><text x="616" y="205" text-anchor="middle" font-size="18" font-weight="700" fill="#0A544F">× 1,03</text><text x="616" y="245" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">106 000</text><rect x="680" y="120" width="92" height="150" rx="8" fill="#E8F4F3" stroke="#0A544F" stroke-width="1.5"/><text x="726" y="150" text-anchor="middle" font-size="15" font-weight="400" fill="#4A5654">+3 ans</text><text x="726" y="205" text-anchor="middle" font-size="18" font-weight="700" fill="#0A544F">× 1,03</text><text x="726" y="245" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">109 000</text><rect x="790" y="120" width="92" height="150" rx="8" fill="#E8F4F3" stroke="#0A544F" stroke-width="1.5"/><text x="836" y="150" text-anchor="middle" font-size="15" font-weight="400" fill="#4A5654">…</text><text x="836" y="205" text-anchor="middle" font-size="18" font-weight="700" fill="#0A544F">× 1,03</text><text x="836" y="245" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">…</text><text x="610" y="300" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1F1E">On fait grossir le chiffre du même pourcentage, partout</text><line x1="900" y1="190" x2="960" y2="190" stroke="#0A544F" stroke-width="3" stroke-linecap="round"/><polyline points="948,197 960,190 948,183" fill="none" stroke="#0A544F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1070" y="60" text-anchor="middle" font-size="18" font-weight="600" fill="#4A5654">Puis on prend une part</text><rect x="980" y="120" width="190" height="150" rx="8" fill="#FDE8E8" stroke="#C53030" stroke-width="2"/><text x="1075" y="155" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">4 % d’enfants</text><text x="1075" y="178" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">de moins d’un an</text><text x="1075" y="225" text-anchor="middle" font-size="34" font-weight="700" fill="#C53030">5 000</text><text x="1075" y="252" text-anchor="middle" font-size="14" font-weight="400" fill="#4A5654">enfants « attendus »</text><text x="600" y="400" text-anchor="middle" font-size="20" font-weight="400" fill="#1A1F1E">C’est ce chiffre, la population cible, qui est inscrit dans DHIS2 et dans les plans.</text><text x="600" y="435" text-anchor="middle" font-size="17" font-weight="400" fill="#4A5654">Il suppose que tout le monde grandit au même rythme et que personne ne déménage.</text></svg>