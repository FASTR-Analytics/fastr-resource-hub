<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect x="60" y="30" width="1080" height="54" rx="10" fill="#FDE8E8" stroke="#C53030" stroke-width="2"/><text x="600" y="64" text-anchor="middle" font-size="17" font-weight="700" fill="#C53030">Le chiffre du bas vient de la projection du recensement : 5 000 enfants, le même chiffre dans les deux provinces</text><rect x="60" y="105" width="520" height="300" rx="10" fill="#FFFFFF" stroke="#0A544F" stroke-width="2"/><text x="320" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#0A544F">Province A</text><text x="190" y="175" text-anchor="middle" font-size="12" font-weight="400" fill="#4A5654">ce que dit le tableau de bord</text><text x="190" y="205" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1F1E">4 000 vaccinés</text><line x1="100" y1="218" x2="280" y2="218" stroke="#C53030" stroke-width="3"/><text x="190" y="242" text-anchor="middle" font-size="16" font-weight="700" fill="#C53030">5 000 « attendus »</text><text x="190" y="262" text-anchor="middle" font-size="11" font-weight="400" fill="#C53030">projection du recensement</text><text x="190" y="320" text-anchor="middle" font-size="44" font-weight="700" fill="#C53030">80 %</text><text x="190" y="352" text-anchor="middle" font-size="13" font-weight="400" fill="#4A5654">on croit avoir presque fini</text><line x1="320" y1="170" x2="320" y2="370" stroke="#E4E7E5" stroke-width="2"/><text x="450" y="175" text-anchor="middle" font-size="12" font-weight="400" fill="#4A5654">avec le vrai nombre d’enfants</text><text x="450" y="205" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1F1E">4 000 vaccinés</text><line x1="360" y1="218" x2="540" y2="218" stroke="#0A544F" stroke-width="3"/><text x="450" y="242" text-anchor="middle" font-size="16" font-weight="700" fill="#0A544F">9 200 enfants</text><text x="450" y="262" text-anchor="middle" font-size="11" font-weight="400" fill="#0A544F">qui vivent vraiment là</text><text x="450" y="320" text-anchor="middle" font-size="44" font-weight="700" fill="#0A544F">43 %</text><text x="450" y="352" text-anchor="middle" font-size="13" font-weight="400" fill="#4A5654">plus de la moitié restent à vacciner</text><rect x="620" y="105" width="520" height="300" rx="10" fill="#FFFFFF" stroke="#0A544F" stroke-width="2"/><text x="880" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#0A544F">Province B</text><text x="750" y="175" text-anchor="middle" font-size="12" font-weight="400" fill="#4A5654">ce que dit le tableau de bord</text><text x="750" y="205" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1F1E">2 700 vaccinés</text><line x1="660" y1="218" x2="840" y2="218" stroke="#C53030" stroke-width="3"/><text x="750" y="242" text-anchor="middle" font-size="16" font-weight="700" fill="#C53030">5 000 « attendus »</text><text x="750" y="262" text-anchor="middle" font-size="11" font-weight="400" fill="#C53030">projection du recensement</text><text x="750" y="320" text-anchor="middle" font-size="44" font-weight="700" fill="#C53030">54 %</text><text x="750" y="352" text-anchor="middle" font-size="13" font-weight="400" fill="#4A5654">on croit être très en retard</text><line x1="880" y1="170" x2="880" y2="370" stroke="#E4E7E5" stroke-width="2"/><text x="1010" y="175" text-anchor="middle" font-size="12" font-weight="400" fill="#4A5654">avec le vrai nombre d’enfants</text><text x="1010" y="205" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1F1E">2 700 vaccinés</text><line x1="920" y1="218" x2="1100" y2="218" stroke="#0A544F" stroke-width="3"/><text x="1010" y="242" text-anchor="middle" font-size="16" font-weight="700" fill="#0A544F">3 000 enfants</text><text x="1010" y="262" text-anchor="middle" font-size="11" font-weight="400" fill="#0A544F">qui vivent vraiment là</text><text x="1010" y="320" text-anchor="middle" font-size="44" font-weight="700" fill="#0A544F">90 %</text><text x="1010" y="352" text-anchor="middle" font-size="13" font-weight="400" fill="#4A5654">presque tout le monde est vacciné</text><text x="600" y="445" text-anchor="middle" font-size="18" font-weight="600" fill="#1A1F1E">Les vaccinations sont bien comptées. C’est le 5 000 qui est faux, et il trompe dans les deux sens.</text></svg>