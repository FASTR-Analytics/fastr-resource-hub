<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect x="60" y="70" width="500" height="330" rx="10" fill="#FFFFFF" stroke="#0A544F" stroke-width="2"/><text x="310" y="110" text-anchor="middle" font-size="20" font-weight="700" fill="#0A544F">Province A</text><text x="310" y="160" text-anchor="middle" font-size="18" font-weight="400" fill="#1A1F1E">4 000 enfants vaccinés</text><line x1="180" y1="178" x2="440" y2="178" stroke="#0A544F" stroke-width="3"/><text x="310" y="210" text-anchor="middle" font-size="18" font-weight="400" fill="#1A1F1E">5 000 enfants « attendus »</text><text x="310" y="290" text-anchor="middle" font-size="54" font-weight="700" fill="#C53030">80 %</text><text x="310" y="340" text-anchor="middle" font-size="15" font-weight="400" fill="#4A5654">Le vrai chiffre : 4 000 sur 8 000, soit 50 %</text><rect x="640" y="70" width="500" height="330" rx="10" fill="#FFFFFF" stroke="#0A544F" stroke-width="2"/><text x="890" y="110" text-anchor="middle" font-size="20" font-weight="700" fill="#0A544F">Province B</text><text x="890" y="160" text-anchor="middle" font-size="18" font-weight="400" fill="#1A1F1E">3 300 enfants vaccinés</text><line x1="760" y1="178" x2="1020" y2="178" stroke="#0A544F" stroke-width="3"/><text x="890" y="210" text-anchor="middle" font-size="18" font-weight="400" fill="#1A1F1E">5 000 enfants « attendus »</text><text x="890" y="290" text-anchor="middle" font-size="54" font-weight="700" fill="#C53030">110 %</text><text x="890" y="340" text-anchor="middle" font-size="15" font-weight="400" fill="#4A5654">Plus de vaccinés que d’enfants ? Le 5 000 est faux.</text><text x="600" y="450" text-anchor="middle" font-size="20" font-weight="400" fill="#1A1F1E">Les deux provinces ont vacciné correctement. Ce sont les « 5 000 » qui sont faux.</text></svg>