<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"><text x="600" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#0A544F">On a déjà deux sources. Chacune dit une moitié de la réponse.</text><rect x="60" y="80" width="470" height="285" rx="12" fill="#F4ECF4" stroke="#501E50" stroke-width="2"/><text x="295" y="115" text-anchor="middle" font-size="19" font-weight="700" fill="#501E50">L’enquête (EDS, MICS)</text><text x="295" y="140" text-anchor="middle" font-size="13" font-weight="400" fill="#4A5654">va voir les familles chez elles, vues ou non par le centre</text><circle cx="120" cy="176" r="14" fill="#501E50"/><path d="M100,238 v-30 a20,20 0 0 1 40,0 v30 z" fill="#501E50"/><circle cx="136" cy="216" r="12" fill="#501E50"/><circle cx="160" cy="176" r="14" fill="#501E50"/><path d="M140,238 v-30 a20,20 0 0 1 40,0 v30 z" fill="#501E50"/><circle cx="176" cy="216" r="12" fill="#501E50"/><circle cx="200" cy="176" r="14" fill="#501E50"/><path d="M180,238 v-30 a20,20 0 0 1 40,0 v30 z" fill="#501E50"/><circle cx="216" cy="216" r="12" fill="#501E50"/><circle cx="240" cy="176" r="14" fill="#501E50"/><path d="M220,238 v-30 a20,20 0 0 1 40,0 v30 z" fill="#501E50"/><circle cx="256" cy="216" r="12" fill="#501E50"/><circle cx="280" cy="176" r="14" fill="#501E50"/><path d="M260,238 v-30 a20,20 0 0 1 40,0 v30 z" fill="#501E50"/><circle cx="296" cy="216" r="12" fill="#501E50"/><circle cx="320" cy="176" r="14" fill="#501E50"/><path d="M300,238 v-30 a20,20 0 0 1 40,0 v30 z" fill="#501E50"/><circle cx="336" cy="216" r="12" fill="#501E50"/><circle cx="360" cy="176" r="14" fill="#501E50"/><path d="M340,238 v-30 a20,20 0 0 1 40,0 v30 z" fill="#501E50"/><circle cx="376" cy="216" r="12" fill="#501E50"/><circle cx="400" cy="176" r="14" fill="#501E50"/><path d="M380,238 v-30 a20,20 0 0 1 40,0 v30 z" fill="#501E50"/><circle cx="416" cy="216" r="12" fill="#501E50"/><circle cx="445" cy="176" r="14" fill="none" stroke="#501E50" stroke-width="3"/><path d="M425,238 v-30 a20,20 0 0 1 40,0 v30 z" fill="none" stroke="#501E50" stroke-width="3"/><circle cx="461" cy="216" r="12" fill="none" stroke="#501E50" stroke-width="3"/><circle cx="485" cy="176" r="14" fill="none" stroke="#501E50" stroke-width="3"/><path d="M465,238 v-30 a20,20 0 0 1 40,0 v30 z" fill="none" stroke="#501E50" stroke-width="3"/><circle cx="501" cy="216" r="12" fill="none" stroke="#501E50" stroke-width="3"/><text x="295" y="282" text-anchor="middle" font-size="15" font-weight="600" fill="#1A1F1E">Elle dit la PART qui vient au centre de santé</text><text x="295" y="322" text-anchor="middle" font-size="30" font-weight="700" fill="#501E50">8 sur 10</text><text x="295" y="348" text-anchor="middle" font-size="12" font-weight="400" fill="#4A5654">mais pas combien elles sont en tout</text><text x="600" y="245" text-anchor="middle" font-size="54" font-weight="700" fill="#0A544F">+</text><rect x="670" y="80" width="470" height="285" rx="12" fill="#EDF1F7" stroke="#21568C" stroke-width="2"/><text x="905" y="115" text-anchor="middle" font-size="19" font-weight="700" fill="#21568C">DHIS2</text><text x="905" y="140" text-anchor="middle" font-size="13" font-weight="400" fill="#4A5654">le registre du centre de santé, chaque mois</text><g transform="translate(778 194) scale(0.5)"><rect x="0" y="50" width="120" height="80" rx="6" fill="#FFFFFF" stroke="#0A544F" stroke-width="3"/><polygon points="-10,50 60.0,0 130,50" fill="#0C716B"/><rect x="48.0" y="80" width="24" height="60" fill="#C53030"/><rect x="30.0" y="98" width="60" height="24" fill="#C53030"/><text x="60.0" y="158" text-anchor="middle" font-size="16" font-weight="600" fill="#0A544F"></text></g><line x1="860" y1="236" x2="915" y2="236" stroke="#21568C" stroke-width="3" stroke-linecap="round"/><polyline points="903,243 915,236 903,229" fill="none" stroke="#21568C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="935" cy="176" r="14" fill="#21568C"/><path d="M915,238 v-30 a20,20 0 0 1 40,0 v30 z" fill="#21568C"/><circle cx="951" cy="216" r="12" fill="#21568C"/><circle cx="975" cy="176" r="14" fill="#21568C"/><path d="M955,238 v-30 a20,20 0 0 1 40,0 v30 z" fill="#21568C"/><circle cx="991" cy="216" r="12" fill="#21568C"/><circle cx="1015" cy="176" r="14" fill="#21568C"/><path d="M995,238 v-30 a20,20 0 0 1 40,0 v30 z" fill="#21568C"/><circle cx="1031" cy="216" r="12" fill="#21568C"/><circle cx="1055" cy="176" r="14" fill="#21568C"/><path d="M1035,238 v-30 a20,20 0 0 1 40,0 v30 z" fill="#21568C"/><circle cx="1071" cy="216" r="12" fill="#21568C"/><text x="905" y="282" text-anchor="middle" font-size="15" font-weight="600" fill="#1A1F1E">Il dit COMBIEN sont venues</text><text x="905" y="322" text-anchor="middle" font-size="30" font-weight="700" fill="#21568C">8 000</text><text x="905" y="348" text-anchor="middle" font-size="12" font-weight="400" fill="#4A5654">mais rien sur celles qui ne sont pas venues</text><rect x="250" y="392" width="700" height="46" rx="23" fill="#E8F4F3" stroke="#0A544F" stroke-width="2"/><text x="600" y="421" text-anchor="middle" font-size="16" font-weight="700" fill="#0A544F">Ensemble, elles donnent le total : combien de femmes enceintes il y a vraiment</text><text x="600" y="472" text-anchor="middle" font-size="15" font-weight="400" fill="#4A5654">C’est l’idée de FASTR. Les trois pages suivantes la déroulent avec les chiffres.</text></svg>