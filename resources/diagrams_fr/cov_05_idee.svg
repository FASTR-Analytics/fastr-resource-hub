"3"/><circle cx="936" cy="308" r="12" fill="none" stroke="#501E50" stroke-width="3"/><circle cx="976" cy="268" r="14" fill="none" stroke="#501E50" stroke-width="3"/><path d="M956,330 v-30 a20,20 0 0 1 40,0 v30 z" fill="none" stroke="#501E50" stroke-width="3"/><circle cx="992" cy="308" r="12" fill="none" stroke="#501E50" stroke-width="3"/><rect x="330" y="140" width="520" height="40" rx="20" fill="#E8F4F3"/><text x="590" y="167" text-anchor="middle" font-size="16" font-weight="600" fill="#0A544F">La plupart des femmes enceintes passent par le centre de santé</text><text x="590" y="390" text-anchor="middle" font-size="20" font-weight="700" fill="#501E50">8 femmes sur 10 viennent en consultation prénatale</text><text x="975" y="390" text-anchor="middle" font-size="16" font-weight="400" fill="#4A5654">2 ne viennent pas</text><text x="600" y="460" text-anchor="middle" font-size="20" font-weight="400" fill="#1A1F1E">Le centre de santé « voit » presque tout le monde. C’est là que FASTR va compter.</text></svg>