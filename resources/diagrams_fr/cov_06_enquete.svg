<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"><text x="600" y="60" text-anchor="middle" font-size="19" font-weight="400" fill="#1A1F1E">L’enquête ménages demande à chaque femme : « êtes-vous allée en consultation prénatale ? »</text><circle cx="330" cy="168" r="14" fill="#501E50"/><path d="M310,230 v-30 a20,20 0 0 1 40,0 v30 z" fill="#501E50"/><circle cx="346" cy="208" r="12" fill="#501E50"/><circle cx="390" cy="168" r="14" fill="#501E50"/><path d="M370,230 v-30 a20,20 0 0 1 40,0 v30 z" fill="#501E50"/><circle cx="406" cy="208" r="12" fill="#501E50"/><circle cx="450" cy="168" r="14" fill="#501E50"/><path d="M430,230 v-30 a20,20 0 0 1 40,0 v30 z" fill="#501E50"/><circle cx="466" cy="208" r="12" fill="#501E50"/><circle cx="510" cy="168" r="14" fill="#501E50"/><path d="M490,230 v-30 a20,20 0 0 1 40,0 v30 z" fill="#501E50"/><circle cx="526" cy="208" r="12" fill="#501E50"/><circle cx="570" cy="168" r="14" fill="#501E50"/><path d="M550,230 v-30 a20,20 0 0 1 40,0 v30 z" fill="#501E50"/><circle cx="586" cy="208" r="12" fill="#501E50"/><circle cx="630" cy="168" r="14" fill="#501E50"/><path d="M610,230 v-30 a20,20 0 0 1 40,0 v30 z" fill="#501E50"/><circle cx="646" cy="208" r="12" fill="#501E50"/><circle cx="690" cy="168" r="14" fill="#501E50"/><path d="M670,230 v-30 a20,20 0 0 1 40,0 v30 z" fill="#501E50"/><circle cx="706" cy="208" r="12" fill="#501E50"/><circle cx="750" cy="168" r="14" fill="#501E50"/><path d="M730,230 v-30 a20,20 0 0 1 40,0 v30 z" fill="#501E50"/><circle cx="766" cy="208" r="12" fill="#501E50"/><circle cx="810" cy="168" r="14" fill="none" stroke="#501E50" stroke-width="3"/><path d="M790,230 v-30 a20,20 0 0 1 40,0 v30 z" fill="none" stroke="#501E50" stroke-width="3"/><circle cx="826" cy="208" r="12" fill="none" stroke="#501E50" stroke-width="3"/><circle cx="870" cy="168" r="14" fill="none" stroke="#501E50" stroke-width="3"/><path d="M850,230 v-30 a20,20 0 0 1 40,0 v30 z" fill="none" stroke="#501E50" stroke-width="3"/><circle cx="886" cy="208" r="12" fill="none" stroke="#501E50" stroke-width="3"/><rect x="300" y="250" width="470" height="6" rx="3" fill="#501E50"/><text x="535" y="290" text-anchor="middle" font-size="20" font-weight="700" fill="#501E50">8 ont répondu oui</text><rect x="790" y="250" width="100" height="6" rx="3" fill="#C7D1CF"/><text x="840" y="290" text-anchor="middle" font-size="16" font-weight="400" fill="#4A5654">2 ont répondu non</text><text x="600" y="380" text-anchor="middle" font-size="30" font-weight="700" fill="#0A544F">Sur 10 femmes enceintes, 8 viennent.</text><text x="600" y="420" text-anchor="middle" font-size="16" font-weight="400" fill="#4A5654">Ce chiffre vaut pour tout le pays et toutes les femmes, vues ou non. Une enquête tous les cinq ans.</text></svg>