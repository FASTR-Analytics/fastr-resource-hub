<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"><text x="600" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#0A544F">Si 8 femmes vues vont avec 2 femmes non vues…</text><circle cx="300" cy="98" r="14" fill="#501E50"/><path d="M280,160 v-30 a20,20 0 0 1 40,0 v30 z" fill="#501E50"/><circle cx="316" cy="138" r="12" fill="#501E50"/><circle cx="352" cy="98" r="14" fill="#501E50"/><path d="M332,160 v-30 a20,20 0 0 1 40,0 v30 z" fill="#501E50"/><circle cx="368" cy="138" r="12" fill="#501E50"/><circle cx="404" cy="98" r="14" fill="#501E50"/><path d="M384,160 v-30 a20,20 0 0 1 40,0 v30 z" fill="#501E50"/><circle cx="420" cy="138" r="12" fill="#501E50"/><circle cx="456" cy="98" r="14" fill="#501E50"/><path d="M436,160 v-30 a20,20 0 0 1 40,0 v30 z" fill="#501E50"/><circle cx="472" cy="138" r="12" fill="#501E50"/><circle cx="508" cy="98" r="14" fill="#501E50"/><path d="M488,160 v-30 a20,20 0 0 1 40,0 v30 z" fill="#501E50"/><circle cx="524" cy="138" r="12" fill="#501E50"/><circle cx="560" cy="98" r="14" fill="#501E50"/><path d="M540,160 v-30 a20,20 0 0 1 40,0 v30 z" fill="#501E50"/><circle cx="576" cy="138" r="12" fill="#501E50"/><circle cx="612" cy="98" r="14" fill="#501E50"/><path d="M592,160 v-30 a20,20 0 0 1 40,0 v30 z" fill="#501E50"/><circle cx="628" cy="138" r="12" fill="#501E50"/><circle cx="664" cy="98" r="14" fill="#501E50"/><path d="M644,160 v-30 a20,20 0 0 1 40,0 v30 z" fill="#501E50"/><circle cx="680" cy="138" r="12" fill="#501E50"/><text x="480" y="190" text-anchor="middle" font-size="16" font-weight="600" fill="#501E50">8 vues</text><circle cx="760" cy="98" r="14" fill="none" stroke="#501E50" stroke-width="3"/><path d="M740,160 v-30 a20,20 0 0 1 40,0 v30 z" fill="none" stroke="#501E50" stroke-width="3"/><circle cx="776" cy="138" r="12" fill="none" stroke="#501E50" stroke-width="3"/><circle cx="812" cy="98" r="14" fill="none" stroke="#501E50" stroke-width="3"/><path d="M792,160 v-30 a20,20 0 0 1 40,0 v30 z" fill="none" stroke="#501E50" stroke-width="3"/><circle cx="828" cy="138" r="12" fill="none" stroke="#501E50" stroke-width="3"/><text x="785" y="190" text-anchor="middle" font-size="16" font-weight="600" fill="#4A5654">2 non vues</text><text x="600" y="240" text-anchor="middle" font-size="22" font-weight="700" fill="#0A544F">… alors 8 000 femmes vues vont avec 2 000 femmes non vues.</text><rect x="200" y="280" width="560" height="110" rx="10" fill="#EDF1F7" stroke="#21568C" stroke-width="2"/><text x="480" y="335" text-anchor="middle" font-size="40" font-weight="700" fill="#21568C">8 000</text><text x="480" y="372" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">vues au centre de santé (DHIS2)</text><text x="790" y="345" text-anchor="middle" font-size="40" font-weight="700" fill="#0A544F">+</text><rect x="820" y="280" width="200" height="110" rx="10" fill="#FFFFFF" stroke="#501E50" stroke-width="2" stroke-dasharray="6,4"/><text x="920" y="335" text-anchor="middle" font-size="40" font-weight="700" fill="#501E50">2 000</text><text x="920" y="372" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">non vues</text><rect x="300" y="420" width="600" height="80" rx="10" fill="#E8F4F3" stroke="#0A544F" stroke-width="2"/><text x="600" y="470" text-anchor="middle" font-size="26" font-weight="700" fill="#0A544F">= 10 000 femmes enceintes dans le district</text><text x="600" y="535" text-anchor="middle" font-size="16" font-weight="400" fill="#4A5654">Les 2 000 non vues sont déduites des 8 000 vues. Personne ne les a comptées, et pourtant on les a.</text></svg>