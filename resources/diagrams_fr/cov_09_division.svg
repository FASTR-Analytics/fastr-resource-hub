<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect x="150" y="110" width="900" height="130" rx="10" fill="#FFFFFF" stroke="#0A544F" stroke-width="2"/><text x="300" y="160" text-anchor="middle" font-size="20" font-weight="600" fill="#501E50">« 8 sur 10 »</text><text x="300" y="195" text-anchor="middle" font-size="18" font-weight="400" fill="#1A1F1E">s’écrit 0,80</text><text x="600" y="160" text-anchor="middle" font-size="26" font-weight="700" fill="#0A544F">8 000 ÷ 0,80</text><text x="600" y="195" text-anchor="middle" font-size="15" font-weight="400" fill="#4A5654">femmes vues ÷ part des femmes vues</text><text x="900" y="160" text-anchor="middle" font-size="26" font-weight="700" fill="#0A544F">= 10 000</text><text x="900" y="195" text-anchor="middle" font-size="15" font-weight="400" fill="#4A5654">toutes les femmes enceintes</text><text x="600" y="300" text-anchor="middle" font-size="18" font-weight="400" fill="#1A1F1E">Diviser par 0,80, c’est la même chose que multiplier par 10 et diviser par 8 :</text><text x="600" y="335" text-anchor="middle" font-size="24" font-weight="700" fill="#0A544F">8 000 × 10 ÷ 8 = 10 000</text><text x="600" y="420" text-anchor="middle" font-size="17" font-weight="400" fill="#4A5654">Vous n’avez pas besoin de faire ce calcul. FASTR le fait pour chaque district et chaque année.</text></svg>