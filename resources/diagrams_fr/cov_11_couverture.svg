<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"><text x="600" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#0A544F">On repart de la fraction du début. Le chiffre du bas vient de la cascade : 9 200.</text><rect x="70" y="110" width="150" height="110" rx="6" fill="#FFFFFF" stroke="#0A544F" stroke-width="3"/><polygon points="60,110 145.0,60 230,110" fill="#0C716B"/><rect x="133.0" y="140" width="24" height="60" fill="#C53030"/><rect x="115.0" y="158" width="60" height="24" fill="#C53030"/><text x="145.0" y="248" text-anchor="middle" font-size="16" font-weight="600" fill="#0A544F">Centre de santé de la province</text><line x1="235" y1="170" x2="290" y2="170" stroke="#0A544F" stroke-width="3" stroke-linecap="round"/><polyline points="278,177 290,170 278,163" fill="none" stroke="#0A544F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="300" y="80" width="520" height="110" rx="10" fill="#EDF1F7" stroke="#21568C" stroke-width="2"/><text x="560" y="130" text-anchor="middle" font-size="40" font-weight="700" fill="#21568C">4 000</text><text x="560" y="168" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">enfants vaccinés cette année, comptés dans DHIS2</text><line x1="300" y1="215" x2="820" y2="215" stroke="#0A544F" stroke-width="4"/><rect x="300" y="240" width="520" height="110" rx="10" fill="#E8F4F3" stroke="#0A544F" stroke-width="2.5"/><text x="560" y="290" text-anchor="middle" font-size="40" font-weight="700" fill="#0A544F">9 200</text><text x="560" y="328" text-anchor="middle" font-size="14" font-weight="400" fill="#1A1F1E">enfants à vacciner, estimés par FASTR (enquête + DHIS2 + cascade)</text><text x="870" y="225" text-anchor="middle" font-size="44" font-weight="700" fill="#0A544F">=</text><text x="1040" y="245" text-anchor="middle" font-size="64" font-weight="700" fill="#0A544F">43 %</text><text x="1040" y="282" text-anchor="middle" font-size="18" font-weight="400" fill="#1A1F1E">de couverture</text><text x="1040" y="310" text-anchor="middle" font-size="13" font-weight="400" fill="#4A5654">plus de la moitié des enfants</text><text x="1040" y="328" text-anchor="middle" font-size="13" font-weight="400" fill="#4A5654">restent à vacciner</text><rect x="300" y="380" width="520" height="40" rx="20" fill="#FDE8E8"/><text x="560" y="406" text-anchor="middle" font-size="15" font-weight="600" fill="#C53030">Avec le 5 000 du recensement projeté, on aurait lu 80 %.</text><text x="600" y="460" text-anchor="middle" font-size="18" font-weight="400" fill="#1A1F1E">Mêmes 4 000 enfants vaccinés. La décision à prendre n’est pas du tout la même.</text></svg>