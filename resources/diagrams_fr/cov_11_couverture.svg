<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect x="80" y="80" width="480" height="300" rx="10" fill="#FDE8E8" stroke="#C53030" stroke-width="2"/><text x="320" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#C53030">Avec la projection du recensement</text><text x="320" y="170" text-anchor="middle" font-size="18" font-weight="400" fill="#1A1F1E">4 000 enfants vaccinés</text><line x1="170" y1="188" x2="470" y2="188" stroke="#C53030" stroke-width="3"/><text x="320" y="220" text-anchor="middle" font-size="18" font-weight="400" fill="#1A1F1E">5 000 enfants « attendus »</text><text x="320" y="300" text-anchor="middle" font-size="56" font-weight="700" fill="#C53030">80 %</text><text x="320" y="350" text-anchor="middle" font-size="15" font-weight="400" fill="#4A5654">On croit que le district a presque fini.</text><rect x="640" y="80" width="480" height="300" rx="10" fill="#E8F4F3" stroke="#0A544F" stroke-width="2"/><text x="880" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#0A544F">Avec le comptage FASTR</text><text x="880" y="170" text-anchor="middle" font-size="18" font-weight="400" fill="#1A1F1E">4 000 enfants vaccinés</text><line x1="730" y1="188" x2="1030" y2="188" stroke="#0A544F" stroke-width="3"/><text x="880" y="220" text-anchor="middle" font-size="18" font-weight="400" fill="#1A1F1E">9 200 enfants qui sont vraiment là</text><text x="880" y="300" text-anchor="middle" font-size="56" font-weight="700" fill="#0A544F">43 %</text><text x="880" y="350" text-anchor="middle" font-size="15" font-weight="400" fill="#4A5654">Plus de la moitié des enfants restent à vacciner.</text><text x="600" y="440" text-anchor="middle" font-size="20" font-weight="400" fill="#1A1F1E">Mêmes 4 000 enfants vaccinés. La décision à prendre n’est pas du tout la même.</text></svg>