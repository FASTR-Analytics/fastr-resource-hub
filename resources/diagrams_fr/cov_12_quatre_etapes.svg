<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"><circle cx="180" cy="150" r="46" fill="#501E50"/><text x="180" y="166" text-anchor="middle" font-size="40" font-weight="700" fill="#FFFFFF">1</text><text x="180" y="235" text-anchor="middle" font-size="18" font-weight="600" fill="#1A1F1E">Compter à partir</text><text x="180" y="260" text-anchor="middle" font-size="18" font-weight="600" fill="#1A1F1E">d’un service</text><text x="180" y="292" text-anchor="middle" font-size="15" font-weight="400" fill="#4A5654">CPN1 ÷ enquête</text><line x1="240" y1="150" x2="300" y2="150" stroke="#0A544F" stroke-width="3" stroke-linecap="round"/><polyline points="288,157 300,150 288,143" fill="none" stroke="#0A544F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="470" cy="150" r="46" fill="#0A544F"/><text x="470" y="166" text-anchor="middle" font-size="40" font-weight="700" fill="#FFFFFF">2</text><text x="470" y="235" text-anchor="middle" font-size="18" font-weight="600" fill="#1A1F1E">Déduire les autres</text><text x="470" y="260" text-anchor="middle" font-size="18" font-weight="600" fill="#1A1F1E">populations</text><text x="470" y="292" text-anchor="middle" font-size="15" font-weight="400" fill="#4A5654">la cascade</text><line x1="530" y1="150" x2="590" y2="150" stroke="#0A544F" stroke-width="3" stroke-linecap="round"/><polyline points="578,157 590,150 578,143" fill="none" stroke="#0A544F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="760" cy="150" r="46" fill="#21568C"/><text x="760" y="166" text-anchor="middle" font-size="40" font-weight="700" fill="#FFFFFF">3</text><text x="760" y="235" text-anchor="middle" font-size="18" font-weight="600" fill="#1A1F1E">Choisir la chaîne</text><text x="760" y="260" text-anchor="middle" font-size="18" font-weight="600" fill="#1A1F1E">la plus crédible</text><text x="760" y="292" text-anchor="middle" font-size="15" font-weight="400" fill="#4A5654">contre l’ONU</text><line x1="820" y1="150" x2="880" y2="150" stroke="#0A544F" stroke-width="3" stroke-linecap="round"/><polyline points="868,157 880,150 868,143" fill="none" stroke="#0A544F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1050" cy="150" r="46" fill="#0C716B"/><text x="1050" y="166" text-anchor="middle" font-size="40" font-weight="700" fill="#FFFFFF">4</text><text x="1050" y="235" text-anchor="middle" font-size="18" font-weight="600" fill="#1A1F1E">Calculer et</text><text x="1050" y="260" text-anchor="middle" font-size="18" font-weight="600" fill="#1A1F1E">prolonger</text><text x="1050" y="292" text-anchor="middle" font-size="15" font-weight="400" fill="#4A5654">couverture + enquête</text><rect x="90" y="340" width="520" height="40" rx="20" fill="#E8F4F3"/><text x="350" y="366" text-anchor="middle" font-size="15" font-weight="600" fill="#0A544F">Module « Dénominateurs de couverture » : étapes 1 à 3</text><rect x="700" y="340" width="420" height="40" rx="20" fill="#E8F4F3"/><text x="910" y="366" text-anchor="middle" font-size="15" font-weight="600" fill="#0A544F">Module « Estimations de couverture » : étape 4</text><text x="600" y="440" text-anchor="middle" font-size="17" font-weight="400" fill="#4A5654">Tout cela tourne quand on génère un paquet de résultats. Personne ne fait les calculs à la main.</text></svg>