<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"><text x="600" y="50" text-anchor="middle" font-size="20" font-weight="700" fill="#0A544F">Ce que vous venez de voir, la plateforme le fait en quatre étapes</text><circle cx="180" cy="190" r="56" fill="#501E50"/><text x="180" y="208" text-anchor="middle" font-size="48" font-weight="700" fill="#FFFFFF">1</text><text x="180" y="285" text-anchor="middle" font-size="19" font-weight="600" fill="#1A1F1E">Compter à partir</text><text x="180" y="312" text-anchor="middle" font-size="19" font-weight="600" fill="#1A1F1E">d’un service</text><line x1="250" y1="190" x2="300" y2="190" stroke="#0A544F" stroke-width="3" stroke-linecap="round"/><polyline points="288,197 300,190 288,183" fill="none" stroke="#0A544F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="470" cy="190" r="56" fill="#0A544F"/><text x="470" y="208" text-anchor="middle" font-size="48" font-weight="700" fill="#FFFFFF">2</text><text x="470" y="285" text-anchor="middle" font-size="19" font-weight="600" fill="#1A1F1E">Déduire les</text><text x="470" y="312" text-anchor="middle" font-size="19" font-weight="600" fill="#1A1F1E">autres âges</text><line x1="540" y1="190" x2="590" y2="190" stroke="#0A544F" stroke-width="3" stroke-linecap="round"/><polyline points="578,197 590,190 578,183" fill="none" stroke="#0A544F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="760" cy="190" r="56" fill="#21568C"/><text x="760" y="208" text-anchor="middle" font-size="48" font-weight="700" fill="#FFFFFF">3</text><text x="760" y="285" text-anchor="middle" font-size="19" font-weight="600" fill="#1A1F1E">Choisir la</text><text x="760" y="312" text-anchor="middle" font-size="19" font-weight="600" fill="#1A1F1E">meilleure chaîne</text><line x1="830" y1="190" x2="880" y2="190" stroke="#0A544F" stroke-width="3" stroke-linecap="round"/><polyline points="868,197 880,190 868,183" fill="none" stroke="#0A544F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1050" cy="190" r="56" fill="#0C716B"/><text x="1050" y="208" text-anchor="middle" font-size="48" font-weight="700" fill="#FFFFFF">4</text><text x="1050" y="285" text-anchor="middle" font-size="19" font-weight="600" fill="#1A1F1E">Calculer la</text><text x="1050" y="312" text-anchor="middle" font-size="19" font-weight="600" fill="#1A1F1E">couverture</text><text x="600" y="400" text-anchor="middle" font-size="16" font-weight="400" fill="#4A5654">Les étapes 1 et 2, c’est l’exemple des 10 000 femmes enceintes. Les étapes 3 et 4 sont nouvelles.</text><text x="600" y="435" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1F1E">Tout se calcule automatiquement quand on génère un paquet de résultats.</text></svg>