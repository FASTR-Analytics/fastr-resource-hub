<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect x="60" y="110" width="200" height="56" rx="10" fill="#501E50"/><text x="160" y="144" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">grossesses</text><rect x="60" y="200" width="200" height="56" rx="10" fill="#0A544F"/><text x="160" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">accouchements</text><rect x="60" y="290" width="200" height="56" rx="10" fill="#0A544F"/><text x="160" y="324" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">naissances vivantes</text><rect x="60" y="380" width="200" height="56" rx="10" fill="#1FA29C"/><text x="160" y="414" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">enfants à vacciner</text><line x1="100" y1="170" x2="100" y2="196" stroke="#0A544F" stroke-width="3" stroke-linecap="round"/><polyline points="93,184 100,196 107,184" fill="none" stroke="#0A544F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="170" y1="196" x2="170" y2="170" stroke="#0A544F" stroke-width="3" stroke-linecap="round"/><polyline points="177,182 170,170 163,182" fill="none" stroke="#0A544F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="200" y="171" width="190" height="26" rx="13" fill="#FDE8E8" stroke="#C53030" stroke-width="1.5"/><text x="295" y="188" text-anchor="middle" font-size="12" font-weight="700" fill="#C53030">− 3 % de pertes</text><line x1="100" y1="260" x2="100" y2="286" stroke="#0A544F" stroke-width="3" stroke-linecap="round"/><polyline points="93,274 100,286 107,274" fill="none" stroke="#0A544F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="170" y1="286" x2="170" y2="260" stroke="#0A544F" stroke-width="3" stroke-linecap="round"/><polyline points="177,272 170,260 163,272" fill="none" stroke="#0A544F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="200" y="261" width="190" height="26" rx="13" fill="#FDE8E8" stroke="#C53030" stroke-width="1.5"/><text x="295" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#C53030">+ jumeaux, − 2 % de mort-nés</text><line x1="100" y1="350" x2="100" y2="376" stroke="#0A544F" stroke-width="3" stroke-linecap="round"/><polyline points="93,364 100,376 107,364" fill="none" stroke="#0A544F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="170" y1="376" x2="170" y2="350" stroke="#0A544F" stroke-width="3" stroke-linecap="round"/><polyline points="177,362 170,350 163,362" fill="none" stroke="#0A544F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="200" y="351" width="190" height="26" rx="13" fill="#FDE8E8" stroke="#C53030" stroke-width="1.5"/><text x="295" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#C53030">− 3,9 % de décès</text><text x="100" y="462" text-anchor="middle" font-size="12" font-weight="400" fill="#4A5654">× taux : on descend</text><text x="170" y="480" text-anchor="middle" font-size="12" font-weight="400" fill="#4A5654">÷ taux : on remonte</text><rect x="420" y="110" width="720" height="50" rx="10" fill="#FFFFFF" stroke="#501E50" stroke-width="2"/><rect x="420" y="110" width="150" height="50" rx="10" fill="#501E50"/><rect x="560" y="110" width="10" height="50" fill="#501E50"/><text x="495" y="141" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">CPN1</text><text x="690" y="141" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">8 000 consultations</text><text x="870" y="141" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">÷ 80 % viennent</text><text x="1070" y="141" text-anchor="middle" font-size="18" font-weight="800" fill="#501E50">= 10 000</text><line x1="418" y1="135" x2="266" y2="138" stroke="#501E50" stroke-width="2.5" stroke-linecap="round"/><polyline points="278,131 266,138 278,144" fill="none" stroke="#501E50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="420" y="245" width="720" height="50" rx="10" fill="#FFFFFF" stroke="#0A544F" stroke-width="2"/><rect x="420" y="245" width="150" height="50" rx="10" fill="#0A544F"/><rect x="560" y="245" width="10" height="50" fill="#0A544F"/><text x="495" y="276" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Accouchements</text><text x="690" y="276" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">6 200 en établissement</text><text x="870" y="276" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">÷ 65 % y accouchent</text><text x="1070" y="276" text-anchor="middle" font-size="18" font-weight="800" fill="#0A544F">= 9 540</text><line x1="418" y1="291" x2="266" y2="318" stroke="#0A544F" stroke-width="2.5" stroke-linecap="round"/><polyline points="277,309 266,318 279,322" fill="none" stroke="#0A544F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="420" y="305" width="720" height="50" rx="10" fill="#FFFFFF" stroke="#0A544F" stroke-width="2"/><rect x="420" y="305" width="150" height="50" rx="10" fill="#0A544F"/><rect x="560" y="305" width="10" height="50" fill="#0A544F"/><text x="495" y="336" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">BCG</text><text x="690" y="336" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">8 600 doses</text><text x="870" y="336" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">÷ 88 % vaccinés</text><text x="1070" y="336" text-anchor="middle" font-size="18" font-weight="800" fill="#0A544F">= 9 770</text><line x1="418" y1="330" x2="266" y2="318" stroke="#0A544F" stroke-width="2.5" stroke-linecap="round"/><polyline points="279,312 266,318 278,326" fill="none" stroke="#0A544F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="420" y="380" width="720" height="50" rx="10" fill="#FFFFFF" stroke="#1FA29C" stroke-width="2"/><rect x="420" y="380" width="150" height="50" rx="10" fill="#1FA29C"/><rect x="560" y="380" width="10" height="50" fill="#1FA29C"/><text x="495" y="411" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Penta1</text><text x="690" y="411" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">7 800 doses</text><text x="870" y="411" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">÷ 85 % vaccinés</text><text x="1070" y="411" text-anchor="middle" font-size="18" font-weight="800" fill="#1FA29C">= 9 180</text><line x1="418" y1="405" x2="266" y2="408" stroke="#1FA29C" stroke-width="2.5" stroke-linecap="round"/><polyline points="278,401 266,408 278,414" fill="none" stroke="#1FA29C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="50" text-anchor="middle" font-size="19" font-weight="700" fill="#0A544F">Chaque service mesuré par l’enquête donne un chiffre à un étage. La cascade remplit les autres étages.</text><text x="780" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#4A5654">DHIS2</text><text x="870" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#4A5654">enquête</text><text x="1070" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#4A5654">population</text><text x="780" y="462" text-anchor="middle" font-size="13" font-weight="400" fill="#4A5654">Accouchements et BCG arrivent au même étage : l’enquête compte les accouchements en établissement parmi les naissances vivantes.</text><text x="780" y="488" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">Quatre points de départ, quatre chaînes complètes : quatre réponses à la question « combien de personnes ? ».</text></svg>