e-linecap="round" stroke-linejoin="round"/><line x1="220" y1="376" x2="220" y2="350" stroke="#0A544F" stroke-width="3" stroke-linecap="round"/><polyline points="227,362 220,350 213,362" fill="none" stroke="#0A544F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="462" text-anchor="middle" font-size="13" font-weight="400" fill="#4A5654">× taux : on descend</text><text x="220" y="480" text-anchor="middle" font-size="13" font-weight="400" fill="#4A5654">÷ taux : on remonte</text><rect x="420" y="110" width="720" height="50" rx="10" fill="#FFFFFF" stroke="#501E50" stroke-width="2"/><rect x="420" y="110" width="150" height="50" rx="10" fill="#501E50"/><rect x="560" y="110" width="10" height="50" fill="#501E50"/><text x="495" y="141" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">CPN1</text><text x="690" y="141" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">8 000 consultations</text><text x="870" y="141" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">÷ 80 % viennent</text><text x="1070" y="141" text-anchor="middle" font-size="18" font-weight="800" fill="#501E50">= 10 000</text><line x1="418" y1="135" x2="316" y2="138" stroke="#501E50" stroke-width="2.5" stroke-linecap="round"/><polyline points="328,131 316,138 328,144" fill="none" stroke="#501E50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="420" y="245" width="720" height="50" rx="10" fill="#FFFFFF" stroke="#0A544F" stroke-width="2"/><rect x="420" y="245" width="150" height="50" rx="10" fill="#0A544F"/><rect x="560" y="245" width="10" height="50" fill="#0A544F"/><text x="495" y="276" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Accouchements</text><text x="690" y="276" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">6 200 en établissement</text><text x="870" y="276" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">÷ 65 % y accouchent</text><text x="1070" y="276" text-anchor="middle" font-size="18" font-weight="800" fill="#0A544F">= 9 540</text><line x1="418" y1="270" x2="316" y2="318" stroke="#0A544F" stroke-width="2.5" stroke-linecap="round"/><polyline points="324,307 316,318 330,319" fill="none" stroke="#0A544F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="420" y="305" width="720" height="50" rx="10" fill="#FFFFFF" stroke="#0A544F" stroke-width="2"/><rect x="420" y="305" width="150" height="50" rx="10" fill="#0A544F"/><rect x="560" y="305" width="10" height="50" fill="#0A544F"/><text x="495" y="336" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">BCG</text><text x="690" y="336" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">8 600 doses</text><text x="870" y="336" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">÷ 88 % vaccinés</text><text x="1070" y="336" text-anchor="middle" font-size="18" font-weight="800" fill="#0A544F">= 9 770</text><line x1="418" y1="330" x2="316" y2="318" stroke="#0A544F" stroke-width="2.5" stroke-linecap="round"/><polyline points="329,313 316,318 327,326" fill="none" stroke="#0A544F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="420" y="380" width="720" height="50" rx="10" fill="#FFFFFF" stroke="#1FA29C" stroke-width="2"/><rect x="420" y="380" width="150" height="50" rx="10" fill="#1FA29C"/><rect x="560" y="380" width="10" height="50" fill="#1FA29C"/><text x="495" y="411" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Penta1</text><text x="690" y="411" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">7 800 doses</text><text x="870" y="411" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">÷ 85 % vaccinés</text><text x="1070" y="411" text-anchor="middle" font-size="18" font-weight="800" fill="#1FA29C">= 9 180</text><line x1="418" y1="405" x2="316" y2="408" stroke="#1FA29C" stroke-width="2.5" stroke-linecap="round"/><polyline points="328,401 316,408 328,414" fill="none" stroke="#1FA29C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="50" text-anchor="middle" font-size="19" font-weight="700" fill="#0A544F">Chaque service mesuré par l’enquête donne un chiffre à un étage. La cascade remplit les autres étages.</text><text x="780" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#4A5654">DHIS2</text><text x="870" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#4A5654">enquête</text><text x="1070" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#4A5654">population</text><text x="780" y="462" text-anchor="middle" font-size="13" font-weight="400" fill="#4A5654">Accouchements et BCG arrivent au même étage : l’enquête compte les accouchements en établissement parmi les naissances vivantes.</text><text x="780" y="488" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">Quatre points de départ, quatre chaînes complètes : quatre réponses à la question « combien de personnes ? ».</text></svg>