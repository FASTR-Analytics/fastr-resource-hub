<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"><text x="600" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#0A544F">Exemple : les naissances vivantes de tout le pays, pour une année</text><text x="600" y="66" text-anchor="middle" font-size="14" font-weight="400" fill="#4A5654">Chaque chaîne donne son chiffre national. On le compare au chiffre de l’ONU pour la même année.</text><rect x="170" y="130.0" width="110" height="200.0" rx="4" fill="#C7D1CF"/><text x="225" y="156.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1F1E">1 000 000</text><text x="225" y="358" text-anchor="middle" font-size="15" font-weight="600" fill="#1A1F1E">ONU</text><text x="225" y="380" text-anchor="middle" font-size="13" font-weight="400" fill="#4A5654">Nations unies (WPP)</text><rect x="400" y="100.0" width="110" height="230.0" rx="4" fill="#501E50"/><text x="455" y="126.0" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">1 150 000</text><text x="455" y="358" text-anchor="middle" font-size="15" font-weight="600" fill="#1A1F1E">Chaîne CPN1</text><text x="455" y="380" text-anchor="middle" font-size="13" font-weight="400" fill="#4A5654">1.15 × le chiffre ONU</text><rect x="630" y="124.0" width="110" height="206.0" rx="4" fill="#0A544F"/><text x="685" y="150.0" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">1 030 000</text><text x="685" y="358" text-anchor="middle" font-size="15" font-weight="600" fill="#1A1F1E">Chaîne Accouchements</text><text x="685" y="380" text-anchor="middle" font-size="13" font-weight="400" fill="#4A5654">1.03 × le chiffre ONU</text><rect x="860" y="156.0" width="110" height="174.0" rx="4" fill="#1FA29C"/><text x="915" y="182.0" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">870 000</text><text x="915" y="358" text-anchor="middle" font-size="15" font-weight="600" fill="#1A1F1E">Chaîne Penta1</text><text x="915" y="380" text-anchor="middle" font-size="13" font-weight="400" fill="#4A5654">0.87 × le chiffre ONU</text><line x1="130" y1="330" x2="1070" y2="330" stroke="#0A544F" stroke-width="2"/><line x1="130" y1="130.0" x2="1070" y2="130.0" stroke="#4A5654" stroke-width="1.5" stroke-dasharray="8,6"/><rect x="610" y="110.0" width="150" height="278.0" rx="10" fill="none" stroke="#0A544F" stroke-width="3" stroke-dasharray="10,6"/><text x="600" y="420" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">La chaîne la plus proche de l’ONU est retenue : ici Accouchements, à 1,03. Une seule chaîne pour tous les indicateurs et toutes les provinces.</text><text x="600" y="446" text-anchor="middle" font-size="13" font-weight="400" fill="#4A5654">En vrai, FASTR compare trois populations (grossesses, naissances vivantes, nourrissons) sur toutes les années, et prend la médiane.</text><text x="600" y="468" text-anchor="middle" font-size="13" font-weight="400" fill="#4A5654">L’ONU n’est pas « la vérité » : c’est un repère indépendant pour départager. La chaîne BCG n’entre pas dans ce choix automatique.</text></svg>