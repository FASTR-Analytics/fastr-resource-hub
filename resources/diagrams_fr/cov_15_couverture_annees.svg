th="260" height="280" rx="10" fill="#FFFFFF" stroke="#0A544F" stroke-width="2"/><text x="940" y="125" text-anchor="middle" font-size="20" font-weight="700" fill="#0A544F">2023</text><text x="940" y="170" text-anchor="middle" font-size="17" font-weight="600" fill="#21568C">5 300 vaccinés</text><text x="940" y="192" text-anchor="middle" font-size="13" font-weight="400" fill="#4A5654">volume SNIS corrigé</text><line x1="860" y1="208" x2="1020" y2="208" stroke="#0A544F" stroke-width="3"/><text x="940" y="238" text-anchor="middle" font-size="17" font-weight="600" fill="#0A544F">9 600 enfants</text><text x="940" y="260" text-anchor="middle" font-size="13" font-weight="400" fill="#4A5654">dénominateur de la chaîne</text><text x="940" y="330" text-anchor="middle" font-size="40" font-weight="700" fill="#0A544F">55 %</text><text x="600" y="420" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1F1E">Le volume est celui corrigé des valeurs aberrantes par le module d’ajustement.</text><text x="600" y="450" text-anchor="middle" font-size="15" font-weight="400" fill="#4A5654">La couverture n’est pas plafonnée : au-dessus de 100 %, c’est le dénominateur qu’il faut regarder.</text></svg>