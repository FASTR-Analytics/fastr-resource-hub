<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"><text x="600" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#0A544F">L’enquête donne le niveau, le SNIS donne la tendance</text><rect x="100" y="58" width="1000" height="350" rx="8" fill="#FFFFFF" stroke="#E4E7E5"/><text x="600" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#1A1F1E">Estimations de couverture pour penta1</text><line x1="180" y1="370.0" x2="880" y2="370.0" stroke="#E4E7E5" stroke-width="1"/><text x="166" y="375.0" text-anchor="end" font-size="12" font-weight="400" fill="#4A5654">60 %</text><line x1="180" y1="305.0" x2="880" y2="305.0" stroke="#E4E7E5" stroke-width="1"/><text x="166" y="310.0" text-anchor="end" font-size="12" font-weight="400" fill="#4A5654">70 %</text><line x1="180" y1="240.0" x2="880" y2="240.0" stroke="#E4E7E5" stroke-width="1"/><text x="166" y="245.0" text-anchor="end" font-size="12" font-weight="400" fill="#4A5654">80 %</text><line x1="180" y1="175.0" x2="880" y2="175.0" stroke="#E4E7E5" stroke-width="1"/><text x="166" y="180.0" text-anchor="end" font-size="12" font-weight="400" fill="#4A5654">90 %</text><line x1="180" y1="110.0" x2="880" y2="110.0" stroke="#E4E7E5" stroke-width="1"/><text x="166" y="115.0" text-anchor="end" font-size="12" font-weight="400" fill="#4A5654">100 %</text><text x="180.0" y="394" text-anchor="middle" font-size="13" font-weight="400" fill="#4A5654">2020</text><text x="413.33333333333337" y="394" text-anchor="middle" font-size="13" font-weight="400" fill="#4A5654">2021</text><text x="646.6666666666667" y="394" text-anchor="middle" font-size="13" font-weight="400" fill="#4A5654">2022</text><text x="880.0" y="394" text-anchor="middle" font-size="13" font-weight="400" fill="#4A5654">2023</text><polyline points="180.0,253.0 413.33333333333337,240.0 646.6666666666667,220.5 880.0,207.5" fill="none" stroke="#CED4DB" stroke-width="3" /><circle cx="180.0" cy="253.0" r="5" fill="#CED4DB"/><circle cx="413.33333333333337" cy="240.0" r="5" fill="#CED4DB"/><circle cx="646.6666666666667" cy="220.5" r="5" fill="#CED4DB"/><circle cx="880.0" cy="207.5" r="5" fill="#CED4DB"/><polyline points="413.33333333333337,227.0 646.6666666666667,207.5 880.0,194.5" fill="none" stroke="#F04D44" stroke-width="3" /><circle cx="413.33333333333337" cy="227.0" r="5" fill="#F04D44"/><circle cx="646.6666666666667" cy="207.5" r="5" fill="#F04D44"/><circle cx="880.0" cy="194.5" r="5" fill="#F04D44"/><circle cx="413.33333333333337" cy="227.0" r="5" fill="#000000"/><text x="894.0" y="224.5" text-anchor="start" font-size="12" font-weight="700" fill="#8A9299">85 %</text><text x="894.0" y="193.5" text-anchor="start" font-size="12" font-weight="700" fill="#F04D44">87 %</text><text x="427.33333333333337" y="222.0" text-anchor="start" font-size="12" font-weight="700" fill="#000000">82 %</text><line x1="920" y1="120" x2="948" y2="120" stroke="#000000" stroke-width="3"/><circle cx="934" cy="120" r="4" fill="#000000"/><text x="956" y="124" text-anchor="start" font-size="10" font-weight="400" fill="#1A1F1E">Estimation basée sur l’enquête</text><line x1="920" y1="146" x2="948" y2="146" stroke="#F04D44" stroke-width="3"/><circle cx="934" cy="146" r="4" fill="#F04D44"/><text x="956" y="150" text-anchor="start" font-size="10" font-weight="400" fill="#1A1F1E">Estimation projetée</text><line x1="920" y1="172" x2="948" y2="172" stroke="#CED4DB" stroke-width="3"/><circle cx="934" cy="172" r="4" fill="#CED4DB"/><text x="956" y="176" text-anchor="start" font-size="10" font-weight="400" fill="#1A1F1E">Couverture calculée à partir du SNIS</text><text x="600" y="436" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">Le SNIS (gris) monte de 3 points puis de 2. On part de l’enquête (noir, 82 %) et on ajoute les mêmes points : 85 %, puis 87 % (rouge).</text><text x="600" y="460" text-anchor="middle" font-size="13" font-weight="400" fill="#4A5654">Quand une nouvelle enquête arrive, la projection repart de sa valeur.</text></svg>