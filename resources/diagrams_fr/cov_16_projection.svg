<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"><text x="600" y="46" text-anchor="middle" font-size="20" font-weight="700" fill="#0A544F">L’enquête donne le niveau, le SNIS donne la tendance</text><line x1="160" y1="360.0" x2="980" y2="360.0" stroke="#E4E7E5" stroke-width="1"/><text x="146" y="365.0" text-anchor="end" font-size="13" font-weight="400" fill="#4A5654">60 %</text><line x1="160" y1="300.0" x2="980" y2="300.0" stroke="#E4E7E5" stroke-width="1"/><text x="146" y="305.0" text-anchor="end" font-size="13" font-weight="400" fill="#4A5654">70 %</text><line x1="160" y1="240.0" x2="980" y2="240.0" stroke="#E4E7E5" stroke-width="1"/><text x="146" y="245.0" text-anchor="end" font-size="13" font-weight="400" fill="#4A5654">80 %</text><line x1="160" y1="180.0" x2="980" y2="180.0" stroke="#E4E7E5" stroke-width="1"/><text x="146" y="185.0" text-anchor="end" font-size="13" font-weight="400" fill="#4A5654">90 %</text><line x1="160" y1="120.0" x2="980" y2="120.0" stroke="#E4E7E5" stroke-width="1"/><text x="146" y="125.0" text-anchor="end" font-size="13" font-weight="400" fill="#4A5654">100 %</text><text x="160.0" y="386" text-anchor="middle" font-size="14" font-weight="400" fill="#4A5654">2020</text><text x="433.3333333333333" y="386" text-anchor="middle" font-size="14" font-weight="400" fill="#4A5654">2021</text><text x="706.6666666666666" y="386" text-anchor="middle" font-size="14" font-weight="400" fill="#4A5654">2022</text><text x="980.0" y="386" text-anchor="middle" font-size="14" font-weight="400" fill="#4A5654">2023</text><polyline points="160.0,252.0 433.3333333333333,240.0 706.6666666666666,222.0 980.0,210.0" fill="none" stroke="#21568C" stroke-width="3"/><circle cx="160.0" cy="252.0" r="5" fill="#21568C"/><circle cx="433.3333333333333" cy="240.0" r="5" fill="#21568C"/><circle cx="706.6666666666666" cy="222.0" r="5" fill="#21568C"/><circle cx="980.0" cy="210.0" r="5" fill="#21568C"/><text x="996.0" y="230.0" text-anchor="start" font-size="13" font-weight="600" fill="#21568C">SNIS 85 %</text><rect x="424.3333333333333" y="219.0" width="18" height="18" fill="#501E50" transform="rotate(45 433.3333333333333 228.0)"/><text x="417.3333333333333" y="212.0" text-anchor="end" font-size="13" font-weight="600" fill="#501E50">Enquête 82 %</text><polyline points="433.3333333333333,228.0 706.6666666666666,210.0 980.0,198.0" fill="none" stroke="#501E50" stroke-width="3" stroke-dasharray="9,6"/><circle cx="706.6666666666666" cy="210.0" r="5" fill="#FFFFFF" stroke="#501E50" stroke-width="3"/><circle cx="980.0" cy="198.0" r="5" fill="#FFFFFF" stroke="#501E50" stroke-width="3"/><text x="996.0" y="203.0" text-anchor="start" font-size="13" font-weight="600" fill="#501E50">Projection 87 %</text><text x="570.0" y="274.0" text-anchor="middle" font-size="14" font-weight="700" fill="#21568C">+3</text><text x="843.3333333333333" y="256.0" text-anchor="middle" font-size="14" font-weight="700" fill="#21568C">+2</text><text x="600" y="440" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1F1E">Le SNIS monte de 3 points puis de 2. On part de l’enquête (82 %) et on ajoute les mêmes points : 85 %, puis 87 %.</text><text x="600" y="468" text-anchor="middle" font-size="14" font-weight="400" fill="#4A5654">Quand une nouvelle enquête arrive, la projection repart de sa valeur.</text></svg>