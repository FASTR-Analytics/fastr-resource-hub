ill="#CED4DB"/><circle cx="380.0" cy="215.0" r="5" fill="#CED4DB"/><circle cx="505.0" cy="199.25" r="5" fill="#CED4DB"/><circle cx="630.0" cy="188.75" r="5" fill="#CED4DB"/><polyline points="380.0,204.5 505.0,188.75 630.0,178.25" fill="none" stroke="#F04D44" stroke-width="3" /><circle cx="380.0" cy="204.5" r="5" fill="#F04D44"/><circle cx="505.0" cy="188.75" r="5" fill="#F04D44"/><circle cx="630.0" cy="178.25" r="5" fill="#F04D44"/><polyline points="130.0,225.5 380.0,204.5" fill="none" stroke="#000000" stroke-width="3" /><circle cx="130.0" cy="225.5" r="5" fill="#000000"/><circle cx="380.0" cy="204.5" r="5" fill="#000000"/><text x="644.0" y="205.75" text-anchor="start" font-size="12" font-weight="700" fill="#8A9299">85 %</text><text x="644.0" y="177.25" text-anchor="start" font-size="12" font-weight="700" fill="#F04D44">87 %</text><text x="394.0" y="199.5" text-anchor="start" font-size="12" font-weight="700" fill="#000000">82 %</text><rect x="730" y="40" width="410" height="98" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><line x1="750" y1="68" x2="790" y2="68" stroke="#000000" stroke-width="3"/><circle cx="770" cy="68" r="5" fill="#000000"/><text x="805" y="73" text-anchor="start" font-size="15" font-weight="700" fill="#000000">Noir : l’enquête</text><text x="750" y="98" text-anchor="start" font-size="12" font-weight="400" fill="#1A1F1E">La mesure de référence. Un point seulement les années où il y</text><text x="750" y="118" text-anchor="start" font-size="12" font-weight="400" fill="#1A1F1E">a eu une EDS (DHS) ou une MICS.</text><rect x="730" y="150" width="410" height="98" rx="10" fill="#FFFFFF" stroke="#F04D44" stroke-width="2"/><line x1="750" y1="178" x2="790" y2="178" stroke="#F04D44" stroke-width="3"/><circle cx="770" cy="178" r="5" fill="#F04D44"/><text x="805" y="183" text-anchor="start" font-size="15" font-weight="700" fill="#F04D44">Rouge : la projection</text><text x="750" y="208" text-anchor="start" font-size="12" font-weight="400" fill="#1A1F1E">La dernière enquête, prolongée avec la tendance du SNIS.</text><text x="750" y="228" text-anchor="start" font-size="12" font-weight="400" fill="#1A1F1E">National et provinces.</text><rect x="730" y="260" width="410" height="98" rx="10" fill="#FFFFFF" stroke="#CED4DB" stroke-width="2"/><line x1="750" y1="288" x2="790" y2="288" stroke="#CED4DB" stroke-width="3"/><circle cx="770" cy="288" r="5" fill="#CED4DB"/><text x="805" y="293" text-anchor="start" font-size="15" font-weight="700" fill="#8A9299">Gris : le SNIS</text><text x="750" y="318" text-anchor="start" font-size="12" font-weight="400" fill="#1A1F1E">Volume corrigé ÷ dénominateur FASTR. Chaque année, chaque</text><text x="750" y="338" text-anchor="start" font-size="12" font-weight="400" fill="#1A1F1E">province.</text><rect x="60" y="390" width="1080" height="40" rx="20" fill="#E8F4F3"/><text x="600" y="416" text-anchor="middle" font-size="14" font-weight="600" fill="#0A544F">Pour la tendance, regardez le gris. Pour le niveau, regardez le rouge. S’ils s’écartent beaucoup, questionnez le dénominateur avant les services.</text></svg>