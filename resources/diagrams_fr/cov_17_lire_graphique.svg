<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect x="60" y="70" width="340" height="150" rx="10" fill="#FFFFFF" stroke="#21568C" stroke-width="2"/><line x1="90" y1="120" x2="170" y2="120" stroke="#21568C" stroke-width="4"/><circle cx="130" cy="120" r="5" fill="#21568C"/><text x="285" y="112" text-anchor="middle" font-size="18" font-weight="700" fill="#21568C">Couverture SNIS</text><text x="230" y="160" text-anchor="middle" font-size="14" font-weight="400" fill="#1A1F1E">chaque année, chaque province</text><text x="230" y="185" text-anchor="middle" font-size="14" font-weight="400" fill="#4A5654">volume corrigé ÷ dénominateur</text><rect x="430" y="70" width="340" height="150" rx="10" fill="#FFFFFF" stroke="#501E50" stroke-width="2"/><rect x="491" y="111" width="18" height="18" fill="#501E50" transform="rotate(45 500 120)"/><text x="655" y="112" text-anchor="middle" font-size="18" font-weight="700" fill="#501E50">Point d’enquête</text><text x="600" y="160" text-anchor="middle" font-size="14" font-weight="400" fill="#1A1F1E">les années où il y a une EDS (DHS) ou MICS</text><text x="600" y="185" text-anchor="middle" font-size="14" font-weight="400" fill="#4A5654">la mesure de référence</text><rect x="800" y="70" width="340" height="150" rx="10" fill="#FFFFFF" stroke="#501E50" stroke-width="2"/><line x1="830" y1="120" x2="910" y2="120" stroke="#501E50" stroke-width="4" stroke-dasharray="9,6"/><text x="1025" y="112" text-anchor="middle" font-size="18" font-weight="700" fill="#501E50">Projection</text><text x="970" y="160" text-anchor="middle" font-size="14" font-weight="400" fill="#1A1F1E">l’enquête prolongée par le SNIS</text><text x="970" y="185" text-anchor="middle" font-size="14" font-weight="400" fill="#4A5654">national et provinces</text><rect x="60" y="260" width="520" height="150" rx="10" fill="#E8F4F3"/><text x="320" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#0A544F">Pour voir la tendance</text><text x="320" y="335" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1F1E">regardez la couverture SNIS :</text><text x="320" y="360" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1F1E">disponible chaque année et par province</text><rect x="620" y="260" width="520" height="150" rx="10" fill="#E8F4F3"/><text x="880" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#0A544F">Pour voir le niveau</text><text x="880" y="335" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1F1E">regardez la projection :</text><text x="880" y="360" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1F1E">calée sur la dernière enquête</text><text x="600" y="460" text-anchor="middle" font-size="16" font-weight="400" fill="#4A5654">Si les deux séries s’écartent beaucoup, c’est le dénominateur qu’il faut questionner avant les services.</text></svg>