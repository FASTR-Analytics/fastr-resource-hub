<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 492" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"><text x="600" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#0A544F">Avec les valeurs par défaut, pour 10 000 grossesses</text><rect x="60" y="80" width="180" height="46" rx="8" fill="#501E50"/><text x="150" y="112" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">10 000</text><text x="262" y="108" text-anchor="start" font-size="16" font-weight="700" fill="#1A1F1E">grossesses</text><text x="880" y="108" text-anchor="start" font-size="13" font-weight="400" fill="#4A5654">point de départ : CPN1 ÷ enquête (étape 1)</text><line x1="150" y1="124" x2="150" y2="140" stroke="#0A544F" stroke-width="2.5" stroke-linecap="round"/><polyline points="143,128 150,140 157,128" fill="none" stroke="#0A544F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="142" width="180" height="46" rx="8" fill="#0A544F"/><text x="150" y="174" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">9 700</text><text x="262" y="170" text-anchor="start" font-size="16" font-weight="700" fill="#1A1F1E">accouchements</text><rect x="520" y="145" width="72" height="40" rx="20" fill="#FDE8E8" stroke="#C53030" stroke-width="2"/><text x="556" y="171" text-anchor="middle" font-size="14" font-weight="800" fill="#C53030">− 3 %</text><text x="610" y="170" text-anchor="start" font-size="15" font-weight="400" fill="#1A1F1E">= 10 000 × (1 − 3 %)</text><text x="880" y="170" text-anchor="start" font-size="13" font-weight="400" fill="#4A5654">on enlève les grossesses perdues</text><line x1="150" y1="186" x2="150" y2="202" stroke="#0A544F" stroke-width="2.5" stroke-linecap="round"/><polyline points="143,190 150,202 157,190" fill="none" stroke="#0A544F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="204" width="180" height="46" rx="8" fill="#0A544F"/><text x="150" y="236" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">9 770</text><text x="262" y="232" text-anchor="start" font-size="16" font-weight="700" fill="#1A1F1E">naissances</text><rect x="520" y="207" width="72" height="40" rx="20" fill="#FDE8E8" stroke="#C53030" stroke-width="2"/><text x="556" y="233" text-anchor="middle" font-size="14" font-weight="800" fill="#C53030">+ 0,75 %</text><text x="610" y="232" text-anchor="start" font-size="15" font-weight="400" fill="#1A1F1E">= 9 700 × (1 + 0,75 %)</text><text x="880" y="232" text-anchor="start" font-size="13" font-weight="400" fill="#4A5654">on ajoute les deuxièmes jumeaux (1,5 % de jumeaux)</text><line x1="150" y1="248" x2="150" y2="264" stroke="#0A544F" stroke-width="2.5" stroke-linecap="round"/><polyline points="143,252 150,264 157,252" fill="none" stroke="#0A544F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="266" width="180" height="46" rx="8" fill="#0A544F"/><text x="150" y="298" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">9 580</text><text x="262" y="294" text-anchor="start" font-size="16" font-weight="700" fill="#1A1F1E">naissances vivantes</text><rect x="520" y="269" width="72" height="40" rx="20" fill="#FDE8E8" stroke="#C53030" stroke-width="2"/><text x="556" y="295" text-anchor="middle" font-size="14" font-weight="800" fill="#C53030">− 2 %</text><text x="610" y="294" text-anchor="start" font-size="15" font-weight="400" fill="#1A1F1E">= 9 770 × (1 − 2 %)</text><text x="880" y="294" text-anchor="start" font-size="13" font-weight="400" fill="#4A5654">on enlève les mort-nés (20 ‰)</text><line x1="150" y1="310" x2="150" y2="326" stroke="#1FA29C" stroke-width="2.5" stroke-linecap="round"/><polyline points="143,314 150,326 157,314" fill="none" stroke="#1FA29C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="328" width="180" height="46" rx="8" fill="#1FA29C"/><text x="150" y="360" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">9 200</text><text x="262" y="356" text-anchor="start" font-size="16" font-weight="700" fill="#1A1F1E">enfants à vacciner (Penta)</text><rect x="520" y="331" width="72" height="40" rx="20" fill="#FDE8E8" stroke="#C53030" stroke-width="2"/><text x="556" y="357" text-anchor="middle" font-size="14" font-weight="800" fill="#C53030">− 3,9 %</text><text x="610" y="356" text-anchor="start" font-size="15" font-weight="400" fill="#1A1F1E">= 9 580 × (1 − 3,9 %)</text><text x="880" y="356" text-anchor="start" font-size="13" font-weight="400" fill="#4A5654">on enlève les décès du premier mois (39 ‰)</text><line x1="150" y1="372" x2="150" y2="388" stroke="#1FA29C" stroke-width="2.5" stroke-linecap="round"/><polyline points="143,376 150,388 157,376" fill="none" stroke="#1FA29C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="390" width="180" height="46" rx="8" fill="#1FA29C"/><text x="150" y="422" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">8 940</text><text x="262" y="418" text-anchor="start" font-size="16" font-weight="700" fill="#1A1F1E">enfants pour la rougeole</text><rect x="520" y="393" width="72" height="40" rx="20" fill="#FDE8E8" stroke="#C53030" stroke-width="2"/><text x="556" y="419" text-anchor="middle" font-size="14" font-weight="800" fill="#C53030">− 2,8 %</text><text x="610" y="418" text-anchor="start" font-size="15" font-weight="400" fill="#1A1F1E">= 9 200 × (1 − 2,8 %)</text><text x="880" y="418" text-anchor="start" font-size="13" font-weight="400" fill="#4A5654">on enlève les décès de 1 à 11 mois (28 ‰)</text><line x1="500" y1="132" x2="500" y2="442" stroke="#E4E7E5" stroke-width="1.5"/><line x1="865" y1="132" x2="865" y2="442" stroke="#E4E7E5" stroke-width="1.5"/><text x="600" y="470" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">Mêmes taux pour toutes les provinces. FASTR refait ce calcul pour chaque province et chaque année.</text></svg>