<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"><text x="600" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#0A544F">Un service est un bon point de départ quand on sait qui vient, et que l’enquête mesure la part qui vient</text><rect x="40" y="70" width="1120" height="86" rx="10" fill="#FFFFFF" stroke="#501E50" stroke-width="1.5"/><rect x="40" y="70" width="170" height="86" rx="10" fill="#501E50"/><rect x="200" y="70" width="10" height="86" fill="#501E50"/><text x="125" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">CPN1</text><g transform="translate(0 8) scale(1)"><circle cx="270" cy="68" r="14" fill="#501E50"/><path d="M250,130 v-30 a20,20 0 0 1 40,0 v30 z" fill="#501E50"/><circle cx="286" cy="108" r="12" fill="#501E50"/></g><text x="330" y="104" text-anchor="start" font-size="14" font-weight="600" fill="#1A1F1E">Les femmes enceintes viennent à la première consultation prénatale.</text><text x="330" y="130" text-anchor="start" font-size="13" font-weight="400" fill="#4A5654">L’enquête demande aux mères : « êtes-vous allée en CPN ? »</text><text x="905" y="100" text-anchor="start" font-size="12" font-weight="400" fill="#4A5654">donc on compte des</text><rect x="900" y="110" width="240" height="32" rx="16" fill="#E8F4F3"/><text x="1020" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#0A544F">grossesses</text><rect x="40" y="170" width="1120" height="86" rx="10" fill="#FFFFFF" stroke="#0A544F" stroke-width="1.5"/><rect x="40" y="170" width="170" height="86" rx="10" fill="#0A544F"/><rect x="200" y="170" width="10" height="86" fill="#0A544F"/><text x="125" y="220" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Accouchements</text><circle cx="270" cy="193.56" r="8.68" fill="#0A544F"/><path d="M257.6,232 v-18.6 a12.4,12.4 0 0 1 24.8,0 v18.6 z" fill="#0A544F"/><circle cx="270" cy="200" r="7" fill="none" stroke="#0A544F" stroke-width="2"/><text x="330" y="204" text-anchor="start" font-size="14" font-weight="600" fill="#1A1F1E">Les mères accouchent dans un établissement de santé.</text><text x="330" y="230" text-anchor="start" font-size="13" font-weight="400" fill="#4A5654">L’enquête demande, pour chaque enfant né vivant : « où avez-vous accouché ? »</text><text x="905" y="200" text-anchor="start" font-size="12" font-weight="400" fill="#4A5654">donc on compte des</text><rect x="900" y="210" width="240" height="32" rx="16" fill="#E8F4F3"/><text x="1020" y="231" text-anchor="middle" font-size="14" font-weight="700" fill="#0A544F">naissances vivantes</text><rect x="40" y="270" width="1120" height="86" rx="10" fill="#FFFFFF" stroke="#0A544F" stroke-width="1.5"/><rect x="40" y="270" width="170" height="86" rx="10" fill="#0A544F"/><rect x="200" y="270" width="10" height="86" fill="#0A544F"/><text x="125" y="320" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">BCG</text><circle cx="270" cy="293.56" r="8.68" fill="#0A544F"/><path d="M257.6,332 v-18.6 a12.4,12.4 0 0 1 24.8,0 v18.6 z" fill="#0A544F"/><circle cx="270" cy="300" r="7" fill="none" stroke="#0A544F" stroke-width="2"/><text x="330" y="304" text-anchor="start" font-size="14" font-weight="600" fill="#1A1F1E">Le BCG se donne à la naissance ou dans les premiers jours.</text><text x="330" y="330" text-anchor="start" font-size="13" font-weight="400" fill="#4A5654">L’enquête demande : « cet enfant a-t-il reçu le BCG ? »</text><text x="905" y="300" text-anchor="start" font-size="12" font-weight="400" fill="#4A5654">donc on compte des</text><rect x="900" y="310" width="240" height="32" rx="16" fill="#E8F4F3"/><text x="1020" y="331" text-anchor="middle" font-size="14" font-weight="700" fill="#0A544F">naissances vivantes</text><rect x="40" y="370" width="1120" height="86" rx="10" fill="#FFFFFF" stroke="#1FA29C" stroke-width="1.5"/><rect x="40" y="370" width="170" height="86" rx="10" fill="#1FA29C"/><rect x="200" y="370" width="10" height="86" fill="#1FA29C"/><text x="125" y="420" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Penta1</text><circle cx="270" cy="389.56" r="8.68" fill="#1FA29C"/><path d="M257.6,428 v-18.6 a12.4,12.4 0 0 1 24.8,0 v18.6 z" fill="#1FA29C"/><text x="330" y="404" text-anchor="start" font-size="14" font-weight="600" fill="#1A1F1E">Le Penta1 se donne à 6 semaines : l’enfant a passé le premier mois.</text><text x="330" y="430" text-anchor="start" font-size="13" font-weight="400" fill="#4A5654">L’enquête demande : « cet enfant a-t-il reçu le Penta1 ? »</text><text x="905" y="400" text-anchor="start" font-size="12" font-weight="400" fill="#4A5654">donc on compte des</text><rect x="900" y="410" width="240" height="32" rx="16" fill="#E8F4F3"/><text x="1020" y="431" text-anchor="middle" font-size="14" font-weight="700" fill="#0A544F">enfants à vacciner</text><text x="600" y="492" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">Quatre services, quatre âges de la vie : c’est pour cela qu’ils peuvent chacun servir de point de départ.</text></svg>