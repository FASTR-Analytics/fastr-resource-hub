.6 a12.4,12.4 0 0 1 24.8,0 v18.6 z" fill="#0A544F"/><circle cx="262" cy="271.56" r="8.68" fill="#0A544F"/><path d="M249.6,310 v-18.6 a12.4,12.4 0 0 1 24.8,0 v18.6 z" fill="#0A544F"/><circle cx="318" cy="271.56" r="8.68" fill="#0A544F"/><path d="M305.6,310 v-18.6 a12.4,12.4 0 0 1 24.8,0 v18.6 z" fill="#0A544F"/><circle cx="374" cy="271.56" r="8.68" fill="#0A544F"/><path d="M361.6,310 v-18.6 a12.4,12.4 0 0 1 24.8,0 v18.6 z" fill="#0A544F"/><circle cx="430" cy="271.56" r="8.68" fill="#0A544F"/><path d="M417.6,310 v-18.6 a12.4,12.4 0 0 1 24.8,0 v18.6 z" fill="#0A544F"/><circle cx="486" cy="271.56" r="8.68" fill="#0A544F"/><path d="M473.6,310 v-18.6 a12.4,12.4 0 0 1 24.8,0 v18.6 z" fill="#0A544F"/><circle cx="542" cy="271.56" r="8.68" fill="#0A544F"/><path d="M529.6,310 v-18.6 a12.4,12.4 0 0 1 24.8,0 v18.6 z" fill="#0A544F"/><circle cx="598" cy="271.56" r="8.68" fill="none" stroke="#C7D1CF" stroke-width="1.8599999999999999"/><path d="M585.6,310 v-18.6 a12.4,12.4 0 0 1 24.8,0 v18.6 z" fill="none" stroke="#C7D1CF" stroke-width="1.8599999999999999"/><circle cx="654" cy="271.56" r="8.68" fill="none" stroke="#C7D1CF" stroke-width="1.8599999999999999"/><path d="M641.6,310 v-18.6 a12.4,12.4 0 0 1 24.8,0 v18.6 z" fill="none" stroke="#C7D1CF" stroke-width="1.8599999999999999"/><text x="400" y="340" text-anchor="middle" font-size="15" font-weight="700" fill="#0A544F">10 enfants qui devaient être vaccinés</text><text x="740" y="225" text-anchor="middle" font-size="44" font-weight="700" fill="#0A544F">=</text><text x="930" y="240" text-anchor="middle" font-size="64" font-weight="700" fill="#0A544F">80 %</text><text x="930" y="280" text-anchor="middle" font-size="18" font-weight="400" fill="#1A1F1E">de couverture</text><text x="930" y="310" text-anchor="middle" font-size="15" font-weight="400" fill="#4A5654">8 sur 10 ont été vaccinés.</text><text x="930" y="332" text-anchor="middle" font-size="15" font-weight="400" fill="#4A5654">Il en manque 2.</text><text x="600" y="410" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1F1E">C’est la question que pose chaque programme : est-ce qu’on atteint tout le monde, ou seulement une partie ?</text><text x="600" y="440" text-anchor="middle" font-size="15" font-weight="400" fill="#4A5654">Un nombre de vaccinés tout seul n’y répond pas. Il faut le comparer à tous ceux qu’il fallait vacciner.</text></svg>