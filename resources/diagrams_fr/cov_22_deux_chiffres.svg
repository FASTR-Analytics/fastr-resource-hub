<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect x="60" y="50" width="520" height="300" rx="12" fill="#EDF1F7" stroke="#21568C" stroke-width="2"/><text x="320" y="90" text-anchor="middle" font-size="20" font-weight="700" fill="#21568C">Le chiffre du haut</text><text x="320" y="118" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">les enfants vaccinés</text><rect x="230" y="170" width="110" height="70" rx="6" fill="#FFFFFF" stroke="#0A544F" stroke-width="3"/><polygon points="220,170 285.0,120 350,170" fill="#0C716B"/><rect x="273.0" y="200" width="24" height="60" fill="#C53030"/><rect x="255.0" y="218" width="60" height="24" fill="#C53030"/><text x="285.0" y="268" text-anchor="middle" font-size="16" font-weight="600" fill="#0A544F"></text><line x1="350" y1="205" x2="400" y2="205" stroke="#21568C" stroke-width="3" stroke-linecap="round"/><polyline points="388,212 400,205 388,198" fill="none" stroke="#21568C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="410" y="175" width="130" height="60" rx="8" fill="#FFFFFF" stroke="#21568C" stroke-width="2"/><text x="475" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#21568C">DHIS2</text><text x="475" y="222" text-anchor="middle" font-size="12" font-weight="400" fill="#4A5654">chaque mois</text><text x="320" y="280" text-anchor="middle" font-size="15" font-weight="600" fill="#1A1F1E">Compté un par un au centre de santé.</text><text x="320" y="306" text-anchor="middle" font-size="17" font-weight="700" fill="#21568C">Ce chiffre, on l’a.</text><rect x="620" y="50" width="520" height="300" rx="12" fill="#FDE8E8" stroke="#C53030" stroke-width="2"/><text x="880" y="90" text-anchor="middle" font-size="20" font-weight="700" fill="#C53030">Le chiffre du bas</text><text x="880" y="118" text-anchor="middle" font-size="15" font-weight="400" fill="#1A1F1E">tous les enfants qui devaient l’être</text><circle cx="700" cy="161.56" r="8.68" fill="#C53030"/><path d="M687.6,200 v-18.6 a12.4,12.4 0 0 1 24.8,0 v18.6 z" fill="#C53030"/><circle cx="740" cy="161.56" r="8.68" fill="#C53030"/><path d="M727.6,200 v-18.6 a12.4,12.4 0 0 1 24.8,0 v18.6 z" fill="#C53030"/><circle cx="780" cy="161.56" r="8.68" fill="#C53030"/><path d="M767.6,200 v-18.6 a12.4,12.4 0 0 1 24.8,0 v18.6 z" fill="#C53030"/><circle cx="820" cy="161.56" r="8.68" fill="#C53030"/><path d="M807.6,200 v-18.6 a12.4,12.4 0 0 1 24.8,0 v18.6 z" fill="#C53030"/><circle cx="860" cy="161.56" r="8.68" fill="#C53030"/><path d="M847.6,200 v-18.6 a12.4,12.4 0 0 1 24.8,0 v18.6 z" fill="#C53030"/><circle cx="900" cy="161.56" r="8.68" fill="#C53030"/><path d="M887.6,200 v-18.6 a12.4,12.4 0 0 1 24.8,0 v18.6 z" fill="#C53030"/><circle cx="940" cy="161.56" r="8.68" fill="none" stroke="#C7D1CF" stroke-width="1.8599999999999999"/><path d="M927.6,200 v-18.6 a12.4,12.4 0 0 1 24.8,0 v18.6 z" fill="none" stroke="#C7D1CF" stroke-width="1.8599999999999999"/><circle cx="980" cy="161.56" r="8.68" fill="none" stroke="#C7D1CF" stroke-width="1.8599999999999999"/><path d="M967.6,200 v-18.6 a12.4,12.4 0 0 1 24.8,0 v18.6 z" fill="none" stroke="#C7D1CF" stroke-width="1.8599999999999999"/><circle cx="1020" cy="161.56" r="8.68" fill="none" stroke="#C7D1CF" stroke-width="1.8599999999999999"/><path d="M1007.6,200 v-18.6 a12.4,12.4 0 0 1 24.8,0 v18.6 z" fill="none" stroke="#C7D1CF" stroke-width="1.8599999999999999"/><circle cx="1060" cy="161.56" r="8.68" fill="none" stroke="#C7D1CF" stroke-width="1.8599999999999999"/><path d="M1047.6,200 v-18.6 a12.4,12.4 0 0 1 24.8,0 v18.6 z" fill="none" stroke="#C7D1CF" stroke-width="1.8599999999999999"/><text x="1070" y="190" text-anchor="middle" font-size="60" font-weight="800" fill="#C53030">?</text><text x="880" y="280" text-anchor="middle" font-size="15" font-weight="600" fill="#1A1F1E">Ceux qui ne sont pas venus, personne ne les compte.</text><text x="880" y="306" text-anchor="middle" font-size="17" font-weight="700" fill="#C53030">Ce chiffre, il faut l’estimer.</text><text x="600" y="400" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1F1E">On appelle le chiffre du haut le numérateur, celui du bas le dénominateur.</text><text x="600" y="430" text-anchor="middle" font-size="16" font-weight="700" fill="#0A544F">Toute cette présentation porte sur le chiffre du bas : comment FASTR l’estime, et pourquoi cela change les résultats.</text></svg>