<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect x="60" y="70" width="520" height="250" rx="12" fill="#FFFFFF" stroke="#C53030" stroke-width="2"/><text x="320" y="102" text-anchor="middle" font-size="18" font-weight="700" fill="#C53030">Avant</text><text x="220" y="150" text-anchor="middle" font-size="26" font-weight="700" fill="#21568C">4 000</text><text x="220" y="172" text-anchor="middle" font-size="12" font-weight="400" fill="#4A5654">enfants vaccinés (DHIS2)</text><line x1="110" y1="188" x2="330" y2="188" stroke="#C53030" stroke-width="3"/><text x="220" y="222" text-anchor="middle" font-size="26" font-weight="700" fill="#C53030">5 000</text><text x="220" y="244" text-anchor="middle" font-size="12" font-weight="400" fill="#4A5654">recensement projeté, le même partout</text><text x="380" y="200" text-anchor="middle" font-size="30" font-weight="700" fill="#0A544F">=</text><text x="480" y="212" text-anchor="middle" font-size="48" font-weight="700" fill="#C53030">80 %</text><rect x="620" y="70" width="520" height="250" rx="12" fill="#FFFFFF" stroke="#0A544F" stroke-width="2"/><text x="880" y="102" text-anchor="middle" font-size="18" font-weight="700" fill="#0A544F">Avec FASTR</text><text x="780" y="150" text-anchor="middle" font-size="26" font-weight="700" fill="#21568C">4 000</text><text x="780" y="172" text-anchor="middle" font-size="12" font-weight="400" fill="#4A5654">enfants vaccinés (DHIS2)</text><line x1="670" y1="188" x2="890" y2="188" stroke="#0A544F" stroke-width="3"/><text x="780" y="222" text-anchor="middle" font-size="26" font-weight="700" fill="#0A544F">9 200</text><text x="780" y="244" text-anchor="middle" font-size="12" font-weight="400" fill="#4A5654">enquête + DHIS2 + cascade, par province</text><text x="940" y="200" text-anchor="middle" font-size="30" font-weight="700" fill="#0A544F">=</text><text x="1040" y="212" text-anchor="middle" font-size="48" font-weight="700" fill="#0A544F">43 %</text><text x="600" y="340" text-anchor="middle" font-size="14" font-weight="400" fill="#4A5654">Mêmes vaccinés, autre chiffre du bas.</text><circle cx="90" cy="376" r="16" fill="#501E50"/><text x="90" y="382" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">1</text><text x="120" y="382" text-anchor="start" font-size="15" font-weight="400" fill="#1A1F1E">L’enquête dit la part qui vient, DHIS2 dit combien sont venus : ensemble, le total.</text><circle cx="90" cy="418" r="16" fill="#0A544F"/><text x="90" y="424" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">2</text><text x="120" y="424" text-anchor="start" font-size="15" font-weight="400" fill="#1A1F1E">La cascade passe d’un âge à l’autre avec les taux du pays.</text><circle cx="90" cy="460" r="16" fill="#21568C"/><text x="90" y="466" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">3</text><text x="120" y="466" text-anchor="start" font-size="15" font-weight="400" fill="#1A1F1E">Quatre chaînes, une seule retenue pour tout, calée sur l’ONU. Puis la couverture, chaque année, chaque province.</text></svg>