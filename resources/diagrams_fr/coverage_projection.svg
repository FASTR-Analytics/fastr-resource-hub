<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #09544F; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #21568C; text-anchor: middle; }
      .value { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #09544F; text-anchor: middle; }
      .formula-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #7f8c8d; text-anchor: middle; }
      .axis { stroke: #dee2e6; stroke-width: 1; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #7f8c8d; }
      .projected-line { stroke: #1F9A9C; stroke-width: 2; stroke-dasharray: 5,3; }
      .hmis-line { stroke: #1A90C0; stroke-width: 2; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #21568C; }
    </style>
  </defs>

  <!-- Title -->
  <text class="title" x="300" y="20" text-anchor="middle">Projection de la couverture entre les enquêtes</text>

  <!-- Chart area background -->

  <!-- Y-axis -->
  <line class="axis" x1="80" y1="35" x2="80" y2="200"/>
  <text class="axis-label" x="30" y="120" text-anchor="middle" transform="rotate(-90, 30, 120)">Couverture (%)</text>

  <!-- X-axis -->
  <line class="axis" x1="80" y1="200" x2="500" y2="200"/>

  <!-- Grid lines (light) -->
  <line x1="80" y1="55" x2="500" y2="55" stroke="#f0f0f0" stroke-width="1"/>
  <line x1="80" y1="90" x2="500" y2="90" stroke="#f0f0f0" stroke-width="1"/>
  <line x1="80" y1="125" x2="500" y2="125" stroke="#f0f0f0" stroke-width="1"/>
  <line x1="80" y1="160" x2="500" y2="160" stroke="#f0f0f0" stroke-width="1"/>

  <!-- Y-axis ticks and labels -->
  <line class="axis" x1="75" y1="55" x2="80" y2="55"/>
  <text class="axis-label" x="70" y="59" text-anchor="end">100%</text>
  <line class="axis" x1="75" y1="90" x2="80" y2="90"/>
  <text class="axis-label" x="70" y="94" text-anchor="end">90%</text>
  <line class="axis" x1="75" y1="125" x2="80" y2="125"/>
  <text class="axis-label" x="70" y="129" text-anchor="end">80%</text>
  <line class="axis" x1="75" y1="160" x2="80" y2="160"/>
  <text class="axis-label" x="70" y="164" text-anchor="end">70%</text>

  <!-- X-axis labels (years) -->
  <text class="axis-label" x="140" y="215" text-anchor="middle">2020</text>
  <text class="axis-label" x="260" y="215" text-anchor="middle">2021</text>
  <text class="axis-label" x="380" y="215" text-anchor="middle">2022</text>
  <text class="axis-label" x="460" y="215" text-anchor="middle">2023</text>

  <!-- HMIS line (blue, continuous with points on each year) -->
  <!-- 2020=78%, 2021=80%, 2022=83%, 2023=85% -->
  <polyline class="hmis-line" points="140,153 260,139 380,118 460,97" fill="none"/>

  <!-- HMIS points on ALL years with values -->
  <circle cx="140" cy="153" r="4" fill="#1A90C0" stroke="#ffffff" stroke-width="1"/>
  <text class="formula-text" x="125" y="165">78%</text>

  <circle cx="260" cy="139" r="4" fill="#1A90C0" stroke="#ffffff" stroke-width="1"/>
  <text class="formula-text" x="245" y="150">80%</text>

  <circle cx="380" cy="118" r="4" fill="#1A90C0" stroke="#ffffff" stroke-width="1"/>
  <text class="formula-text" x="365" y="128">83%</text>

  <circle cx="460" cy="97" r="4" fill="#1A90C0" stroke="#ffffff" stroke-width="1"/>
  <text class="formula-text" x="475" y="107">85%</text>

  <!-- Survey anchor point (2020 = 82%, gold) -->
  <circle cx="140" cy="125" r="6" fill="#D8A822" stroke="#ffffff" stroke-width="2"/>
  <text class="value" x="155" y="120">82%</text>
  <text class="label" x="140" y="113">Enquête</text>

  <!-- Projected line (teal dashed, year by year) -->
  <!-- 2020=82% (survey), 2021=82+(80-78)=84%, 2022=82+(83-78)=87%, 2023=82+(85-78)=89% -->
  <polyline class="projected-line" points="140,125 260,111 380,90 460,69" fill="none"/>

  <!-- Projected points on each year -->
  <circle cx="260" cy="111" r="5" fill="#1F9A9C" stroke="#ffffff" stroke-width="1"/>
  <text class="value" x="275" y="105" style="fill: #0C716B;">84%</text>

  <circle cx="380" cy="90" r="5" fill="#1F9A9C" stroke="#ffffff" stroke-width="1"/>
  <text class="value" x="395" y="84" style="fill: #0C716B;">87%</text>

  <circle cx="460" cy="69" r="5" fill="#1F9A9C" stroke="#ffffff" stroke-width="1"/>
  <text class="value" x="475" y="63" style="fill: #0C716B;">89%</text>

  <!-- Legend -->
  <circle cx="560" cy="55" r="5" fill="#D8A822" stroke="#ffffff" stroke-width="1"/>
  <text class="legend-text" x="572" y="59">Enquête</text>
  <circle cx="560" cy="75" r="4" fill="#1A90C0" stroke="#ffffff" stroke-width="1"/>
  <text class="legend-text" x="572" y="79">Couverture SNIS</text>
  <circle cx="560" cy="95" r="5" fill="#1F9A9C" stroke="#ffffff" stroke-width="1"/>
  <text class="legend-text" x="572" y="99">Projetée</text>

</svg>
