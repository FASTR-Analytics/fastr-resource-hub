<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420">
  <defs>
    <style>
      .layer { rx: 10; stroke-width: 2; }
      .layer-dhis2 { fill: #09544F; stroke: #073B38; }
      .layer-coverage { fill: #0C716B; stroke: #09544F; }
      .layer-hfa { fill: #1F9A9C; stroke: #0C716B; }
      .layer-household { fill: #CAE6E9; stroke: #1F9A9C; }
      .lbl { font-family: Inter, sans-serif; font-size: 15px; font-weight: 700; fill: #fff; }
      .lbl-dark { font-family: Inter, sans-serif; font-size: 15px; font-weight: 700; fill: #09544F; }
      .sub { font-family: Inter, sans-serif; font-size: 11.5px; fill: #fff; opacity: 0.9; }
      .sub-dark { font-family: Inter, sans-serif; font-size: 11.5px; fill: #09544F; opacity: 0.75; }
      .q { font-family: Inter, sans-serif; font-size: 11px; fill: #fff; font-style: italic; opacity: 0.8; }
      .q-dark { font-family: Inter, sans-serif; font-size: 11px; fill: #09544F; font-style: italic; opacity: 0.65; }
      .freq { font-family: Inter, sans-serif; font-size: 10px; fill: #888; font-style: italic; }
    </style>
  </defs>

  <!-- Layer 1: DHIS2 (foundation, widest) -->
  <rect class="layer layer-dhis2" x="20" y="20" width="740" height="82"/>
  <text class="lbl" x="40" y="50">Utilisation des services DHIS2</text>
  <text class="sub" x="40" y="70">Rapports de routine — volumes, résultats, tendances</text>
  <text class="q" x="40" y="88">Que se passe-t-il avec les services ? Les volumes changent-ils ?</text>
  <text class="freq" x="720" y="50" text-anchor="end">Trimestriel</text>

  <!-- Layer 2: Coverage -->
  <rect class="layer layer-coverage" x="50" y="118" width="680" height="82"/>
  <text class="lbl" x="70" y="148">Estimations de couverture des services</text>
  <text class="sub" x="70" y="168">Données DHIS2 + dénominateurs de population → taux de couverture</text>
  <text class="q" x="70" y="186">Quelle part de la population est couverte ?</text>
  <text class="freq" x="690" y="148" text-anchor="end">Trimestriel</text>

  <!-- Layer 3: HFA -->
  <rect class="layer layer-hfa" x="80" y="216" width="620" height="82"/>
  <text class="lbl" x="100" y="246">Évaluations des établissements de santé</text>
  <text class="sub" x="100" y="266">Disponibilité, intrants, préparation des établissements</text>
  <text class="q" x="100" y="284">De quoi disposent les établissements ? Sont-ils prêts ?</text>
  <text class="freq" x="660" y="246" text-anchor="end">Si disponible</text>

  <!-- Layer 4: Household surveys -->
  <rect class="layer layer-household" x="110" y="314" width="560" height="82"/>
  <text class="lbl-dark" x="130" y="344">Enquêtes auprès des ménages</text>
  <text class="sub-dark" x="130" y="364">EDS, MICS — indicateurs d'impact au niveau population</text>
  <text class="q-dark" x="130" y="382">Que vivent les communautés ?</text>
  <text class="freq" x="630" y="344" text-anchor="end">Périodique</text>
</svg>
