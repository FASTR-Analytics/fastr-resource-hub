<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 50 1140 540">
  <defs>
    <style>
      /* FASTR Brand Colors */
      .box-main { fill: #D8A822; stroke: #09544F; stroke-width: 2; }
      .box-dpt { fill: #1F9A9C; stroke: #09544F; stroke-width: 2; }
      .box-measles { fill: #1F9A9C; stroke: #09544F; stroke-width: 2; }
      .box-adjustment { fill: #0C716B; stroke: #09544F; stroke-width: 2; }
      .box-formula { fill: #0C716B; stroke: #09544F; stroke-width: 2; }

      .text-white { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
      .text-dark { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #09544F; text-anchor: middle; }
      .text-teal { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
      .text-formula { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #ffffff; text-anchor: middle; }

      .arrow-forward { stroke: #0C716B; stroke-width: 3; fill: none; marker-end: url(#arrowhead-teal); }
      .arrow-back { stroke: #FF6462; stroke-width: 2; fill: none; marker-end: url(#arrowhead-coral); stroke-dasharray: 6,3; }
      .arrow-down { stroke: #0C716B; stroke-width: 2; fill: none; marker-end: url(#arrowhead-teal-small); }

      .default-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #09544F; }
      .default-value { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #09544F; }
      .footnote { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #666; }
    </style>
    <marker id="arrowhead-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0C716B"/>
    </marker>
    <marker id="arrowhead-teal-small" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0C716B"/>
    </marker>
    <marker id="arrowhead-coral" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF6462"/>
    </marker>
  </defs>


  <!-- Big arrow - outline only -->
  <polygon points="50,65 1100,65 1100,60 1150,80 1100,100 1100,95 50,95" fill="none" stroke="#0C716B" stroke-width="3"/>

  <!-- ==================== ROW 1: Main flow boxes ==================== -->

  <!-- Box 1: Pregnancies (center=95) -->
  <rect class="box-main" x="40" y="140" width="110" height="70" rx="6"/>
  <text class="text-dark" x="95" y="180">#Grossesses</text>

  <!-- Forward arrow 1 -->
  <line class="arrow-forward" x1="150" y1="175" x2="220" y2="175"/>
  <!-- Back arrow 1 -->
  <path class="arrow-back" d="M 220 160 Q 185 140, 150 160"/>

  <!-- Box 2: Deliveries (center=295) -->
  <rect class="box-main" x="225" y="140" width="140" height="70" rx="6"/>
  <text class="text-dark" x="295" y="180">#Accouchements</text>

  <!-- Forward arrow 2 -->
  <line class="arrow-forward" x1="365" y1="175" x2="410" y2="175"/>
  <!-- Back arrow 2 -->
  <path class="arrow-back" d="M 410 160 Q 387 140, 365 160"/>

  <!-- Box 3: Births (center=475) -->
  <rect class="box-main" x="420" y="140" width="110" height="70" rx="6"/>
  <text class="text-dark" x="475" y="180">#Naissances</text>

  <!-- Forward arrow 3 -->
  <line class="arrow-forward" x1="530" y1="175" x2="600" y2="175"/>
  <!-- Back arrow 3 -->
  <path class="arrow-back" d="M 600 160 Q 565 140, 530 160"/>

  <!-- Box 4: Live births (center=665) -->
  <rect class="box-main" x="610" y="140" width="110" height="70" rx="6"/>
  <text class="text-dark" x="665" y="172">#Naissances</text>
  <text class="text-dark" x="665" y="188">vivantes</text>

  <!-- Forward arrow 4 -->
  <line class="arrow-forward" x1="720" y1="175" x2="790" y2="175"/>
  <!-- Back arrow 4 -->
  <path class="arrow-back" d="M 790 160 Q 755 140, 720 160"/>

  <!-- Box 5: Infants eligible for DPT1 (center=860) -->
  <rect class="box-dpt" x="800" y="140" width="120" height="70" rx="6"/>
  <text class="text-teal" x="860" y="168">#Nourrissons</text>
  <text class="text-teal" x="860" y="185">éligibles</text>
  <text class="text-teal" x="860" y="202">DTC1</text>

  <!-- Forward arrow 5 -->
  <line class="arrow-forward" x1="920" y1="175" x2="990" y2="175"/>
  <!-- Back arrow 5 -->
  <path class="arrow-back" d="M 990 160 Q 955 140, 920 160"/>

  <!-- Box 6: Infants eligible for measles (center=1060) -->
  <rect class="box-measles" x="1000" y="140" width="120" height="70" rx="6"/>
  <text class="text-teal" x="1060" y="168">#Nourrissons</text>
  <text class="text-teal" x="1060" y="185">éligibles</text>
  <text class="text-teal" x="1060" y="202">rougeole</text>

  <!-- ==================== Adjustment boxes (centered between main boxes) ==================== -->

  <!-- Down arrow 1 (midpoint between Pregnancies and Deliveries = 190) -->
  <line class="arrow-down" x1="190" y1="210" x2="190" y2="245"/>

  <!-- Adjustment box 1: Remove pregnancy losses (center=190) -->
  <rect class="box-adjustment" x="130" y="255" width="120" height="60" rx="6"/>
  <text class="text-white" x="190" y="278">Retirer</text>
  <text class="text-white" x="190" y="294">#pertes de</text>
  <text class="text-white" x="190" y="310">grossesse</text>

  <!-- Down arrow 2 (midpoint between Deliveries and Births = 380) -->
  <line class="arrow-down" x1="380" y1="210" x2="380" y2="245"/>

  <!-- Adjustment box 2: Add half of twins (center=380) -->
  <rect class="box-adjustment" x="320" y="255" width="120" height="60" rx="6"/>
  <text class="text-white" x="380" y="282">Ajouter moitié</text>
  <text class="text-white" x="380" y="298">des jumeaux</text>

  <!-- Down arrow 3 (midpoint between Births and Live births = 570) -->
  <line class="arrow-down" x1="570" y1="210" x2="570" y2="245"/>

  <!-- Adjustment box 3: Remove stillbirths (center=570) -->
  <rect class="box-adjustment" x="510" y="255" width="120" height="60" rx="6"/>
  <text class="text-white" x="570" y="282">Retirer</text>
  <text class="text-white" x="570" y="298">#mort-nés</text>

  <!-- Down arrow 4 (midpoint between Live births and DPT1 = 760) -->
  <line class="arrow-down" x1="760" y1="210" x2="760" y2="245"/>

  <!-- Adjustment box 4: Remove neonatal deaths (center=760) -->
  <rect class="box-adjustment" x="700" y="255" width="120" height="60" rx="6"/>
  <text class="text-white" x="760" y="278">Retirer</text>
  <text class="text-white" x="760" y="294">#décès</text>
  <text class="text-white" x="760" y="310">néonatals</text>

  <!-- Down arrow 5 (midpoint between DPT1 and Measles = 960) -->
  <line class="arrow-down" x1="960" y1="210" x2="960" y2="245"/>

  <!-- Adjustment box 5: Remove deaths 1-9 months (center=960) -->
  <rect class="box-adjustment" x="900" y="255" width="120" height="60" rx="6"/>
  <text class="text-white" x="960" y="278">Retirer</text>
  <text class="text-white" x="960" y="294">#décès 1-9</text>
  <text class="text-white" x="960" y="310">mois</text>

  <!-- ==================== ROW 3: Formula boxes (under corresponding main boxes) ==================== -->

  <!-- Formula box 1: Deliveries formula (center=285, under Deliveries box) -->
  <rect class="box-formula" x="197" y="360" width="175" height="80" rx="6"/>
  <text class="text-formula" x="285" y="385">#Accouchements =</text>
  <text class="text-formula" x="285" y="401">#Grossesses* (1-</text>
  <text class="text-formula" x="285" y="417">Taux perte grossesse)</text>

  <!-- Formula box 2: Births formula (center=475, under Births box) -->
  <rect class="box-formula" x="392" y="360" width="165" height="80" rx="6"/>
  <text class="text-formula" x="475" y="385">#Naissances =</text>
  <text class="text-formula" x="475" y="401">#Accouchements/(1-</text>
  <text class="text-formula" x="475" y="417">(taux jumeaux)/2)</text>

  <!-- Formula box 3: Live births formula (center=665, under Live births box) -->
  <rect class="box-formula" x="582" y="360" width="165" height="80" rx="6"/>
  <text class="text-formula" x="665" y="385">#Naiss. vivantes =</text>
  <text class="text-formula" x="665" y="401">#Accouchements* (1-</text>
  <text class="text-formula" x="665" y="417">Taux mortinatalité)</text>

  <!-- Formula box 4: DPT1 formula (center=860, under DPT1 box) -->
  <rect class="box-formula" x="767" y="360" width="185" height="80" rx="6"/>
  <text class="text-formula" x="860" y="385">#Nourrissons éligibles</text>
  <text class="text-formula" x="860" y="401">DTC1 = #Naiss.</text>
  <text class="text-formula" x="860" y="417">vivantes * (1- TMN)</text>

  <!-- Formula box 5: Measles formula (center=1060, under Measles box) -->
  <rect class="box-formula" x="962" y="360" width="195" height="80" rx="6"/>
  <text class="text-formula" x="1060" y="378">#Nourrissons éligibles</text>
  <text class="text-formula" x="1060" y="394">rougeole = #Nourr.</text>
  <text class="text-formula" x="1060" y="410">élig. DTC1 *</text>
  <text class="text-formula" x="1060" y="426">(1- TMPN)</text>

  <!-- ==================== Default values section ==================== -->

  <!-- Background for defaults -->
  <rect x="40" y="470" width="1120" height="70" fill="#CAE6E9" rx="6"/>

  <!-- Default values label -->
  <text class="default-label" x="60" y="495">Valeurs par</text>
  <text class="default-label" x="60" y="515">défaut*</text>

  <!-- Separator line -->
  <line x1="160" y1="480" x2="160" y2="530" stroke="#0C716B" stroke-width="2"/>

  <!-- Default values (aligned with formula boxes above) -->
  <text class="default-value" x="285" y="505" text-anchor="middle">Taux perte</text>
  <text class="default-value" x="285" y="525" text-anchor="middle">grossesse = 0,03</text>

  <text class="default-value" x="475" y="515" text-anchor="middle">Taux jumeaux = 0,015</text>

  <text class="default-value" x="665" y="515" text-anchor="middle">Taux mortinatalité = 0,02</text>

  <text class="default-value" x="860" y="515" text-anchor="middle">TMN = 0,03</text>

  <text class="default-value" x="1060" y="515" text-anchor="middle">TMPN = 0,02</text>

  <!-- Footnote -->
  <text class="footnote" x="40" y="570">*L'approche FASTR utilise les valeurs spécifiques au pays pour le taux de mortinatalité, TMN, TMPN et TMI si disponibles via EDS/MICS</text>

</svg>
