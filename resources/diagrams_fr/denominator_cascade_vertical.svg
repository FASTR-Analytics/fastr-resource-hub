<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 750">
  <defs>
    <style>
      .pop { fill: #D8A822; stroke: #09544F; stroke-width: 2; }
      .child { fill: #0C716B; stroke: #09544F; stroke-width: 2; }
      .entry { fill: #1F9A9C; stroke: #09544F; stroke-width: 1.5; }
      .wpp { fill: #CAE6E9; stroke: #09544F; stroke-width: 1.5; }
      .adj { fill: #E8F4F3; stroke: #0C716B; stroke-width: 1; }
      .t-w { font-family: Inter, -apple-system, sans-serif; font-weight: 700; fill: #fff; text-anchor: middle; }
      .t-d { font-family: Inter, -apple-system, sans-serif; font-weight: 700; fill: #09544F; text-anchor: middle; }
      .t-e { font-family: Inter, -apple-system, sans-serif; font-size: 10px; font-weight: 600; fill: #fff; text-anchor: middle; }
      .t-adj { font-family: Inter, -apple-system, sans-serif; font-size: 9px; fill: #0C716B; text-anchor: middle; }
      .t-note { font-family: Inter, -apple-system, sans-serif; font-size: 9px; fill: #666; text-anchor: middle; }
      .t-wpp { font-family: Inter, -apple-system, sans-serif; font-size: 10px; font-weight: 600; fill: #09544F; text-anchor: middle; }
    </style>
    <marker id="ad" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#09544F"/>
    </marker>
    <marker id="ae" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#1F9A9C"/>
    </marker>
    <marker id="aw" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#0C716B"/>
    </marker>
  </defs>

  <!-- ============ LAYER 1: ALL LINES (background) ============ -->

  <!-- Cascade vertical arrows -->
  <line x1="285" y1="74" x2="285" y2="113" stroke="#09544F" stroke-width="2" marker-end="url(#ad)"/>
  <line x1="285" y1="162" x2="285" y2="201" stroke="#09544F" stroke-width="2" marker-end="url(#ad)"/>
  <line x1="285" y1="250" x2="285" y2="289" stroke="#09544F" stroke-width="2" marker-end="url(#ad)"/>
  <line x1="285" y1="338" x2="285" y2="377" stroke="#09544F" stroke-width="2" marker-end="url(#ad)"/>
  <line x1="285" y1="426" x2="285" y2="465" stroke="#09544F" stroke-width="2" marker-end="url(#ad)"/>
  <line x1="285" y1="514" x2="285" y2="553" stroke="#09544F" stroke-width="2" marker-end="url(#ad)"/>

  <!-- HMIS entry point horizontal arrows (left → cascade) -->
  <line x1="115" y1="52" x2="193" y2="52" stroke="#1F9A9C" stroke-width="2" marker-end="url(#ae)"/>
  <line x1="115" y1="140" x2="193" y2="140" stroke="#1F9A9C" stroke-width="2" marker-end="url(#ae)"/>
  <line x1="115" y1="316" x2="193" y2="316" stroke="#1F9A9C" stroke-width="2" marker-end="url(#ae)"/>
  <line x1="115" y1="404" x2="193" y2="404" stroke="#1F9A9C" stroke-width="2" marker-end="url(#ae)"/>

  <!-- UN WPP dashed lines (right → cascade) -->
  <path d="M 500,211 L 500,52 L 377,52" stroke="#0C716B" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#aw)"/>
  <path d="M 500,245 L 500,404 L 377,404" stroke="#0C716B" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#aw)"/>

  <!-- ============ LAYER 2: ALL BOXES (foreground) ============ -->

  <!-- Cascade population boxes -->
  <rect class="pop" x="195" y="30" width="180" height="44" rx="5"/>
  <text class="t-d" x="285" y="56" font-size="13">Grossesses</text>

  <rect class="pop" x="195" y="118" width="180" height="44" rx="5"/>
  <text class="t-d" x="285" y="144" font-size="13">Accouchements</text>

  <rect class="pop" x="195" y="206" width="180" height="44" rx="5"/>
  <text class="t-d" x="285" y="232" font-size="13">Naissances totales</text>

  <rect class="pop" x="195" y="294" width="180" height="44" rx="5"/>
  <text class="t-d" x="285" y="320" font-size="13">Naissances vivantes</text>

  <rect class="child" x="195" y="382" width="180" height="44" rx="5"/>
  <text class="t-w" x="285" y="408" font-size="13">Éligibles DTC1</text>

  <rect class="child" x="195" y="470" width="180" height="44" rx="5"/>
  <text class="t-w" x="285" y="496" font-size="13">Éligibles rougeole 1</text>

  <rect class="child" x="195" y="558" width="180" height="44" rx="5"/>
  <text class="t-w" x="285" y="584" font-size="13">Éligibles rougeole 2</text>

  <!-- Adjustment boxes (between cascade boxes) -->
  <rect class="adj" x="305" y="80" width="130" height="22" rx="3"/>
  <text class="t-adj" x="370" y="95">– pertes grossesse (3%)</text>

  <rect class="adj" x="305" y="168" width="130" height="22" rx="3"/>
  <text class="t-adj" x="370" y="183">+ jumeaux (1,5%)</text>

  <rect class="adj" x="305" y="256" width="130" height="22" rx="3"/>
  <text class="t-adj" x="370" y="271">– mort-nés (2%)</text>

  <rect class="adj" x="305" y="344" width="130" height="22" rx="3"/>
  <text class="t-adj" x="370" y="359">– décès néonatals (3,9%)</text>

  <rect class="adj" x="305" y="432" width="140" height="22" rx="3"/>
  <text class="t-adj" x="375" y="447">– décès post-néon. (2,8%)</text>

  <rect class="adj" x="305" y="520" width="140" height="22" rx="3"/>
  <text class="t-adj" x="375" y="535">– décès post-néon. (×2)</text>

  <!-- HMIS entry point pills (left) -->
  <rect class="entry" x="15" y="35" width="100" height="34" rx="17" ry="17"/>
  <text class="t-e" x="65" y="50">CPN1</text>
  <text class="t-e" x="65" y="61" style="font-size:8px">÷ couv. CPN1</text>

  <rect class="entry" x="15" y="123" width="100" height="34" rx="17" ry="17"/>
  <text class="t-e" x="65" y="138">Accouchement</text>
  <text class="t-e" x="65" y="149" style="font-size:8px">÷ couv. SBA</text>

  <rect class="entry" x="15" y="299" width="100" height="34" rx="17" ry="17"/>
  <text class="t-e" x="65" y="314">BCG</text>
  <text class="t-e" x="65" y="325" style="font-size:8px">÷ couv. BCG</text>

  <rect class="entry" x="15" y="387" width="100" height="34" rx="17" ry="17"/>
  <text class="t-e" x="65" y="402">Penta1</text>
  <text class="t-e" x="65" y="413" style="font-size:8px">÷ couv. Penta1</text>

  <!-- UN WPP pill (right) -->
  <rect class="wpp" x="450" y="211" width="100" height="34" rx="17" ry="17"/>
  <text class="t-wpp" x="500" y="232">ONU WPP</text>

  <!-- ============ LAYER 3: NOTES ============ -->

  <rect x="15" y="625" width="530" height="45" fill="#E8F4F3" rx="5"/>
  <text font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F" x="280" y="643" text-anchor="middle">Chaque point d'entrée produit une estimation indépendante du dénominateur.</text>
  <text font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F" x="280" y="659" text-anchor="middle">FASTR teste toutes les chaînes et garde celle qui colle le mieux aux enquêtes (EDS/MICS).</text>

  <text class="t-note" x="280" y="690">Taux par défaut du module. FASTR utilise les taux spécifiques au pays quand disponibles.</text>

</svg>
