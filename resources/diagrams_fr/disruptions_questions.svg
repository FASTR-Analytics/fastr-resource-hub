<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340">
  <defs>
    <style>
      .box { rx: 10; stroke-width: 2; }
      .box-trigger { fill: #C53030; stroke: #9B2C2C; }
      .box-q { fill: #E8F4F3; stroke: #0C716B; }
      .box-fastr { fill: #09544F; stroke: #073B38; }
      .title-text { font-family: Inter, sans-serif; font-size: 14px; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; }
      .title-dark { font-family: Inter, sans-serif; font-size: 13px; font-weight: 700; fill: #09544F; text-anchor: middle; }
      .q-text { font-family: Inter, sans-serif; font-size: 11.5px; fill: #09544F; text-anchor: middle; }
      .fastr-text { font-family: Inter, sans-serif; font-size: 12px; fill: #fff; text-anchor: middle; }
      .arrow { stroke: #1F9A9C; stroke-width: 2.5; fill: none; marker-end: url(#arr); }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1F9A9C"/>
    </marker>
  </defs>

  <!-- Trigger box -->
  <rect class="box box-trigger" x="220" y="15" width="340" height="45"/>
  <text class="title-text" x="390" y="38">Changements majeurs du financement externe</text>

  <!-- Tree connector: trigger → question boxes -->
  <line x1="390" y1="60" x2="390" y2="75" stroke="#1F9A9C" stroke-width="2.5"/>
  <line x1="102" y1="75" x2="675" y2="75" stroke="#1F9A9C" stroke-width="2.5"/>
  <line x1="102" y1="75" x2="102" y2="85" stroke="#1F9A9C" stroke-width="2.5"/>
  <line x1="292" y1="75" x2="292" y2="85" stroke="#1F9A9C" stroke-width="2.5"/>
  <line x1="482" y1="75" x2="482" y2="85" stroke="#1F9A9C" stroke-width="2.5"/>
  <line x1="675" y1="75" x2="675" y2="85" stroke="#1F9A9C" stroke-width="2.5"/>
  <polygon points="96,85 102,92 108,85" fill="#1F9A9C"/>
  <polygon points="286,85 292,92 298,85" fill="#1F9A9C"/>
  <polygon points="476,85 482,92 488,85" fill="#1F9A9C"/>
  <polygon points="669,85 675,92 681,85" fill="#1F9A9C"/>

  <!-- 4 question boxes in a row -->
  <rect class="box box-q" x="15" y="90" width="175" height="80"/>
  <text class="title-dark" x="102" y="115">Quelle ampleur ?</text>
  <text class="q-text" x="102" y="135">Quels programmes</text>
  <text class="q-text" x="102" y="150">et zones touchés ?</text>

  <rect class="box box-q" x="205" y="90" width="175" height="80"/>
  <text class="title-dark" x="292" y="115">Quels effets ?</text>
  <text class="q-text" x="292" y="135">Volumes de services</text>
  <text class="q-text" x="292" y="150">en baisse ? Où ?</text>

  <rect class="box box-q" x="395" y="90" width="175" height="80"/>
  <text class="title-dark" x="482" y="115">Comment prioriser ?</text>
  <text class="q-text" x="482" y="135">Services et populations</text>
  <text class="q-text" x="482" y="150">les plus vulnérables ?</text>

  <rect class="box box-q" x="585" y="90" width="180" height="80"/>
  <text class="title-dark" x="675" y="115">Comment protéger ?</text>
  <text class="q-text" x="675" y="135">Actions pour préserver</text>
  <text class="q-text" x="675" y="150">les services SRMNIA-N ?</text>

  <!-- Arrows down to FASTR (explicit polygons for precise placement) -->
  <line x1="102" y1="170" x2="102" y2="198" stroke="#1F9A9C" stroke-width="2.5"/>
  <polygon points="96,198 102,205 108,198" fill="#1F9A9C"/>
  <line x1="292" y1="170" x2="292" y2="198" stroke="#1F9A9C" stroke-width="2.5"/>
  <polygon points="286,198 292,205 298,198" fill="#1F9A9C"/>
  <line x1="482" y1="170" x2="482" y2="198" stroke="#1F9A9C" stroke-width="2.5"/>
  <polygon points="476,198 482,205 488,198" fill="#1F9A9C"/>
  <line x1="675" y1="170" x2="675" y2="198" stroke="#1F9A9C" stroke-width="2.5"/>
  <polygon points="669,198 675,205 681,198" fill="#1F9A9C"/>

  <!-- FASTR response bar -->
  <rect class="box box-fastr" x="15" y="205" width="750" height="50"/>
  <text class="title-text" x="390" y="225">FASTR : socle analytique avec les données existantes</text>
  <text class="fastr-text" x="390" y="243">Réponses rapides à partir des données DHIS2 déjà collectées</text>

  <!-- Bottom: what FASTR enables (arrows point to box centers) -->
  <line x1="195" y1="255" x2="195" y2="278" stroke="#1F9A9C" stroke-width="2.5"/>
  <polygon points="189,278 195,285 201,278" fill="#1F9A9C"/>
  <line x1="460" y1="255" x2="460" y2="278" stroke="#1F9A9C" stroke-width="2.5"/>
  <polygon points="454,278 460,285 466,278" fill="#1F9A9C"/>
  <line x1="680" y1="255" x2="680" y2="278" stroke="#1F9A9C" stroke-width="2.5"/>
  <polygon points="674,278 680,285 686,278" fill="#1F9A9C"/>

  <rect class="box" x="65" y="285" width="260" height="40" fill="#CAE6E9" stroke="#1F9A9C"/>
  <text class="q-text" x="195" y="309">Détecter les perturbations tôt</text>

  <rect class="box" x="345" y="285" width="230" height="40" fill="#CAE6E9" stroke="#1F9A9C"/>
  <text class="q-text" x="460" y="309">Éclairer l'allocation des ressources</text>

  <rect class="box" x="595" y="285" width="170" height="40" fill="#CAE6E9" stroke="#1F9A9C"/>
  <text class="q-text" x="680" y="309">Plaider avec des preuves</text>
</svg>
