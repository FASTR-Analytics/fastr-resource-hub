<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320">

  <!-- Card 1: Discernement -->
  <g transform="translate(15, 20)">
    <rect x="0" y="0" width="155" height="260" rx="10" fill="#E8F4F3"/>
    <circle cx="78" cy="40" r="22" fill="#09544F"/>
    <text x="78" y="35" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" fill="#fff" dominant-baseline="central">&#x1F50D;</text>
    <text x="78" y="82" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#09544F">Discernement</text>
    <line x1="20" y1="95" x2="135" y2="95" stroke="#CAE6E9" stroke-width="1.5"/>
    <text x="78" y="115" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">Est-ce que je sais à quoi</text>
    <text x="78" y="129" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">ressemble un bon résultat ?</text>
    <text x="78" y="155" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">Savoir à quoi ressemble</text>
    <text x="78" y="168" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">une bonne réponse avant</text>
    <text x="78" y="181" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">de demander — et pourquoi</text>
    <line x1="20" y1="198" x2="135" y2="198" stroke="#CAE6E9" stroke-width="1"/>
    <text x="78" y="218" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#777" font-style="italic">« Cette tendance CPN1</text>
    <text x="78" y="230" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#777" font-style="italic">correspond-elle à ce que</text>
    <text x="78" y="242" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#777" font-style="italic">je vois dans le graphique ? »</text>
  </g>

  <!-- Card 2: Description -->
  <g transform="translate(185, 20)">
    <rect x="0" y="0" width="155" height="260" rx="10" fill="#E8F4F3"/>
    <circle cx="78" cy="40" r="22" fill="#0C716B"/>
    <text x="78" y="35" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" fill="#fff" dominant-baseline="central">&#x1F4AC;</text>
    <text x="78" y="82" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#09544F">Description</text>
    <line x1="20" y1="95" x2="135" y2="95" stroke="#CAE6E9" stroke-width="1.5"/>
    <text x="78" y="115" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">Est-ce que je sais</text>
    <text x="78" y="129" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">expliquer ce que je veux ?</text>
    <text x="78" y="155" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">Préciser quoi, où, quand</text>
    <text x="78" y="168" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">et pour qui — plus vous</text>
    <text x="78" y="181" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">êtes précis, mieux c'est</text>
    <line x1="20" y1="198" x2="135" y2="198" stroke="#CAE6E9" stroke-width="1"/>
    <text x="78" y="218" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#777" font-style="italic">« Montre CPN1 par</text>
    <text x="78" y="230" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#777" font-style="italic">région sur les</text>
    <text x="78" y="242" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#777" font-style="italic">12 derniers mois »</text>
  </g>

  <!-- Card 3: Délégation -->
  <g transform="translate(355, 20)">
    <rect x="0" y="0" width="155" height="260" rx="10" fill="#E8F4F3"/>
    <circle cx="78" cy="40" r="22" fill="#1F9A9C"/>
    <text x="78" y="35" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" fill="#fff" dominant-baseline="central">&#x1F4CB;</text>
    <text x="78" y="82" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#09544F">Délégation</text>
    <line x1="20" y1="95" x2="135" y2="95" stroke="#CAE6E9" stroke-width="1.5"/>
    <text x="78" y="115" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">Est-ce que je donne</text>
    <text x="78" y="129" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">la bonne tâche à l'IA ?</text>
    <text x="78" y="155" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">Découper les grandes</text>
    <text x="78" y="168" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">tâches en étapes — demandez</text>
    <text x="78" y="181" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">une chose, vérifiez, puis passez</text>
    <line x1="20" y1="198" x2="135" y2="198" stroke="#CAE6E9" stroke-width="1"/>
    <text x="78" y="218" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#777" font-style="italic">« D'abord les données,</text>
    <text x="78" y="230" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#777" font-style="italic">puis l'interprétation,</text>
    <text x="78" y="242" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#777" font-style="italic">puis les diapositives »</text>
  </g>

  <!-- Card 4: Diligence -->
  <g transform="translate(525, 20)">
    <rect x="0" y="0" width="155" height="260" rx="10" fill="#E8F4F3"/>
    <circle cx="78" cy="40" r="22" fill="#09544F"/>
    <text x="78" y="35" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" fill="#fff" dominant-baseline="central">&#x2714;</text>
    <text x="78" y="82" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#09544F">Diligence</text>
    <line x1="20" y1="95" x2="135" y2="95" stroke="#CAE6E9" stroke-width="1.5"/>
    <text x="78" y="115" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">Est-ce que je suis</text>
    <text x="78" y="129" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#09544F">rigoureux ?</text>
    <text x="78" y="155" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">Vérifier les résultats avec</text>
    <text x="78" y="168" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">les données et votre expertise</text>
    <text x="78" y="181" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#555">— mettriez-vous votre nom dessus ?</text>
    <line x1="20" y1="198" x2="135" y2="198" stroke="#CAE6E9" stroke-width="1"/>
    <text x="78" y="218" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#777" font-style="italic">« Est-ce cohérent avec</text>
    <text x="78" y="230" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#777" font-style="italic">ce que je connais</text>
    <text x="78" y="242" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="#777" font-style="italic">de mon pays ? »</text>
  </g>

  <!-- Bottom note -->
  <text x="350" y="308" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#777" font-style="italic">L'IA s'améliore au fur et à mesure que vous développez ces quatre compétences</text>

</svg>
