<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" font-family="Inter, sans-serif">
  <text x="14" y="24" font-size="16" font-weight="700" fill="#09544F">FILTRER<tspan font-weight="400" fill="#5A6B6A"> = choisir ce qu'on affiche</tspan></text>

  <!-- avant : tous les indicateurs disponibles -->
  <text x="14" y="45" font-size="9.5" font-weight="600" fill="#6b7a78">Tous les indicateurs sont disponibles</text>
  <rect x="14" y="50" width="150" height="82" rx="3" fill="#ffffff" stroke="#D6E6E4"/>
  <line x1="14" y1="60" x2="164" y2="60" stroke="#EDF3F2"/>
  <line x1="14" y1="84" x2="164" y2="84" stroke="#EDF3F2"/>
  <line x1="14" y1="106" x2="164" y2="106" stroke="#EDF3F2"/>
  <g stroke="#9fb3b0" fill="#ffffff">
    <rect x="22" y="56" width="9" height="9" rx="1.5"/>
    <rect x="22" y="78" width="9" height="9" rx="1.5"/>
    <rect x="22" y="100" width="9" height="9" rx="1.5"/>
    <rect x="22" y="122" width="9" height="9" rx="1.5"/>
  </g>
  <text x="40" y="64" font-size="8.5" fill="#3f4f4d">CPN1</text>
  <text x="40" y="86" font-size="8.5" fill="#3f4f4d">CPN4</text>
  <text x="40" y="108" font-size="8.5" fill="#3f4f4d">BCG</text>
  <text x="40" y="130" font-size="8.5" fill="#3f4f4d">Penta</text>

  <!-- flèche -->
  <text x="200" y="84" font-size="9" font-weight="600" fill="#09544F" text-anchor="middle">cocher</text>
  <text x="200" y="96" font-size="9" font-weight="700" fill="#09544F" text-anchor="middle">CPN1</text>
  <polyline points="176,104 226,104" fill="none" stroke="#09544F" stroke-width="3"/>
  <polyline points="218,97 226,104 218,111" fill="none" stroke="#09544F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- après : CPN1 coché, seul CPN1 s'affiche -->
  <text x="246" y="45" font-size="9.5" font-weight="600" fill="#09544F">Vous cochez CPN1 → seul CPN1 s'affiche</text>
  <rect x="246" y="50" width="150" height="82" rx="3" fill="#ffffff" stroke="#D6E6E4"/>
  <line x1="246" y1="60" x2="396" y2="60" stroke="#EDF3F2"/>
  <line x1="246" y1="84" x2="396" y2="84" stroke="#EDF3F2"/>
  <line x1="246" y1="106" x2="396" y2="106" stroke="#EDF3F2"/>
  <rect x="254" y="56" width="9" height="9" rx="1.5" fill="#1F9A9C" stroke="#1F9A9C"/>
  <polyline points="256,60.5 258,62.5 261.5,57.5" fill="none" stroke="#ffffff" stroke-width="1.3"/>
  <text x="272" y="64" font-size="8.5" font-weight="700" fill="#09544F">CPN1</text>
  <g stroke="#d8e0de" fill="#ffffff"><rect x="254" y="78" width="9" height="9" rx="1.5"/><rect x="254" y="100" width="9" height="9" rx="1.5"/><rect x="254" y="122" width="9" height="9" rx="1.5"/></g>
  <text x="272" y="86" font-size="8.5" fill="#cdd6d4">CPN4</text>
  <text x="272" y="108" font-size="8.5" fill="#cdd6d4">BCG</text>
  <text x="272" y="130" font-size="8.5" fill="#cdd6d4">Penta</text>

  <!-- légende -->
  <text x="424" y="74" font-size="11.5" font-weight="700" fill="#0C716B">Vous choisissez ce que vous voulez voir.</text>
  <text x="424" y="93" font-size="10.5" fill="#5A6B6A">Ce que vous ne cochez pas</text>
  <text x="424" y="108" font-size="10.5" fill="#5A6B6A">ne s'affiche pas — comme un projecteur.</text>
</svg>
