<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450">
  <style>
    .title { font-family: Arial, sans-serif; font-size: 24px; fill: #4a5568; }
    .title-teal { font-family: Arial, sans-serif; font-size: 24px; fill: #0d7377; }
    .center-text { font-family: Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #1e3a5f; }
    .circle-text { font-family: Arial, sans-serif; font-size: 14px; fill: #4a5568; }
    .annotation { font-family: Arial, sans-serif; font-size: 11px; fill: #4a5568; }
    .box-text { font-family: Arial, sans-serif; font-size: 16px; fill: white; font-weight: 500; }
  </style>

  <!-- LEFT DIAGRAM: Mesures générales -->

  <!-- Title -->
  <text x="250" y="35" text-anchor="middle" class="title">Mesures générales</text>

  <!-- Outer gray arc/ring -->
  <circle cx="250" cy="240" r="130" fill="none" stroke="#9ca3af" stroke-width="12"/>

  <!-- Center circle with Qualité des données -->
  <circle cx="250" cy="240" r="65" fill="white" stroke="#e5e7eb" stroke-width="2"/>
  <text x="250" y="225" text-anchor="middle" class="center-text">Qualité des</text>
  <text x="250" y="255" text-anchor="middle" class="center-text">données</text>

  <!-- Exactitude circle (top) -->
  <circle cx="250" cy="110" r="45" fill="white" stroke="#e5e7eb" stroke-width="2"/>
  <text x="250" y="115" text-anchor="middle" class="circle-text">Exactitude</text>

  <!-- Cohérence circle (right) -->
  <circle cx="380" cy="240" r="45" fill="white" stroke="#e5e7eb" stroke-width="2"/>
  <text x="380" y="245" text-anchor="middle" class="circle-text">Cohérence</text>

  <!-- Ponctualité circle (bottom) -->
  <circle cx="250" cy="370" r="45" fill="white" stroke="#e5e7eb" stroke-width="2"/>
  <text x="250" y="375" text-anchor="middle" class="circle-text">Ponctualité</text>

  <!-- Complétude circle (left) -->
  <circle cx="120" cy="240" r="45" fill="white" stroke="#e5e7eb" stroke-width="2"/>
  <text x="120" y="245" text-anchor="middle" class="circle-text">Complétude</text>

  <!-- Annotations -->
  <!-- Exactitude annotation -->
  <text x="330" y="75" class="annotation">Les données reflètent-</text>
  <text x="330" y="88" class="annotation">elles la réalité sur</text>
  <text x="330" y="101" class="annotation">le terrain ?</text>

  <!-- Cohérence annotation -->
  <text x="435" y="220" class="annotation">Les relations sont-</text>
  <text x="435" y="233" class="annotation">elles cohérentes ?</text>

  <!-- Ponctualité annotation -->
  <text x="310" y="380" class="annotation">Les données sont-elles</text>
  <text x="310" y="393" class="annotation">régulièrement soumises</text>
  <text x="310" y="406" class="annotation">à temps ?</text>

  <!-- Complétude annotation -->
  <text x="15" y="200" class="annotation">Toutes les données</text>
  <text x="15" y="213" class="annotation">sont-elles présentes ?</text>

  <!-- RIGHT DIAGRAM: Mesures FASTR -->

  <!-- Title -->
  <text x="700" y="35" text-anchor="middle" class="title-teal">Mesures FASTR</text>

  <!-- Connecting lines -->
  <line x1="700" y1="135" x2="700" y2="185" stroke="#0d7377" stroke-width="2"/>
  <line x1="700" y1="255" x2="605" y2="295" stroke="#0d7377" stroke-width="2"/>
  <line x1="700" y1="255" x2="795" y2="295" stroke="#0d7377" stroke-width="2"/>

  <!-- Complétude des indicateurs box (top) -->
  <rect x="600" y="60" width="200" height="75" rx="12" ry="12" fill="#0d7377"/>
  <text x="700" y="93" text-anchor="middle" class="box-text">Complétude des</text>
  <text x="700" y="115" text-anchor="middle" class="box-text">indicateurs</text>

  <!-- Score AQD box (center) -->
  <rect x="620" y="185" width="160" height="70" rx="12" ry="12" fill="#0d7377"/>
  <text x="700" y="227" text-anchor="middle" class="box-text">Score AQD</text>

  <!-- Présence de valeurs aberrantes box (bottom left) -->
  <rect x="510" y="295" width="150" height="80" rx="12" ry="12" fill="#0d7377"/>
  <text x="585" y="320" text-anchor="middle" class="box-text">Présence de</text>
  <text x="585" y="342" text-anchor="middle" class="box-text">valeurs aberrantes</text>

  <!-- Cohérence entre indicateurs liés box (bottom right) -->
  <rect x="740" y="295" width="140" height="80" rx="12" ry="12" fill="#0d7377"/>
  <text x="810" y="320" text-anchor="middle" class="box-text">Cohérence entre</text>
  <text x="810" y="342" text-anchor="middle" class="box-text">indicateurs</text>
  <text x="810" y="364" text-anchor="middle" class="box-text">liés</text>
</svg>
