<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <defs>
    <style>
      .icon-primary { fill: #1F9A9C; }
      .icon-dark { fill: #0C716B; }
      .icon-deep { fill: #09544F; }
      .icon-blue { fill: #1A90C0; }
      .icon-navy { fill: #21568C; }
      .icon-gold { fill: #D8A822; }
      .icon-orchid { fill: #BD5091; }
      .label-text {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 15px;
        font-weight: 600;
        fill: #09544F;
        text-anchor: middle;
      }
      .label-text-small {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 14px;
        font-weight: 600;
        fill: #09544F;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" rx="16" ry="16" fill="#ffffff" stroke="#CAE6E9" stroke-width="3"/>

  <!-- ===== ROW 1 ===== -->

  <!-- 1. Partager vos expériences honnêtement — Chat bubbles -->
  <g transform="translate(150, 60)">
    <!-- Back bubble -->
    <rect x="-40" y="-10" width="65" height="45" rx="10" ry="10" class="icon-dark"/>
    <polygon points="-10,35 -20,50 0,35" class="icon-dark"/>
    <!-- Front bubble -->
    <rect x="-10" y="10" width="65" height="45" rx="10" ry="10" class="icon-primary"/>
    <polygon points="25,55 35,70 15,55" class="icon-primary"/>
    <!-- Lines inside front bubble -->
    <line x1="2" y1="26" x2="42" y2="26" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="2" y1="36" x2="32" y2="36" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="2" y1="46" x2="22" y2="46" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text class="label-text" x="8" y="115">Partager vos expériences</text>
    <text class="label-text" x="8" y="135">honnêtement</text>
  </g>

  <!-- 2. Poser des questions — Question mark -->
  <g transform="translate(395, 60)">
    <circle cx="0" cy="35" r="50" fill="#CAE6E9" opacity="0.4"/>
    <text x="0" y="58" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="85" font-weight="700" fill="#1A90C0">?</text>
    <text class="label-text" x="0" y="115">Poser des questions</text>
  </g>

  <!-- 3. Respecter la confidentialité — Safe/vault -->
  <g transform="translate(610, 60)">
    <!-- Safe body -->
    <rect x="-38" y="-5" width="76" height="76" rx="6" ry="6" class="icon-navy"/>
    <!-- Inner border -->
    <rect x="-28" y="5" width="56" height="56" rx="3" ry="3" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Lock circle -->
    <circle cx="0" cy="33" r="14" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Lock dot -->
    <circle cx="0" cy="33" r="4" fill="#ffffff"/>
    <!-- Handle -->
    <rect x="42" y="25" width="6" height="16" rx="2" ry="2" class="icon-navy"/>
    <text class="label-text-small" x="0" y="115">Respecter la</text>
    <text class="label-text-small" x="0" y="135">confidentialité de l'espace</text>
  </g>

  <!-- 4. Limiter l'utilisation de la technologie — Phone with X -->
  <g transform="translate(850, 60)">
    <!-- Phone body tilted -->
    <g transform="rotate(-15, 0, 35)">
      <rect x="-25" y="-5" width="50" height="76" rx="8" ry="8" class="icon-orchid"/>
      <!-- Screen -->
      <rect x="-18" y="5" width="36" height="50" rx="2" ry="2" fill="#ffffff" opacity="0.25"/>
      <!-- X on screen -->
      <line x1="-10" y1="18" x2="10" y2="42" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <line x1="10" y1="18" x2="-10" y2="42" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <!-- Home button area -->
      <circle cx="0" cy="63" r="4" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    </g>
    <text class="label-text" x="0" y="115">Limiter l'utilisation</text>
    <text class="label-text" x="0" y="135">de la technologie</text>
  </g>

  <!-- ===== ROW 2 (centered 3 items) ===== -->

  <!-- 5. Respecter les horaires — Clock -->
  <g transform="translate(225, 310)">
    <!-- Clock outer ring -->
    <circle cx="0" cy="35" r="42" fill="none" stroke="#D8A822" stroke-width="6"/>
    <!-- Notch top -->
    <rect x="-4" y="-11" width="8" height="12" rx="2" ry="2" fill="#D8A822"/>
    <!-- Clock face -->
    <circle cx="0" cy="35" r="34" fill="none" stroke="#D8A822" stroke-width="3"/>
    <!-- Hour hand -->
    <line x1="0" y1="35" x2="0" y2="14" stroke="#D8A822" stroke-width="4" stroke-linecap="round"/>
    <!-- Minute hand -->
    <line x1="0" y1="35" x2="18" y2="25" stroke="#D8A822" stroke-width="3" stroke-linecap="round"/>
    <!-- Center dot -->
    <circle cx="0" cy="35" r="3" fill="#D8A822"/>
    <text class="label-text" x="0" y="115">Respecter les horaires</text>
  </g>

  <!-- 6. Respecter les perspectives des autres — Ear/listening -->
  <g transform="translate(530, 310)">
    <!-- Ear shape -->
    <path d="M10,0 C35,-5 55,15 55,40 C55,60 40,80 20,80 C10,80 5,75 5,65"
          fill="none" stroke="#0C716B" stroke-width="6" stroke-linecap="round"/>
    <!-- Inner ear -->
    <path d="M25,22 C40,22 45,35 42,48 C40,55 33,60 25,58"
          fill="none" stroke="#0C716B" stroke-width="4" stroke-linecap="round"/>
    <!-- Sound waves -->
    <path d="M-15,25 C-25,35 -25,50 -15,60" fill="none" stroke="#1F9A9C" stroke-width="3" stroke-linecap="round"/>
    <path d="M-28,18 C-42,33 -42,55 -28,68" fill="none" stroke="#1F9A9C" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <text class="label-text-small" x="12" y="115">Respecter les perspectives</text>
    <text class="label-text-small" x="12" y="135">des autres</text>
  </g>

  <!-- 7. Parler lentement et dans le micro — Microphone -->
  <g transform="translate(835, 310)">
    <!-- Mic head -->
    <rect x="-16" y="-5" width="32" height="50" rx="16" ry="16" class="icon-deep"/>
    <!-- Mic lines -->
    <line x1="-6" y1="10" x2="6" y2="10" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-8" y1="18" x2="8" y2="18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-8" y1="26" x2="8" y2="26" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-6" y1="34" x2="6" y2="34" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Mic arm -->
    <path d="M-26,30 C-26,58 26,58 26,30" fill="none" stroke="#09544F" stroke-width="5" stroke-linecap="round"/>
    <!-- Mic stand -->
    <line x1="0" y1="58" x2="0" y2="78" stroke="#09544F" stroke-width="5" stroke-linecap="round"/>
    <!-- Mic base -->
    <line x1="-14" y1="78" x2="14" y2="78" stroke="#09544F" stroke-width="5" stroke-linecap="round"/>
    <text class="label-text-small" x="0" y="115">Parler lentement</text>
    <text class="label-text-small" x="0" y="135">et dans le micro</text>
  </g>

</svg>
