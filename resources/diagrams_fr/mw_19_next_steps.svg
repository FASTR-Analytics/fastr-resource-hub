<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Inter, Arial, sans-serif">
  <!-- Stepper connector line -->
  <line x1="30" y1="54" x2="30" y2="338" stroke="#CAE6E9" stroke-width="2"/>
  <!-- Column divider -->
  <line x1="260" y1="14" x2="260" y2="398" stroke="#E8F4F3" stroke-width="1.5"/>

  <!-- Row 1 -->
  <circle cx="30" cy="36" r="18" fill="#09544F"/>
  <text x="30" y="36" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="14" font-weight="bold">1</text>
  <text x="62" y="36" dominant-baseline="central" fill="#09544F" font-size="14" font-weight="bold">Voyage</text>
  <text x="276" y="36" dominant-baseline="central" fill="#555" font-size="12.5">Finaliser les préparatifs et l'itinéraire</text>

  <!-- Row 2 -->
  <circle cx="30" cy="100" r="18" fill="#09544F"/>
  <text x="30" y="100" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="14" font-weight="bold">2</text>
  <text x="62" y="100" dominant-baseline="central" fill="#09544F" font-size="14" font-weight="bold">Invitations</text>
  <text x="276" y="100" dominant-baseline="central" fill="#555" font-size="12.5">Lettres d'invitation du ministère de la Santé</text>

  <!-- Row 3 -->
  <circle cx="30" cy="164" r="18" fill="#09544F"/>
  <text x="30" y="164" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="14" font-weight="bold">3</text>
  <text x="62" y="164" dominant-baseline="central" fill="#09544F" font-size="14" font-weight="bold">Plateforme</text>
  <text x="276" y="164" dominant-baseline="central" fill="#555" font-size="12.5">S'inscrire et se connecter avant l'atelier</text>

  <!-- Row 4 -->
  <circle cx="30" cy="228" r="18" fill="#09544F"/>
  <text x="30" y="228" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="14" font-weight="bold">4</text>
  <text x="62" y="228" dominant-baseline="central" fill="#09544F" font-size="14" font-weight="bold">Collaboration</text>
  <text x="276" y="228" dominant-baseline="central" fill="#555" font-size="12.5">Rejoindre la page collaborative FASTR</text>

  <!-- Row 5 -->
  <circle cx="30" cy="292" r="18" fill="#09544F"/>
  <text x="30" y="292" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="14" font-weight="bold">5</text>
  <text x="62" y="292" dominant-baseline="central" fill="#09544F" font-size="14" font-weight="bold">Évaluation</text>
  <text x="276" y="292" dominant-baseline="central" fill="#555" font-size="12.5">Compléter l'auto-évaluation au début de l'atelier</text>

  <!-- Row 6 -->
  <circle cx="30" cy="356" r="18" fill="#09544F"/>
  <text x="30" y="356" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="14" font-weight="bold">6</text>
  <text x="62" y="356" dominant-baseline="central" fill="#09544F" font-size="14" font-weight="bold">Affiches</text>
  <text x="276" y="356" dominant-baseline="central" fill="#555" font-size="12.5">Créer des affiches pays pour l'apprentissage</text>
</svg>
