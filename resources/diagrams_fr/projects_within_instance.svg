<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380">
  <defs>
    <style>
      .card { fill: #ffffff; stroke: #1F9A9C; stroke-width: 1.5; }
      .card-head { fill: #1F9A9C; }
      .card-head-alt { fill: #0C716B; }
      .t-title { font-family: Inter, -apple-system, sans-serif; font-weight: 700; fill: #fff; text-anchor: middle; font-size: 11px; }
      .t-ind { font-family: Inter, -apple-system, sans-serif; font-size: 9px; fill: #555; }
      .t-label { font-family: Inter, -apple-system, sans-serif; font-size: 9px; fill: #0C716B; font-weight: 600; }
    </style>
  </defs>

  <!-- Country platform container -->
  <rect x="20" y="20" width="660" height="340" rx="14" fill="#F8F9FA" stroke="#09544F" stroke-width="2.5"/>
  <rect x="20" y="20" width="220" height="32" rx="8" fill="#09544F"/>
  <text x="130" y="41" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#fff">Plateforme pays</text>

  <!-- Subtitle -->
  <text x="350" y="80" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#666">Chaque projet regroupe un ensemble d'indicateurs pour un usage précis</text>

  <!-- ===== Project 1: Department ===== -->
  <g transform="translate(45, 100)">
    <rect class="card" width="190" height="220" rx="10"/>
    <rect class="card-head" width="190" height="30" rx="10"/>
    <rect class="card-head" x="0" y="20" width="190" height="10"/>
    <text class="t-title" x="95" y="22">Nutrition</text>

    <!-- Type label -->
    <rect x="48" y="38" width="94" height="18" rx="9" fill="#E8F4F3"/>
    <text class="t-label" x="95" y="50" text-anchor="middle">Département</text>

    <!-- Indicators -->
    <text class="t-ind" x="20" y="78">Indicateurs du projet :</text>
    <circle cx="26" cy="96" r="3" fill="#1F9A9C"/>
    <text class="t-ind" x="35" y="99">Prévalence retard de croissance</text>
    <circle cx="26" cy="114" r="3" fill="#1F9A9C"/>
    <text class="t-ind" x="35" y="117">Prévalence émaciation</text>
    <circle cx="26" cy="132" r="3" fill="#1F9A9C"/>
    <text class="t-ind" x="35" y="135">Couverture vitamine A</text>
    <circle cx="26" cy="150" r="3" fill="#1F9A9C"/>
    <text class="t-ind" x="35" y="153">Faible poids de naissance</text>
    <circle cx="26" cy="168" r="3" fill="#CAE6E9"/>
    <text class="t-ind" x="35" y="171" fill="#999">...</text>

    <!-- Team note -->
    <rect x="10" y="188" width="170" height="22" rx="4" fill="#F0FAF9"/>
    <text font-family="Inter, sans-serif" font-size="8" fill="#0C716B" x="95" y="203" text-anchor="middle">L'équipe nutrition travaille ici</text>
  </g>

  <!-- ===== Project 2: Product ===== -->
  <g transform="translate(255, 100)">
    <rect class="card" width="190" height="220" rx="10" stroke="#0C716B"/>
    <rect class="card-head-alt" width="190" height="30" rx="10"/>
    <rect class="card-head-alt" x="0" y="20" width="190" height="10"/>
    <text class="t-title" x="95" y="22">Bulletin trimestriel</text>

    <!-- Type label -->
    <rect x="63" y="38" width="64" height="18" rx="9" fill="#E8F4F3"/>
    <text class="t-label" x="95" y="50" text-anchor="middle">Produit</text>

    <!-- Indicators -->
    <text class="t-ind" x="20" y="78">Indicateurs du projet :</text>
    <circle cx="26" cy="96" r="3" fill="#0C716B"/>
    <text class="t-ind" x="35" y="99">Couverture CPN4+</text>
    <circle cx="26" cy="114" r="3" fill="#0C716B"/>
    <text class="t-ind" x="35" y="117">Couverture Penta3</text>
    <circle cx="26" cy="132" r="3" fill="#0C716B"/>
    <text class="t-ind" x="35" y="135">Accouchements assistés</text>
    <circle cx="26" cy="150" r="3" fill="#0C716B"/>
    <text class="t-ind" x="35" y="153">Consultations externes</text>
    <circle cx="26" cy="168" r="3" fill="#CAE6E9"/>
    <text class="t-ind" x="35" y="171" fill="#999">...</text>

    <!-- Team note -->
    <rect x="10" y="188" width="170" height="22" rx="4" fill="#F0FAF9"/>
    <text font-family="Inter, sans-serif" font-size="8" fill="#0C716B" x="95" y="203" text-anchor="middle">Tous les programmes, un seul rapport</text>
  </g>

  <!-- ===== Project 3: Suivi &amp; évaluation ===== -->
  <g transform="translate(465, 100)">
    <rect class="card" width="190" height="220" rx="10"/>
    <rect class="card-head" width="190" height="30" rx="10"/>
    <rect class="card-head" x="0" y="20" width="190" height="10"/>
    <text class="t-title" x="95" y="22">Suivi &amp; évaluation</text>

    <!-- Type label -->
    <rect x="43" y="38" width="104" height="18" rx="9" fill="#E8F4F3"/>
    <text class="t-label" x="95" y="50" text-anchor="middle">Outil de suivi</text>

    <!-- Indicators -->
    <text class="t-ind" x="20" y="78">Indicateurs du projet :</text>
    <circle cx="26" cy="96" r="3" fill="#1F9A9C"/>
    <text class="t-ind" x="35" y="99">Indicateurs de résultat</text>
    <circle cx="26" cy="114" r="3" fill="#1F9A9C"/>
    <text class="t-ind" x="35" y="117">Indicateurs de processus</text>
    <circle cx="26" cy="132" r="3" fill="#1F9A9C"/>
    <text class="t-ind" x="35" y="135">Marqueurs d'équité</text>
    <circle cx="26" cy="150" r="3" fill="#1F9A9C"/>
    <text class="t-ind" x="35" y="153">Indicateurs de couverture</text>
    <circle cx="26" cy="168" r="3" fill="#CAE6E9"/>
    <text class="t-ind" x="35" y="171" fill="#999">...</text>

    <!-- Team note -->
    <rect x="10" y="188" width="170" height="22" rx="4" fill="#F0FAF9"/>
    <text font-family="Inter, sans-serif" font-size="8" fill="#0C716B" x="95" y="203" text-anchor="middle">L'équipe S&amp;E travaille ici</text>
  </g>

</svg>
