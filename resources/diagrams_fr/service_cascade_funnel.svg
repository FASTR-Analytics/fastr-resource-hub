<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300">

  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#09544F">Cascade de services : chaque étape perd des patientes</text>

  <!-- Step 1: CPN1 -->
  <g transform="translate(30, 50)">
    <rect x="0" y="0" width="140" height="160" rx="10" fill="#09544F"/>
    <text x="70" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#fff">CPN1</text>
    <text x="70" y="55" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#CAE6E9">Première visite prénatale</text>
    <line x1="20" y1="70" x2="120" y2="70" stroke="#1F9A9C" stroke-width="1"/>
    <text x="70" y="100" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#fff">1000</text>
    <text x="70" y="125" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#CAE6E9">femmes</text>
    <rect x="25" y="138" width="90" height="16" rx="4" fill="#1F9A9C"/>
    <text x="70" y="150" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#fff">100% entrent</text>
  </g>

  <!-- Arrow 1 with dropout -->
  <g transform="translate(170, 100)">
    <polyline points="0,30 25,30" stroke="#C53030" stroke-width="2" fill="none"/>
    <text x="12" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#C53030">-15%</text>
    <text x="12" y="55" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#777">abandon</text>
  </g>

  <!-- Step 2: CPN4 -->
  <g transform="translate(195, 60)">
    <rect x="0" y="0" width="130" height="140" rx="10" fill="#0C716B"/>
    <text x="65" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#fff">CPN4</text>
    <text x="65" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#CAE6E9">Quatrième visite</text>
    <line x1="15" y1="62" x2="115" y2="62" stroke="#1F9A9C" stroke-width="1"/>
    <text x="65" y="90" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#fff">850</text>
    <text x="65" y="112" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#CAE6E9">femmes</text>
    <rect x="20" y="122" width="90" height="14" rx="4" fill="#1F9A9C"/>
    <text x="65" y="133" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#fff">85% restent</text>
  </g>

  <!-- Arrow 2 with dropout -->
  <g transform="translate(325, 105)">
    <polyline points="0,25 25,25" stroke="#C53030" stroke-width="2" fill="none"/>
    <text x="12" y="13" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#C53030">-20%</text>
    <text x="12" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#777">abandon</text>
  </g>

  <!-- Step 3: Accouchement -->
  <g transform="translate(350, 70)">
    <rect x="0" y="0" width="125" height="130" rx="10" fill="#1F9A9C"/>
    <text x="62" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#fff">Accouchement</text>
    <text x="62" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#E8F4F3">En établissement</text>
    <line x1="15" y1="62" x2="110" y2="62" stroke="#0C716B" stroke-width="1"/>
    <text x="62" y="88" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#fff">680</text>
    <text x="62" y="108" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#E8F4F3">femmes</text>
    <rect x="18" y="116" width="90" height="14" rx="4" fill="#0C716B"/>
    <text x="62" y="127" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#fff">68% restent</text>
  </g>

  <!-- Arrow 3 with dropout -->
  <g transform="translate(475, 110)">
    <polyline points="0,25 25,25" stroke="#C53030" stroke-width="2" fill="none"/>
    <text x="12" y="13" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#C53030">-25%</text>
    <text x="12" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#777">abandon</text>
  </g>

  <!-- Step 4: CPoN -->
  <g transform="translate(500, 80)">
    <rect x="0" y="0" width="115" height="120" rx="10" fill="#CAE6E9"/>
    <text x="58" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#09544F">CPoN</text>
    <text x="58" y="48" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#0C716B">Soins postnatals</text>
    <line x1="12" y1="58" x2="103" y2="58" stroke="#0C716B" stroke-width="1"/>
    <text x="58" y="84" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#09544F">510</text>
    <text x="58" y="104" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#0C716B">femmes</text>
  </g>

  <!-- Bottom: Formula -->
  <rect x="100" y="235" width="500" height="42" rx="8" fill="#E8F4F3"/>
  <text x="350" y="255" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#09544F">Taux d'abandon % = (Étape précédente - Étape suivante) / Étape précédente x 100</text>
  <text x="350" y="270" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#777">Exemple : (1000 - 510) / 1000 x 100 = 49% d'abandon total de CPN1 à CPoN</text>

</svg>
