<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">

  <!-- Flowing connector path -->
  <path d="M120,65 C240,65 200,185 350,185 C500,185 460,305 580,305 C460,305 500,425 350,425"
        fill="none" stroke="#CAE6E9" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round"/>

  <!-- === Node 1: Plateforme === -->
  <circle cx="120" cy="65" r="42" fill="#09544F"/>
  <circle cx="120" cy="65" r="48" fill="none" stroke="#09544F" stroke-width="1.5" opacity="0.3"/>
  <g transform="translate(120,65)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-16" y="-18" width="32" height="24" rx="2"/>
    <line x1="0" y1="6" x2="0" y2="12"/>
    <line x1="-7" y1="12" x2="7" y2="12"/>
    <polyline points="-6,-8 -2,-1 3,-6 8,0"/>
  </g>
  <!-- Text pill -->
  <rect x="185" y="30" width="440" height="70" rx="35" fill="#09544F" opacity="0.06"/>
  <rect x="185" y="30" width="440" height="70" rx="35" fill="none" stroke="#09544F" stroke-width="1.5"/>
  <text x="405" y="58" text-anchor="middle" fill="#09544F" font-size="14" font-weight="600">Comment utiliser la plateforme analytique FASTR</text>
  <text x="405" y="79" text-anchor="middle" fill="#09544F" font-size="14">pour développer vos propres analyses et résultats.</text>

  <!-- === Node 2: Interpréter === -->
  <circle cx="350" cy="185" r="42" fill="#1A90C0"/>
  <circle cx="350" cy="185" r="48" fill="none" stroke="#1A90C0" stroke-width="1.5" opacity="0.3"/>
  <g transform="translate(350,185)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-8,6 C-8,-2 -12,-14 0,-18 C12,-14 8,-2 8,6Z"/>
    <line x1="-5" y1="10" x2="5" y2="10"/>
    <line x1="-3" y1="13" x2="3" y2="13"/>
    <line x1="0" y1="6" x2="0" y2="-4"/>
    <line x1="-4" y1="-1" x2="4" y2="-1"/>
  </g>
  <!-- Text pill - left (3 lines for longer FR text) -->
  <rect x="5" y="143" width="305" height="85" rx="35" fill="#1A90C0" opacity="0.06"/>
  <rect x="5" y="143" width="305" height="85" rx="35" fill="none" stroke="#1A90C0" stroke-width="1.5"/>
  <text x="157" y="170" text-anchor="middle" fill="#21568C" font-size="14" font-weight="600">Comment interpréter les résultats,</text>
  <text x="157" y="190" text-anchor="middle" fill="#21568C" font-size="14">générer des enseignements</text>
  <text x="157" y="210" text-anchor="middle" fill="#21568C" font-size="14">et créer des messages clés.</text>

  <!-- === Node 3: Coaching par les pairs === -->
  <circle cx="580" cy="305" r="42" fill="#BD5091"/>
  <circle cx="580" cy="305" r="48" fill="none" stroke="#BD5091" stroke-width="1.5" opacity="0.3"/>
  <g transform="translate(580,305)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="-10" r="5"/>
    <path d="M-10,8 C-10,0 -6,-4 0,-4 C6,-4 10,0 10,8"/>
    <circle cx="-14" cy="-6" r="3.5" opacity="0.6"/>
    <path d="M-21,8 C-21,2 -18,-2 -14,-2 C-11,-2 -10,-1 -9,0" opacity="0.6"/>
    <circle cx="14" cy="-6" r="3.5" opacity="0.6"/>
    <path d="M21,8 C21,2 18,-2 14,-2 C11,-2 10,-1 9,0" opacity="0.6"/>
  </g>
  <!-- Text pill - left (wider for FR) -->
  <rect x="160" y="270" width="380" height="70" rx="35" fill="#BD5091" opacity="0.06"/>
  <rect x="160" y="270" width="380" height="70" rx="35" fill="none" stroke="#BD5091" stroke-width="1.5"/>
  <text x="350" y="298" text-anchor="middle" fill="#7A1F6E" font-size="14" font-weight="600">Retours d'expérience du coaching par les pairs</text>
  <text x="350" y="319" text-anchor="middle" fill="#7A1F6E" font-size="14">pour accélérer l'apprentissage.</text>

  <!-- === Node 4: Plans d'action === -->
  <circle cx="350" cy="425" r="42" fill="#D8A822"/>
  <circle cx="350" cy="425" r="48" fill="none" stroke="#D8A822" stroke-width="1.5" opacity="0.3"/>
  <g transform="translate(350,425)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-12" y="-15" width="24" height="30" rx="2"/>
    <rect x="-5" y="-19" width="10" height="6" rx="1.5"/>
    <line x1="-5" y1="-4" x2="6" y2="-4"/>
    <line x1="-5" y1="2" x2="6" y2="2"/>
    <line x1="-5" y1="8" x2="2" y2="8"/>
    <polyline points="4,6 7,9 12,3" stroke-width="2.5"/>
  </g>
  <!-- Text pill - right (3 lines for longer FR text) -->
  <rect x="420" y="387" width="280" height="82" rx="35" fill="#D8A822" opacity="0.06"/>
  <rect x="420" y="387" width="280" height="82" rx="35" fill="none" stroke="#D8A822" stroke-width="1.5"/>
  <text x="560" y="410" text-anchor="middle" fill="#8B6B00" font-size="14" font-weight="600">Élaborer des plans d'action</text>
  <text x="560" y="429" text-anchor="middle" fill="#8B6B00" font-size="14">et des produits de connaissances</text>
  <text x="560" y="448" text-anchor="middle" fill="#8B6B00" font-size="14">pour la prise de décision.</text>

</svg>
