<text x="110" y="182" text-anchor="middle" font-family='Inter, "Helvetica Neue", Arial, sans-serif' font-size="15.5" font-weight="700" fill="#20415c">
<tspan x="110" dy="0">Monitorização do uso</tspan>
<tspan x="110" dy="19">de serviços SRMNIA-N</tspan>
</text>
<text x="110" y="230" text-anchor="middle" font-family='Inter, "Helvetica Neue", Arial, sans-serif' font-size="11.5" fill="#4d4d4d">
<tspan x="110" dy="0">Usar dados do HMIS para</tspan>
<tspan x="110" dy="15.5">monitorizar mudanças na</tspan>
<tspan x="110" dy="15.5">cobertura dos serviços durante</tspan>
<tspan x="110" dy="15.5">reformas, choques ou em</tspan>
<tspan x="110" dy="15.5">populações vulneráveis, e tratar</tspan>
<tspan x="110" dy="15.5">problemas de qualidade dos</tspan>
<tspan x="110" dy="15.5">dados.</tspan>
</text>
<text x="350" y="182" text-anchor="middle" font-family='Inter, "Helvetica Neue", Arial, sans-serif' font-size="15.5" font-weight="700" fill="#20415c">
<tspan x="350" dy="0">Inquéritos telefónicos</tspan>
<tspan x="350" dy="19">rápidos a unidades</tspan>
</text>
<text x="350" y="230" text-anchor="middle" font-family='Inter, "Helvetica Neue", Arial, sans-serif' font-size="11.5" fill="#4d4d4d">
<tspan x="350" dy="0">Avaliar lacunas nos cuidados</tspan>
<tspan x="350" dy="15.5">de saúde primários e o impacto</tspan>
<tspan x="350" dy="15.5">de reformas ou choques no</tspan>
<tspan x="350" dy="15.5">desempenho dos CSP.</tspan>
</text>
<text x="590" y="182" text-anchor="middle" font-family='Inter, "Helvetica Neue", Arial, sans-serif' font-size="15.5" font-weight="700" fill="#20415c">
<tspan x="590" dy="0">Inquéritos rápidos a</tspan>
<tspan x="590" dy="19">agregados e utentes</tspan>
</text>
<text x="590" y="230" text-anchor="middle" font-family='Inter, "Helvetica Neue", Arial, sans-serif' font-size="11.5" fill="#4d4d4d">
<tspan x="590" dy="0">Captar o uso de serviços, os</tspan>
<tspan x="590" dy="15.5">cuidados não procurados e as</tspan>
<tspan x="590" dy="15.5">perceções da comunidade sobre</tspan>
<tspan x="590" dy="15.5">a qualidade do serviço.</tspan>
</text>
<text x="830" y="182" text-anchor="middle" font-family='Inter, "Helvetica Neue", Arial, sans-serif' font-size="15.5" font-weight="700" fill="#20415c">
<tspan x="830" dy="0">Análises de seguimento</tspan>
<tspan x="830" dy="19">aprofundadas</tspan>
</text>
<text x="830" y="230" text-anchor="middle" font-family='Inter, "Helvetica Neue", Arial, sans-serif' font-size="11.5" fill="#4d4d4d">
<tspan x="830" dy="0">Diagnosticar causas</tspan>
<tspan x="830" dy="15.5">subjacentes e avaliar os</tspan>
<tspan x="830" dy="15.5">contextos de implementação.</tspan>
</text>
<text x="470" y="572" text-anchor="middle" font-family='Inter, "Helvetica Neue", Arial, sans-serif' font-size="16.0" font-weight="700" fill="#ffffff">Reforço de capacidades + apoio ao uso de dados</text>
<text x="470" y="596" text-anchor="middle" font-family='Inter, "Helvetica Neue", Arial, sans-serif' font-size="11.5" fill="#ffffff">
<tspan x="470" dy="0">Reforçar a capacidade nacional de recolha, análise e uso de dados —</tspan>
<tspan x="470" dy="16">incluindo revisões de dados e ciclos de retroação subnacionais.</tspan>
</text></g></svg>