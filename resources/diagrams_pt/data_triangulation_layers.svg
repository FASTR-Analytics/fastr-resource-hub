<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420">
  <defs>
    <style>
      .layer { rx: 10; stroke-width: 2; }
      .layer-dhis2 { fill: #09544F; stroke: #073B38; }
      .layer-coverage { fill: #0C716B; stroke: #09544F; }
      .layer-hfa { fill: #1F9A9C; stroke: #0C716B; }
      .layer-household { fill: #CAE6E9; stroke: #1F9A9C; }
      .lbl { font-family: Inter, sans-serif; font-size: 15px; font-weight: 700; fill: #fff; }
      .lbl-dark { font-family: Inter, sans-serif; font-size: 15px; font-weight: 700; fill: #09544F; }
      .sub { font-family: Inter, sans-serif; font-size: 11.5px; fill: #fff; opacity: 0.9; }
      .sub-dark { font-family: Inter, sans-serif; font-size: 11.5px; fill: #09544F; opacity: 0.75; }
      .q { font-family: Inter, sans-serif; font-size: 11px; fill: #fff; font-style: italic; opacity: 0.8; }
      .q-dark { font-family: Inter, sans-serif; font-size: 11px; fill: #09544F; font-style: italic; opacity: 0.65; }
      .freq { font-family: Inter, sans-serif; font-size: 10px; fill: #888; font-style: italic; }
    </style>
  </defs>

  <!-- Layer 1: DHIS2 (foundation, widest) -->
  <rect class="layer layer-dhis2" x="20" y="20" width="740" height="82"/>
  <text class="lbl" x="40" y="50">Utilização do serviço DHIS2</text>
  <text class="sub" x="40" y="70">Relatórios de rotina das instalações - volumes de serviços, resultados, tendências</text>
  <text class="q" x="40" y="88">O que está a acontecer com os serviços? Os volumes estão a mudar?</text>
  <text class="freq" x="720" y="50" text-anchor="end">Trimestral</text>

  <!-- Layer 2: Coverage -->
  <rect class="layer layer-coverage" x="50" y="118" width="680" height="82"/>
  <text class="lbl" x="70" y="148">Estimativas de cobertura dos serviços</text>
  <text class="sub" x="70" y="168">Dados DHIS2 + denominadores da população → taxas de cobertura</text>
  <text class="q" x="70" y="186">Que percentagem da população está a ser atingida?</text>
  <text class="freq" x="690" y="148" text-anchor="end">Trimestral</text>

  <!-- Layer 3: HFA -->
  <rect class="layer layer-hfa" x="80" y="216" width="620" height="82"/>
  <text class="lbl" x="100" y="246">Avaliações de instalações de saúde</text>
  <text class="sub" x="100" y="266">Prontidão das instalações, disponibilidade de serviços, factores de produção</text>
  <text class="q" x="100" y="284">O que é que as instalações têm? Estão preparadas para entregar?</text>
  <text class="freq" x="660" y="246" text-anchor="end">Quando disponível</text>

  <!-- Layer 4: Household surveys -->
  <rect class="layer layer-household" x="110" y="314" width="560" height="82"/>
  <text class="lbl-dark" x="130" y="344">Inquéritos aos agregados familiares</text>
  <text class="sub-dark" x="130" y="364">DHS, MICS - indicadores de impacto a nível da população</text>
  <text class="q-dark" x="130" y="382">O que é que as comunidades estão a viver?</text>
  <text class="freq" x="630" y="344" text-anchor="end">Periódico</text>
</svg>
