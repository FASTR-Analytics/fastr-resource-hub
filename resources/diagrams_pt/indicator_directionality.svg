<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340">

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#09544F">Nem todas as mudanças apontam na mesma direção</text>

  <!-- Left column: Going up is good -->
  <g transform="translate(30, 50)">
    <rect x="0" y="0" width="310" height="250" rx="12" fill="#E8F4F3"/>
    <!-- Header -->
    <rect x="0" y="0" width="310" height="44" rx="12" fill="#09544F"/>
    <rect x="0" y="20" width="310" height="24" fill="#09544F"/>
    <text x="40" y="28" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#fff">Subir é bom</text>
    <text x="18" y="28" font-family="Inter, sans-serif" font-size="16" fill="#fff">&#x2191;</text>

    <!-- Items -->
    <text x="25" y="72" font-family="Inter, sans-serif" font-size="12" fill="#09544F">&#x2713;</text>
    <text x="45" y="72" font-family="Inter, sans-serif" font-size="12" fill="#333">Visitas de ANC (ANC1, ANC4)</text>

    <text x="25" y="100" font-family="Inter, sans-serif" font-size="12" fill="#09544F">&#x2713;</text>
    <text x="45" y="100" font-family="Inter, sans-serif" font-size="12" fill="#333">Entregas de instalações</text>

    <text x="25" y="128" font-family="Inter, sans-serif" font-size="12" fill="#09544F">&#x2713;</text>
    <text x="45" y="128" font-family="Inter, sans-serif" font-size="12" fill="#333">Imunizações (Penta1, BCG)</text>

    <text x="25" y="156" font-family="Inter, sans-serif" font-size="12" fill="#09544F">&#x2713;</text>
    <text x="45" y="156" font-family="Inter, sans-serif" font-size="12" fill="#333">Consultas médicas</text>

    <text x="25" y="184" font-family="Inter, sans-serif" font-size="12" fill="#09544F">&#x2713;</text>
    <text x="45" y="184" font-family="Inter, sans-serif" font-size="12" fill="#333">Cobertura %</text>

    <text x="25" y="212" font-family="Inter, sans-serif" font-size="12" fill="#09544F">&#x2713;</text>
    <text x="45" y="212" font-family="Inter, sans-serif" font-size="12" fill="#333">Visitas de cuidados pós-natais</text>

    <text x="25" y="240" font-family="Inter, sans-serif" font-size="12" fill="#09544F">&#x2713;</text>
    <text x="45" y="240" font-family="Inter, sans-serif" font-size="12" fill="#333">Exaustividade dos relatórios</text>
  </g>

  <!-- Right column: Going down is good -->
  <g transform="translate(360, 50)">
    <rect x="0" y="0" width="310" height="250" rx="12" fill="#FDE8E8"/>
    <!-- Header -->
    <rect x="0" y="0" width="310" height="44" rx="12" fill="#C53030"/>
    <rect x="0" y="20" width="310" height="24" fill="#C53030"/>
    <text x="40" y="28" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#fff">Descer é bom</text>
    <text x="18" y="28" font-family="Inter, sans-serif" font-size="16" fill="#fff">&#x2193;</text>

    <!-- Items -->
    <text x="25" y="72" font-family="Inter, sans-serif" font-size="12" fill="#C53030">&#x2713;</text>
    <text x="45" y="72" font-family="Inter, sans-serif" font-size="12" fill="#333">Mortes maternas</text>

    <text x="25" y="100" font-family="Inter, sans-serif" font-size="12" fill="#C53030">&#x2713;</text>
    <text x="45" y="100" font-family="Inter, sans-serif" font-size="12" fill="#333">Complicações neonatais</text>

    <text x="25" y="128" font-family="Inter, sans-serif" font-size="12" fill="#C53030">&#x2713;</text>
    <text x="45" y="128" font-family="Inter, sans-serif" font-size="12" fill="#333">Taxas de abandono escolar</text>

    <text x="25" y="156" font-family="Inter, sans-serif" font-size="12" fill="#C53030">&#x2713;</text>
    <text x="45" y="156" font-family="Inter, sans-serif" font-size="12" fill="#333">Dias de rutura de stock</text>

    <text x="25" y="184" font-family="Inter, sans-serif" font-size="12" fill="#C53030">&#x2713;</text>
    <text x="45" y="184" font-family="Inter, sans-serif" font-size="12" fill="#333">Taxas anómalas</text>

    <text x="25" y="212" font-family="Inter, sans-serif" font-size="12" fill="#C53030">&#x2713;</text>
    <text x="45" y="212" font-family="Inter, sans-serif" font-size="12" fill="#333">Taxas de nados-mortos</text>

    <text x="25" y="240" font-family="Inter, sans-serif" font-size="12" fill="#C53030">&#x2713;</text>
    <text x="45" y="240" font-family="Inter, sans-serif" font-size="12" fill="#333">Taxas de mortalidade de casos</text>
  </g>

  <!-- Bottom note -->
  <text x="350" y="328" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#777" font-style="italic">Pergunte sempre: mais disto significa melhor saúde?</text>

</svg>
