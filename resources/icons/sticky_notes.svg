<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="#09544F">
  <!-- Back note (tilted left) -->
  <g transform="rotate(-8 256 256)">
    <rect x="80" y="80" width="280" height="280" rx="8" opacity="0.5"/>
  </g>
  <!-- Front note (tilted right) -->
  <g transform="rotate(5 256 256)">
    <rect x="150" y="120" width="280" height="280" rx="8"/>
  </g>
</svg>
