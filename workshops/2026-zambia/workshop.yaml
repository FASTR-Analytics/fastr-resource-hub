# Based on ToR: FASTR Working Session, Lusaka, January 27-30, 2026
# ═══════════════════════════════════════════════════════════════════════

workshop:
  name: "In-Country Working Session: FASTR Implementation & RMNCAH-N Service Monitoring Analysis"
  country: Zambia
  location: Lusaka
  venue: Protea Hotel by Marriott Lusaka Safari Lodge
  date: "January 27-30, 2026"
  facilitators: "GFF FASTR Team"
  objectives:
    - "**Introduce the FASTR HMIS analysis platform** - Familiarize participants with the platform's purpose, core features, and functionalities, including workflows, reporting options, and outputs"
    - "**Strengthen analytical and reporting skills** - Enhance participants' capacity to manage data structures, customize visualizations, and produce tailored reports for diverse audiences"
    - "**Prepare MoH for participation in the multi-country workshop** - Configure the FASTR analytics platform for Zambia; Produce the first quarterly report"
    - "**Adapt the FASTR phone survey questionnaire to the Zambian context**"

schedule:
  days: 4

  day_titles:
    1: "Laying the Foundation: Introducing FASTR and Configuring the Analytics Platform"
    2: "Building the Analysis: Applying FASTR Methods and Generating Outputs"
    3: "From Analysis to Action: Interpreting Results and Using FASTR for Decision-Making"
    4: "Designing the Health Facility Assessment"

